// ---- 개인정보 마스킹 유틸 ----
function maskName(name) {
  if (!name) return '';
  const chars = Array.from(name);
  if (chars.length <= 1) return chars.join('');
  if (chars.length === 2) return chars[0] + '*';
  return chars[0] + '*'.repeat(chars.length - 2) + chars[chars.length - 1];
}
function maskPhone(phone) {
  if (!phone) return '';
  const parts = String(phone).split('-');
  if (parts.length === 3) {
    const [a, b, c] = parts;
    const maskedB = '*'.repeat(b.length);
    const maskedC = c.length > 3 ? '*' + c.slice(1) : c;
    return `${a}-${maskedB}-${maskedC}`;
  }
  const s = String(phone);
  return s.length > 6 ? s.slice(0, 3) + '*'.repeat(s.length - 6) + s.slice(-3) : s;
}
function maskAccount(account) {
  if (!account) return '';
  const s = String(account);
  const digitIdx = [];
  for (let i = 0; i < s.length; i++) if (/\d/.test(s[i])) digitIdx.push(i);
  if (digitIdx.length <= 6) return s;
  const hideSet = new Set(digitIdx.slice(3, digitIdx.length - 3));
  return s.split('').map((ch, i) => hideSet.has(i) ? '*' : ch).join('');
}
function MaskedText({ value, type }) {
  const [revealed, setRevealed] = useState(false);
  if (!value) return null;
  const masked = type === 'name' ? maskName(value) : type === 'phone' ? maskPhone(value) : maskAccount(value);
  return (
    <span className="inline-flex items-center gap-1">
      <span>{revealed ? value : masked}</span>
      <button type="button" onClick={(e) => { e.stopPropagation(); setRevealed(r => !r); }} className="text-[11px] leading-none" style={{ color: '#9B998F' }} aria-label={revealed ? '가리기' : '보기'}>
        {revealed ? '🙈' : '👁'}
      </button>
    </span>
  );
}

function LoginPage({ onLogin, onGotoSignup }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setError(''); setLoading(true);
    const { data, error: signInError } = await supabase.auth.signInWithPassword({ email: email.trim(), password });
    if (signInError) {
      const msg = (signInError.message || '').toLowerCase();
      if (msg.includes('confirm')) setError('이메일 인증이 필요합니다. 가입 시 받은 메일에서 인증 링크를 눌러주세요.');
      else setError('이메일 또는 비밀번호가 일치하지 않습니다.');
      setLoading(false); return;
    }
    const { data: profile, error: profileError } = await supabase.from('profiles').select('*').eq('id', data.user.id).single();
    if (profileError || !profile) { setError('프로필 정보를 불러오지 못했습니다.'); setLoading(false); return; }
    if (profile.status === '대기') { setError('관리자 승인 대기 중인 계정입니다. 승인 후 로그인할 수 있습니다.'); await supabase.auth.signOut(); setLoading(false); return; }
    if (profile.status === '거절') { setError('가입이 거절된 계정입니다. 관리자에게 문의해주세요.'); await supabase.auth.signOut(); setLoading(false); return; }
    if (profile.status === '탈퇴') { setError('탈퇴 처리된 계정입니다. 관리자에게 문의해주세요.'); await supabase.auth.signOut(); setLoading(false); return; }
    setLoading(false);
    onLogin(profile);
  }

  return (
    <div style={{ background: '#1C2620', minHeight: '100vh' }} className="w-full flex items-center justify-center px-5">
      <div style={{ background: '#FFFFFF' }} className="w-full max-w-sm rounded-2xl p-6">

function Leaderboard({ salesUsers, customers, currentUserId }) {
  const rows = salesUsers.map(u => {
    const deals = customers.filter(c => c.rep_id === u.id && c.status === '계약완료').length;
    return { id: u.id, name: u.name, deals, incentive: deals * INCENTIVE_PER_DEAL };
  }).sort((a, b) => b.deals - a.deals);
  const maxDeals = Math.max(1, ...rows.map(r => r.deals));
  return (
    <div className="rounded-xl p-3.5" style={{ background: '#FFFFFF', border: '1px solid #E4E2D9' }}>
      <div className="flex items-center gap-1.5 mb-2.5">
        <span className="text-[15px]">🏆</span>
        <p className="text-[13px] font-medium" style={{ color: '#1C2620' }}>영업사원별 유치완료 현황</p>
      </div>
      <div className="flex flex-col gap-2.5">
        {rows.length === 0 && <p className="text-[12.5px]" style={{ color: '#B0AEA4' }}>승인된 영업사원이 없습니다.</p>}
        {rows.map((r, i) => {
          const isMe = r.id === currentUserId;
          return (
            <div key={r.id} className="flex items-center gap-2.5">
              <span className="text-[12px] w-4 text-center shrink-0" style={{ color: i === 0 && r.deals > 0 ? '#C98A2E' : '#B0AEA4' }}>{i + 1}</span>
              <span className="text-[13px] w-16 shrink-0 font-medium truncate" style={{ color: isMe ? '#2F6B4F' : '#1C2620' }}>{r.name}{isMe ? ' (나)' : ''}</span>
              <div className="flex-1 h-2 rounded-full overflow-hidden" style={{ background: '#EFEEE8' }}>
                <div style={{ width: (r.deals / maxDeals * 100) + '%', background: isMe ? '#2F6B4F' : '#B4B2A9' }} className="h-full rounded-full" />
              </div>
              <span className="text-[12px] w-14 text-right shrink-0" style={{ color: '#6B6A63' }}>{r.deals}건</span>
              <span className="text-[12px] w-20 text-right shrink-0 font-medium" style={{ color: '#854F0B' }}>{currency(r.incentive)}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Announcements({ isAdmin, announcements, onPost, onUpdate, onDelete }) {
  const [text, setText] = useState('');
  const [showPast, setShowPast] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editText, setEditText] = useState('');
  const latest = announcements[0];
  const past = announcements.slice(1);

  function startEdit(a) { setEditingId(a.id); setEditText(a.content); }
  function saveEdit() { if (editText.trim()) onUpdate(editingId, editText.trim()); setEditingId(null); }

  function Item({ a, highlight }) {
    if (editingId === a.id) {
      return (
        <div className="rounded-lg p-3" style={{ background: highlight ? '#FFF7E8' : '#F7F6F2', border: '1px solid ' + (highlight ? '#F0D9A0' : '#E4E2D9') }}>
          <textarea value={editText} onChange={e => setEditText(e.target.value)} rows={2} className="w-full rounded-lg px-2 py-1.5 text-[13px] outline-none" style={{ background: '#FFFFFF', border: '1px solid #E4E2D9', color: '#1C2620' }} />
          <div className="flex gap-2 mt-2">
            <button onClick={() => setEditingId(null)} className="flex-1 text-[12px] py-1.5 rounded-lg" style={{ border: '1px solid #E4E2D9', color: '#4A4A45' }}>취소</button>
            <button onClick={saveEdit} className="flex-1 text-[12px] py-1.5 rounded-lg" style={{ background: '#2F6B4F', color: '#FFFFFF' }}>저장</button>
          </div>
        </div>
      );
    }
    return (
      <div className="rounded-lg p-3" style={{ background: highlight ? '#FFF7E8' : '#F7F6F2', border: '1px solid ' + (highlight ? '#F0D9A0' : '#E4E2D9') }}>
        <p className="text-[13px] whitespace-pre-wrap" style={{ color: highlight ? '#1C2620' : '#4A4A45' }}>{a.content}</p>
        <div className="flex items-center justify-between mt-1.5">
          <p className="text-[11px]" style={{ color: '#B0AEA4' }}>{new Date(a.created_at).toLocaleString('ko-KR')}</p>
          {isAdmin && (
            <div className="flex gap-2.5">
              <button onClick={() => startEdit(a)} className="text-[11px] font-medium" style={{ color: '#0C447C' }}>수정</button>
              <button onClick={() => { if (confirm('이 공지사항을 삭제할까요?')) onDelete(a.id); }} className="text-[11px] font-medium" style={{ color: '#A32D2D' }}>삭제</button>
            </div>
          )}
        </div>
      </div>
    );
  }

  return (
    <div className="rounded-xl p-3.5" style={{ background: '#FFFFFF', border: '1px solid #E4E2D9' }}>
      <div className="flex items-center gap-1.5 mb-2.5">
        <span className="text-[15px]">📢</span>
        <p className="text-[13px] font-medium" style={{ color: '#1C2620' }}>공지사항</p>
      </div>
      {latest ? <Item a={latest} highlight={true} /> : <p className="text-[12.5px]" style={{ color: '#B0AEA4' }}>등록된 공지사항이 없습니다.</p>}

      {isAdmin && (
        <div className="flex gap-2 mt-2.5">
          <input value={text} onChange={e => setText(e.target.value)} placeholder="새 공지사항을 입력하세요" style={{ background: '#F7F6F2', border: '1px solid #E4E2D9', color: '#1C2620' }} className="flex-1 rounded-lg px-3 py-2 text-sm outline-none" />
          <button onClick={() => { if (text.trim()) { onPost(text.trim()); setText(''); } }} style={{ background: '#2F6B4F', color: '#FFFFFF' }} className="px-3.5 rounded-lg text-sm font-medium">등록</button>
        </div>
      )}

      {past.length > 0 && (
        <button onClick={() => setShowPast(s => !s)} className="text-[12px] mt-3" style={{ color: '#6B6A63' }}>
          {showPast ? '지난 공지사항 닫기 ▲' : `지난 공지사항 보기 (${past.length}) ▼`}
        </button>
      )}
      {showPast && (
        <div className="flex flex-col gap-2 mt-2">
          {past.map(a => <Item key={a.id} a={a} highlight={false} />)}
        </div>
      )}
    </div>
  );
}

function CompletedDealsPanel({ customers, staffDirectory, onOpenDetail }) {
  const [selectedStaff, setSelectedStaff] = useState(() => {
    const init = {};
    staffDirectory.forEach(u => { init[u.id] = true; });
    return init;
  });
  const [search, setSearch] = useState('');

  useEffect(() => {
    setSelectedStaff(prev => {
      const next = { ...prev };
      staffDirectory.forEach(u => { if (!(u.id in next)) next[u.id] = true; });
      return next;
    });
  }, [staffDirectory]);

  function toggleStaff(id) { setSelectedStaff(prev => ({ ...prev, [id]: !prev[id] })); }
  function selectAllStaff() { const next = {}; staffDirectory.forEach(u => { next[u.id] = true; }); setSelectedStaff(next); }
  function clearAllStaff() { const next = {}; staffDirectory.forEach(u => { next[u.id] = false; }); setSelectedStaff(next); }

  const nameOf = (id) => (staffDirectory.find(u => u.id === id) || {}).name || '미배정';

  const completed = customers.filter(c => c.status === '계약완료');
  const list = completed.filter(c => {
    if (!c.rep_id || !selectedStaff[c.rep_id]) return false;
    if (!search.trim()) return true;
    const q = search.trim().toLowerCase();
    return `${c.name} ${c.phone} ${c.complex}`.toLowerCase().includes(q);
  }).sort((a, b) => new Date(b.contract_date || b.visit_date) - new Date(a.contract_date || a.visit_date));

  return (
    <div className="flex flex-col gap-3">
      <div className="rounded-xl p-3.5" style={{ background: '#FFFFFF', border: '1px solid #E4E2D9' }}>
        <div className="flex items-center justify-between mb-2">
          <p className="text-[13px] font-medium" style={{ color: '#1C2620' }}>담당자별 보기</p>
          <div className="flex gap-2">
            <button onClick={selectAllStaff} className="text-[11.5px]" style={{ color: '#0C447C' }}>전체 선택</button>
            <button onClick={clearAllStaff} className="text-[11.5px]" style={{ color: '#A32D2D' }}>전체 해제</button>
          </div>
        </div>
        <div className="flex flex-wrap gap-2">
          {staffDirectory.map(u => (
            <label key={u.id} className="flex items-center gap-1.5 text-[12.5px] px-2.5 py-1.5 rounded-full" style={{ background: selectedStaff[u.id] ? '#E1F5EE' : '#F7F6F2', border: '1px solid ' + (selectedStaff[u.id] ? '#5DCAA5' : '#E4E2D9'), color: selectedStaff[u.id] ? '#085041' : '#6B6A63' }}>
              <input type="checkbox" checked={!!selectedStaff[u.id]} onChange={() => toggleStaff(u.id)} />
              {u.name}{u.role === 'admin' ? ' (관리자)' : ''}
            </label>
          ))}
        </div>
      </div>

      <div className="relative">
        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-sm" style={{ color: '#9B998F' }}>🔍</span>
        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="이름, 연락처, 단지명으로 검색" style={{ background: '#FFFFFF', border: '1px solid #E4E2D9', color: '#1C2620' }} className="w-full text-sm rounded-lg pl-9 pr-3 py-2.5 outline-none" />
      </div>

      <p className="text-[12.5px]" style={{ color: '#6B6A63' }}>선택한 담당자 계약완료 <span className="font-semibold" style={{ color: '#1C2620' }}>{list.length}건</span></p>

      <div className="flex flex-col gap-2.5">
        {list.length === 0 && <div className="text-center py-10 rounded-xl" style={{ background: '#FFFFFF', border: '1px solid #E4E2D9' }}><p className="text-sm" style={{ color: '#9B998F' }}>표시할 계약완료 건이 없습니다.</p></div>}
        {list.map(c => (
          <div key={c.id} onClick={() => onOpenDetail(c)} className="rounded-xl p-3.5 cursor-pointer" style={{ background: '#FFFFFF', border: '1px solid #E4E2D9' }}>
            <div className="flex items-center gap-2 flex-wrap">
              <span className="font-semibold text-[15px]" style={{ color: '#1C2620' }}><MaskedText value={c.name} type="name" /></span>
              <StatusBadge status={c.status} />
            </div>
            <p className="text-[13px] mt-1 flex items-center gap-1" style={{ color: '#6B6A63' }}>📍 {c.complex}{c.unit ? ' · ' + c.unit : ''}</p>
            <div className="flex items-center flex-wrap gap-x-4 gap-y-1 mt-2 text-[12.5px]" style={{ color: '#6B6A63' }}>
              <span className="flex items-center gap-1">☎ <MaskedText value={c.phone} type="phone" /></span>
              <span className="flex items-center gap-1">📅 계약일 {c.contract_date || c.visit_date}</span>
              <span className="flex items-center gap-1">👤 {nameOf(c.rep_id)}</span>
            </div>
            {c.amount > 0 && <p className="text-[13px] font-medium mt-1.5" style={{ color: '#085041' }}>월 {currency(c.amount)}</p>}
          </div>
        ))}
      </div>
    </div>
  );
}

function exportCustomersToExcel(rows, salesUsers, filename) {
  if (!window.XLSX) { alert('엑셀 내보내기 기능을 불러오지 못했습니다.'); return; }
  const repName = (id) => (salesUsers.find(u => u.id === id) || {}).name || '';
  const data = rows.map(c => ({
    'DB시작일': c.visit_date || '', '계약일': c.contract_date || '', '고객명': c.name || '', '연락처': c.phone || '',
    '계약자명': c.contractor_name || '', '차량번호': c.car_number || '', '주소': c.address || '', '상세주소': c.address_detail || '',
    '입금자명': c.depositor_name || '', '입차시간': c.entry_time || '', '출차시간': c.exit_time || '', '상품': c.product || '', '월이용료': c.amount || 0,
    '담당영업사원': repName(c.rep_id), '상태': c.status || '', '메모': c.memo || '',
  }));
  const ws = window.XLSX.utils.json_to_sheet(data);
  const wb = window.XLSX.utils.book_new();
  window.XLSX.utils.book_append_sheet(wb, ws, '계약내역');
  window.XLSX.writeFile(wb, filename);
}

function getMonthCells(year, month) {
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  return cells;
}

function isInCurrentWeek(dateStr) {
  if (!dateStr) return false;
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  const day = now.getDay();
  const diffToMonday = (day === 0 ? -6 : 1 - day);
  const monday = new Date(now); monday.setDate(now.getDate() + diffToMonday); monday.setHours(0, 0, 0, 0);
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6); sunday.setHours(23, 59, 59, 999);
  return d >= monday && d <= sunday;
}
function isInLastMonth(dateStr) {
  if (!dateStr) return false;
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  const lastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  return d.getFullYear() === lastMonth.getFullYear() && d.getMonth() === lastMonth.getMonth();
}

        {qrCodes.length === 0 && <div className="text-center py-10 rounded-xl" style={{ background: '#FFFFFF', border: '1px solid #E4E2D9' }}><p className="text-sm" style={{ color: '#9B998F' }}>등록된 단지 QR이 없습니다.</p></div>}
        {qrCodes.map(q => {
          const link = `${baseUrl}?inquiry=1&apt=${encodeURIComponent(q.complex)}`;
          const qrImg = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(link)}`;
          return (
            <div key={q.id} className="rounded-xl p-3.5" style={{ background: '#FFFFFF', border: '1px solid #E4E2D9' }}>
              <div className="flex items-center justify-between mb-2">
                <p className="font-semibold text-[14px]" style={{ color: '#1C2620' }}>{q.complex}</p>
                <button onClick={() => { if (confirm('이 QR을 삭제할까요?')) onDelete(q.id); }} className="text-[11.5px] font-medium" style={{ color: '#A32D2D' }}>삭제</button>
              </div>
              <div className="flex flex-col items-center gap-2 py-1">
                <img src={qrImg} alt={`${q.complex} QR 코드`} width={150} height={150} style={{ borderRadius: '8px', border: '1px solid #E4E2D9' }} />
              </div>
              <div className="flex gap-2 mt-2">
                <input readOnly value={link} className="flex-1 text-[11.5px] rounded-lg px-3 py-2 outline-none" style={{ background: '#F7F6F2', border: '1px solid #E4E2D9', color: '#4A4A45' }} />
                <button onClick={() => copyLink(q.id, link)} style={{ background: '#2F6B4F', color: '#FFFFFF' }} className="px-3.5 rounded-lg text-[12px] font-medium whitespace-nowrap">{copiedId === q.id ? '복사됨' : '복사'}</button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Dashboard({ currentUser, onLogout }) {
  const isAdmin = currentUser.role === 'admin';
  const myId = currentUser.id;
  const [tab, setTab] = useState('customers');
  const [search, setSearch] = useState('');
  const [statusFilter, setStatusFilter] = useState('전체');
  const [repFilter, setRepFilter] = useState('전체');
  const [marketingFilter, setMarketingFilter] = useState('전체');
  const [myDbFilter, setMyDbFilter] = useState('all');
  const [bulkSelected, setBulkSelected] = useState({});
  const [editing, setEditing] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [customers, setCustomers] = useState([]);
  const [salesUsers, setSalesUsers] = useState([]);
  const [pendingUsers, setPendingUsers] = useState([]);
  const [departedUsers, setDepartedUsers] = useState([]);
  const [accessLogs, setAccessLogs] = useState([]);
  const [qrCodes, setQrCodes] = useState([]);
  const [staffDirectory, setStaffDirectory] = useState([]);
  const [announcements, setAnnouncements] = useState([]);
  const [allStaff, setAllStaff] = useState([]);
  const [inboxMessages, setInboxMessages] = useState([]);
  const [sentMessages, setSentMessages] = useState([]);
  const [scripts, setScripts] = useState({});
  const [showInbox, setShowInbox] = useState(false);
  const [messageTarget, setMessageTarget] = useState(null);
  const [loading, setLoading] = useState(true);

  async function loadAll() {
    setLoading(true);
    const { data: custData } = await supabase.from('customers').select('*').order('created_at', { ascending: false }).limit(5000);
    setCustomers(custData || []);
    const { data: salesData } = await supabase.from('profiles').select('*').eq('role', 'sales').eq('status', '승인');
    setSalesUsers(salesData || []);
    const { data: annData } = await supabase.from('announcements').select('*').order('created_at', { ascending: false });
    setAnnouncements(annData || []);
    const { data: staffData } = await supabase.from('profiles').select('*').eq('status', '승인');
    setAllStaff(staffData || []);
    const { data: recvData } = await supabase.from('messages').select('*').eq('to_user', myId).order('created_at', { ascending: false });
    setInboxMessages(recvData || []);
    const { data: sentData } = await supabase.from('messages').select('*').eq('from_user', myId).order('created_at', { ascending: false });
    setSentMessages(sentData || []);
    const { data: scriptData } = await supabase.from('scripts').select('*');
    const scriptMap = {};
    (scriptData || []).forEach(s => { scriptMap[s.id] = s.content; });
    setScripts(scriptMap);
    const { data: dirData } = await supabase.rpc('list_staff_directory');
    setStaffDirectory(dirData || []);
    if (isAdmin) {
      const { data: pendingData } = await supabase.from('profiles').select('*').eq('status', '대기');
      setPendingUsers(pendingData || []);
      const { data: departedData } = await supabase.from('profiles').select('*').eq('status', '탈퇴');
      setDepartedUsers(departedData || []);
      const { data: logData } = await supabase.from('access_logs').select('*').order('created_at', { ascending: false }).limit(500);
      setAccessLogs(logData || []);
      const { data: qrData } = await supabase.from('qr_codes').select('*').order('created_at', { ascending: false });
      setQrCodes(qrData || []);
    }
    setLoading(false);
  }

  useEffect(() => { loadAll(); }, []);
  useEffect(() => {
    const interval = setInterval(() => { loadAll(); }, 3600000);
    return () => clearInterval(interval);
  }, []);

  const repName = (id) => {
    const active = salesUsers.find(u => u.id === id);
    if (active) return active.name;
    const departed = departedUsers.find(u => u.id === id);
    if (departed) return `${departed.name} (퇴사원)`;
    return '미배정';
  };
  const canEdit = (c) => isAdmin || c.rep_id === myId;
  const departedCustomers = useMemo(() => customers.filter(c => c.rep_id && departedUsers.some(u => u.id === c.rep_id)), [customers, departedUsers]);
  const inquiryCustomers = useMemo(() => customers.filter(c => c.status === '청약대기').sort((a, b) => new Date(b.visit_date) - new Date(a.visit_date)), [customers]);
  const unreviewedInquiryCount = useMemo(() => inquiryCustomers.filter(c => !c.reviewed).length, [inquiryCustomers]);

  const filtered = useMemo(() => customers.filter(c => {
    if (!c.rep_id) return false;
    if (departedUsers.some(u => u.id === c.rep_id)) return false;
    if (!isAdmin && myDbFilter !== 'all') {
      if (c.rep_id !== myId) return false;
      if (myDbFilter === 'today') { if (c.visit_date !== new Date().toISOString().slice(0, 10)) return false; }
      else if (myDbFilter === 'week') { if (!isInCurrentWeek(c.visit_date)) return false; }
      else if (myDbFilter === 'lastmonth') { if (!isInLastMonth(c.visit_date)) return false; }
      else if (myDbFilter === 'uncontracted') { if (!(c.call1 && c.sms2 && c.recall3 && c.status !== '계약완료')) return false; }
    }
    if (statusFilter !== '전체' && c.status !== statusFilter) return false;
    if (isAdmin && repFilter !== '전체' && c.rep_id !== repFilter) return false;
    if (isAdmin && marketingFilter === '동의' && !c.marketing_consent) return false;
    if (isAdmin && marketingFilter === '미동의' && c.marketing_consent) return false;
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      if (!`${c.name} ${c.phone} ${c.complex} ${c.unit}`.toLowerCase().includes(q)) return false;
    }
    return true;
  }), [customers, search, statusFilter, repFilter, isAdmin, myDbFilter, myId, marketingFilter, departedUsers]);

  const unassignedCustomers = useMemo(() => customers.filter(c => !c.rep_id && c.status !== '청약대기'), [customers]);

  const scope = isAdmin ? customers.filter(c => c.rep_id) : customers.filter(c => c.rep_id === myId);
  const stats = useMemo(() => {
    const total = scope.length;
    const contracted = scope.filter(c => c.status === '계약완료').length;
    const inTalk = scope.filter(c => c.status === '상담중').length;
    return { total, contracted, inTalk, incentive: contracted * INCENTIVE_PER_DEAL };
  }, [scope]);
  const companyIncentive = useMemo(() => customers.filter(c => c.status === '계약완료').length * INCENTIVE_PER_DEAL, [customers]);

  async function toggleStage(id, key) {
    const target = customers.find(c => c.id === id);
    const newVal = !target[key];
    setCustomers(prev => prev.map(c => c.id === id ? { ...c, [key]: newVal } : c));
    await supabase.from('customers').update({ [key]: newVal }).eq('id', id);
  }

  async function logAccess(action, customer) {
    try {
      await supabase.from('access_logs').insert({ actor_id: myId, actor_name: currentUser.name, action, customer_id: customer.id, customer_name: customer.name });
    } catch (e) { /* 로그 실패는 조용히 무시 */ }
  }
  async function refreshAccessLogs() {
    const { data: logData } = await supabase.from('access_logs').select('*').order('created_at', { ascending: false }).limit(500);
    setAccessLogs(logData || []);
  }

  function openNew() {
    setEditing({ id: null, name: '', phone: '', complex: '', unit: '', visit_date: new Date().toISOString().slice(0, 10), rep_id: isAdmin ? (salesUsers[0] ? salesUsers[0].id : null) : myId, status: '신규', product: '', amount: 0, memo: '', call1: false, sms2: false, recall3: false });
  }

  function openExisting(c) {
    setEditing({ ...c });
    logAccess('조회', c);
  }

  async function openInquiry(c) {
    if (!c.reviewed) {
      await supabase.from('customers').update({ reviewed: true }).eq('id', c.id);
      setCustomers(prev => prev.map(x => x.id === c.id ? { ...x, reviewed: true } : x));
    }
    setEditing({ ...c, reviewed: true });
    logAccess('조회', c);
  }

  async function addQrCode(complex) {
    const { data, error } = await supabase.from('qr_codes').insert({ complex, created_by: myId }).select().single();
    if (!error) setQrCodes(prev => [data, ...prev]);
  }
  async function deleteQrCode(id) {
    await supabase.from('qr_codes').delete().eq('id', id);
    setQrCodes(prev => prev.filter(q => q.id !== id));
  }

  async function saveCustomer(rawData) {
    const data = { ...rawData, rep_id: rawData.rep_id || null };
    if (data.id == null) {
      const { id, ...rest } = data;
      const { data: inserted, error } = await supabase.from('customers').insert(rest).select().single();
      if (!error) { setCustomers(prev => [inserted, ...prev]); logAccess('등록', inserted); }
    } else {
      const { id, ...rest } = data;
      const { error } = await supabase.from('customers').update(rest).eq('id', id);
      if (!error) { setCustomers(prev => prev.map(c => c.id === id ? data : c)); logAccess('수정', data); }
    }
    setEditing(null);
  }

  async function deleteCustomer(id) {
    await supabase.from('customers').delete().eq('id', id);
    setCustomers(prev => prev.filter(c => c.id !== id));
    setConfirmDelete(null);
    setEditing(null);
  }

  async function approveUser(id) {
    await supabase.from('profiles').update({ status: '승인' }).eq('id', id);
    setPendingUsers(prev => prev.filter(u => u.id !== id));
    loadAll();
  }
  async function rejectUser(id) {
    await supabase.from('profiles').update({ status: '거절' }).eq('id', id);
    setPendingUsers(prev => prev.filter(u => u.id !== id));
  }
  async function withdrawUser(id) {
    if (!confirm('이 영업사원을 탈퇴 처리할까요? 더 이상 로그인할 수 없게 되고, 저장된 개인정보(연락처·생년월일·계좌·주소)는 자동으로 파기됩니다.')) return;
    const departedUser = salesUsers.find(u => u.id === id) || allStaff.find(u => u.id === id);
    await supabase.from('profiles').update({ status: '탈퇴' }).eq('id', id);
    setSalesUsers(prev => prev.filter(u => u.id !== id));
    setAllStaff(prev => prev.filter(u => u.id !== id));
    if (departedUser) setDepartedUsers(prev => [...prev, { ...departedUser, status: '탈퇴' }]);
  }
  async function deleteAccountCompletely(user) {
    if (!confirm(`${user.name}님의 로그인 계정을 완전히 삭제할까요?\n이메일/비밀번호를 포함한 모든 정보가 영구 삭제되며 되돌릴 수 없습니다.`)) return;
    const { data, error } = await supabase.functions.invoke('hyper-function', { body: { user_id: user.id } });
    if (error || (data && data.error)) {
      alert('삭제에 실패했습니다: ' + (data && data.error ? data.error : (error ? error.message : '알 수 없는 오류')));
      return;
    }
    setSalesUsers(prev => prev.filter(u => u.id !== user.id));
    setAllStaff(prev => prev.filter(u => u.id !== user.id));
  }
  async function postAnnouncement(content) {
    const { data, error } = await supabase.from('announcements').insert({ content, created_by: myId }).select().single();
    if (!error) setAnnouncements(prev => [data, ...prev]);
  }
  async function updateAnnouncement(id, content) {
    await supabase.from('announcements').update({ content }).eq('id', id);
    setAnnouncements(prev => prev.map(a => a.id === id ? { ...a, content } : a));
  }
  async function deleteAnnouncement(id) {
    await supabase.from('announcements').delete().eq('id', id);
    setAnnouncements(prev => prev.filter(a => a.id !== id));
  }
  async function sendMessage(toId, content) {
    const { data, error } = await supabase.from('messages').insert({ to_user: toId, from_user: myId, content }).select().single();
    if (!error) setSentMessages(prev => [data, ...prev]);
    setMessageTarget(null);
  }
  async function markMessageRead(id) {
    await supabase.from('messages').update({ is_read: true }).eq('id', id);
    setInboxMessages(prev => prev.map(m => m.id === id ? { ...m, is_read: true } : m));
  }
  async function deleteMessage(id) {
    await supabase.from('messages').delete().eq('id', id);
    setInboxMessages(prev => prev.filter(m => m.id !== id));
    setSentMessages(prev => prev.filter(m => m.id !== id));
  }
  async function saveScript(id, content) {
    await supabase.from('scripts').upsert({ id, content, updated_at: new Date().toISOString() });
    setScripts(prev => ({ ...prev, [id]: content }));
  }
  function chunkArray(arr, size) {
    const out = [];
    for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
    return out;
  }
  async function distributeAmongReps(list, label) {
    if (salesUsers.length === 0) { alert('승인된 영업사원이 없습니다.'); return; }
    if (list.length === 0) return;
    if (!confirm(`${label} ${list.length}명을 영업사원 ${salesUsers.length}명에게 균등하게 나눠 배분할까요?`)) return;
    const groups = salesUsers.map(() => []);
    list.forEach((c, i) => groups[i % salesUsers.length].push(c.id));
    for (let i = 0; i < salesUsers.length; i++) {
      for (const batch of chunkArray(groups[i], 100)) {
        if (batch.length === 0) continue;
        await supabase.from('customers').update({ rep_id: salesUsers[i].id }).in('id', batch);
      }
    }
    await loadAll();
  }
  async function assignToRep(ids, repId) {
    for (const batch of chunkArray(ids, 100)) {
      await supabase.from('customers').update({ rep_id: repId }).in('id', batch);
    }
    setCustomers(prev => prev.map(c => ids.includes(c.id) ? { ...c, rep_id: repId } : c));
  }
  const bulkSelectedCount = Object.values(bulkSelected).filter(Boolean).length;
  function toggleBulkSelect(id) { setBulkSelected(prev => ({ ...prev, [id]: !prev[id] })); }
  async function bulkUnassign() {
    const ids = Object.keys(bulkSelected).filter(id => bulkSelected[id]).map(Number);
    if (ids.length === 0) return;
    if (!confirm(`선택한 ${ids.length}건을 미배정 상태로 되돌릴까요?`)) return;
    for (const batch of chunkArray(ids, 100)) {
      await supabase.from('customers').update({ rep_id: null }).in('id', batch);
    }
    setCustomers(prev => prev.map(c => ids.includes(c.id) ? { ...c, rep_id: null } : c));
    setBulkSelected({});
  }
  async function bulkDeleteCustomers(ids) {
    for (const batch of chunkArray(ids, 100)) {
      await supabase.from('customers').delete().in('id', batch);
    }
    setCustomers(prev => prev.filter(c => !ids.includes(c.id)));
  }

  if (loading) {
    return <div style={{ background: '#EFF1EC', minHeight: '100vh' }} className="w-full flex items-center justify-center"><p style={{ color: '#6B6A63' }} className="text-sm">불러오는 중...</p></div>;
  }

  return (
    <div style={{ background: '#EFF1EC', minHeight: '100vh' }} className="w-full pb-24">
      <div style={{ background: '#1C2620' }} className="px-4 pt-5 pb-4 sticky top-0 z-10">
        <div className="flex items-center justify-between gap-3">
          <div>
            <p className="text-[11px] tracking-wide uppercase" style={{ color: '#8FA89A' }}>방문 세차 정기권 · 신규고객관리</p>
            <h1 className="text-lg font-semibold" style={{ color: '#FFFFFF' }}>{currentUser.name}{isAdmin ? ' (관리자)' : ' 영업사원'}</h1>
          </div>
          <div className="flex items-center gap-2 shrink-0">
            <button onClick={loadAll} style={{ background: '#2A362E', color: '#FFFFFF', border: '1px solid #3D4A41' }} className="flex items-center justify-center text-sm rounded-lg w-10 h-10" aria-label="새로고침">
              🔄
            </button>
            <button onClick={() => setShowInbox(true)} style={{ background: '#2A362E', color: '#FFFFFF', border: '1px solid #3D4A41' }} className="relative flex items-center justify-center text-sm rounded-lg w-10 h-10">
              🔔
              {inboxMessages.some(m => !m.is_read) && <span style={{ background: '#C98A2E' }} className="absolute -top-1 -right-1 w-3.5 h-3.5 rounded-full" />}
            </button>
            <button onClick={onLogout} style={{ background: '#2A362E', color: '#FFFFFF', border: '1px solid #3D4A41' }} className="flex items-center gap-1.5 text-sm rounded-lg px-3 py-2">↩ 로그아웃</button>
          </div>
        </div>
        {isAdmin && (
          <div className="flex gap-2 mt-4 overflow-x-auto">
            <button onClick={() => setTab('customers')} style={{ background: tab === 'customers' ? '#FFFFFF' : 'transparent', color: tab === 'customers' ? '#1C2620' : '#8FA89A' }} className="text-[13px] font-medium px-3 py-1.5 rounded-lg whitespace-nowrap">고객 관리</button>
            <button onClick={() => setTab('approvals')} style={{ background: tab === 'approvals' ? '#FFFFFF' : 'transparent', color: tab === 'approvals' ? '#1C2620' : '#8FA89A' }} className="flex items-center gap-1.5 text-[13px] font-medium px-3 py-1.5 rounded-lg whitespace-nowrap">
              가입 승인 {pendingUsers.length > 0 && <span style={{ background: '#C98A2E', color: '#FFFFFF' }} className="text-[10px] px-1.5 py-0.5 rounded-full">{pendingUsers.length}</span>}
            </button>
            <button onClick={() => setTab('staff')} style={{ background: tab === 'staff' ? '#FFFFFF' : 'transparent', color: tab === 'staff' ? '#1C2620' : '#8FA89A' }} className="text-[13px] font-medium px-3 py-1.5 rounded-lg whitespace-nowrap">직원 관리</button>
            <button onClick={() => setTab('stats')} style={{ background: tab === 'stats' ? '#FFFFFF' : 'transparent', color: tab === 'stats' ? '#1C2620' : '#8FA89A' }} className="text-[13px] font-medium px-3 py-1.5 rounded-lg whitespace-nowrap">계약 현황</button>
            <button onClick={() => setTab('unassigned')} style={{ background: tab === 'unassigned' ? '#FFFFFF' : 'transparent', color: tab === 'unassigned' ? '#1C2620' : '#8FA89A' }} className="flex items-center gap-1.5 text-[13px] font-medium px-3 py-1.5 rounded-lg whitespace-nowrap">
              미배정DB {unassignedCustomers.length > 0 && <span style={{ background: '#C98A2E', color: '#FFFFFF' }} className="text-[10px] px-1.5 py-0.5 rounded-full">{unassignedCustomers.length}</span>}
            </button>
            <button onClick={() => setTab('inquiry')} style={{ background: tab === 'inquiry' ? '#FFFFFF' : 'transparent', color: tab === 'inquiry' ? '#1C2620' : '#8FA89A' }} className="flex items-center gap-1.5 text-[13px] font-medium px-3 py-1.5 rounded-lg whitespace-nowrap">
              청약대기 {unreviewedInquiryCount > 0 && <span style={{ background: '#6B3FA0', color: '#FFFFFF' }} className="text-[10px] px-1.5 py-0.5 rounded-full">{unreviewedInquiryCount}</span>}
            </button>
            <button onClick={() => setTab('completed')} style={{ background: tab === 'completed' ? '#FFFFFF' : 'transparent', color: tab === 'completed' ? '#1C2620' : '#8FA89A' }} className="text-[13px] font-medium px-3 py-1.5 rounded-lg whitespace-nowrap">계약완료</button>
            <button onClick={() => setTab('departed')} style={{ background: tab === 'departed' ? '#FFFFFF' : 'transparent', color: tab === 'departed' ? '#1C2620' : '#8FA89A' }} className="flex items-center gap-1.5 text-[13px] font-medium px-3 py-1.5 rounded-lg whitespace-nowrap">
              퇴사원DB {departedCustomers.length > 0 && <span style={{ background: '#A32D2D', color: '#FFFFFF' }} className="text-[10px] px-1.5 py-0.5 rounded-full">{departedCustomers.length}</span>}
            </button>
            <button onClick={() => setTab('logs')} style={{ background: tab === 'logs' ? '#FFFFFF' : 'transparent', color: tab === 'logs' ? '#1C2620' : '#8FA89A' }} className="text-[13px] font-medium px-3 py-1.5 rounded-lg whitespace-nowrap">접근 로그</button>
            <button onClick={() => setTab('qr')} style={{ background: tab === 'qr' ? '#FFFFFF' : 'transparent', color: tab === 'qr' ? '#1C2620' : '#8FA89A' }} className="text-[13px] font-medium px-3 py-1.5 rounded-lg whitespace-nowrap">단지별QR</button>
          </div>
        )}
        {!isAdmin && (
          <div className="flex gap-2 mt-4 overflow-x-auto">
            {[
              { key: 'all', label: '전체' },
              { key: 'today', label: '오늘 DB' },
              { key: 'week', label: '이번주 DB' },
              { key: 'lastmonth', label: '지난달 DB' },

                <button key={s.key} type="button" onClick={() => toggleStage(s.key)} style={{ background: done ? '#2F6B4F' : '#F7F6F2', color: done ? '#FFFFFF' : '#6B6A63', border: '1px solid ' + (done ? '#2F6B4F' : '#E4E2D9') }} className="flex-1 flex items-center justify-center gap-1.5 rounded-lg py-2 text-[12.5px] font-medium">
                  <span>{done ? '✔' : s.icon}</span>{s.label}

function ApplicationModal({ base, repName, onClose, onSubmit }) {
  const [form, setForm] = useState({
    ...base,
    contractor_name: base.contractor_name || '',
    car_number: base.car_number || '',
    address: base.address || '',
    address_detail: base.address_detail || '',
    depositor_name: base.depositor_name || '',
    entry_time: base.entry_time || '',
    exit_time: base.exit_time || '',
  });
  const [freq, setFreq] = useState('');
  const [size, setSize] = useState('');
  const [isForeign, setIsForeign] = useState(false);
  const [sameAsCustomer, setSameAsCustomer] = useState(false);
  const [sameAsContractor, setSameAsContractor] = useState(false);
  const [privacyConsent, setPrivacyConsent] = useState(!!base.privacy_consent);
  const [marketingConsent, setMarketingConsent] = useState(!!base.marketing_consent);
  const [showPolicy, setShowPolicy] = useState(false);
  const [error, setError] = useState('');
  const set = (k, v) => setForm(prev => ({ ...prev, [k]: v }));
  const inputStyle = { background: '#F7F6F2', border: '1px solid #E4E2D9', color: '#1C2620' };
  const currentPrice = (freq && size) ? PRICE_TABLE[freq][size] + (isForeign ? 5000 : 0) : null;

  useEffect(() => {
    if (sameAsCustomer) set('contractor_name', form.name || '');
  }, [sameAsCustomer, form.name]);

  useEffect(() => {
    if (sameAsContractor) set('depositor_name', form.contractor_name || '');
  }, [sameAsContractor, form.contractor_name]);

  function openAddressSearch() {
    if (!window.daum || !window.daum.Postcode) {
      alert('주소 검색 기능을 불러오지 못했습니다. 페이지를 새로고침한 뒤 인터넷 연결 상태에서 다시 시도해주세요.');
      return;
    }
    new window.daum.Postcode({
      oncomplete: function (data) {
        const addr = data.roadAddress || data.address;
        set('address', addr);
      }
    }).open();
  }

  function handleSubmit() {
    if (!form.contractor_name.trim() || !form.car_number.trim() || !form.address.trim() || !form.depositor_name.trim() || !form.entry_time || !form.exit_time) {
      setError('계약자명, 차량번호, 주소, 입금자명, 입차시간, 출차시간은 필수입니다.');
      return;
    }
    if (!freq || !size) {
      setError('상품 카테고리(주기·크기)를 선택해주세요.');
      return;
    }
    if (!privacyConsent) {
      setError('개인정보 수집·이용 동의는 필수입니다.');
      return;
    }
    const amount = PRICE_TABLE[freq][size] + (isForeign ? 5000 : 0);
    const freqLabel = freq === '격주' ? '월2회(격주)' : '월4회';
    const sizeLabel = size === '대형' ? '대형(SUV포함)' : size;
    const product = `${freqLabel} · ${sizeLabel}${isForeign ? ' · 외제차' : ''}`;

function PublicApplyPage({ token }) {

  const [form, setForm] = useState({ contractor_name: '', car_number: '', address: '', address_detail: '', depositor_name: '', entry_time: '', exit_time: '' });

  const [isForeign, setIsForeign] = useState(false);
  const [sameAsCustomer, setSameAsCustomer] = useState(false);
  const [sameAsContractor, setSameAsContractor] = useState(false);
  const [privacyConsent, setPrivacyConsent] = useState(false);
  const [marketingConsent, setMarketingConsent] = useState(false);
  const [showPolicy, setShowPolicy] = useState(false);
  const inputStyle = { background: '#F7F6F2', border: '1px solid #E4E2D9', color: '#1C2620' };
  const set = (k, v) => setForm(prev => ({ ...prev, [k]: v }));
  const currentPrice = (freq && size) ? PRICE_TABLE[freq][size] + (isForeign ? 5000 : 0) : null;

  useEffect(() => {
    (async () => {
      const { data, error: rpcError } = await supabase.rpc('get_application_by_token', { p_token: token });

      setCustomer(data);

    new window.daum.Postcode({ oncomplete: (data) => set('address', data.roadAddress || data.address) }).open();

    if (!form.contractor_name.trim() || !form.car_number.trim() || !form.address.trim() || !form.depositor_name.trim() || !form.entry_time || !form.exit_time) {

        <label className="flex items-center gap-2 -mt-1.5 text-[12.5px]" style={{ color: '#6B6A63' }}>

        <FieldInput label="차량번호 *" value={form.car_number} onChange={e => set('car_number', e.target.value)} placeholder="12가 3456" />
        <div>

function PublicInquiryPage({ apt }) {
  const [form, setForm] = useState({ name: '', phone: '', complex: apt || '', unit: '' });
  const [privacyConsent, setPrivacyConsent] = useState(false);
  const [marketingConsent, setMarketingConsent] = useState(false);
  const [showPolicy, setShowPolicy] = useState(false);
  const [error, setError] = useState('');
  const [saving, setSaving] = useState(false);
  const [submitted, setSubmitted] = useState(false);
  const set = (k, v) => setForm(prev => ({ ...prev, [k]: v }));

  useEffect(() => {
    if (!submitted) return;
    const timer = setTimeout(() => { window.close(); }, 3000);
    return () => clearTimeout(timer);
  }, [submitted]);

  async function handleSubmit() {
    if (!form.name.trim() || !form.phone.trim()) { setError('이름과 연락처는 필수입니다.'); return; }
    if (!privacyConsent) { setError('개인정보 수집·이용 동의는 필수입니다.'); return; }
    setError(''); setSaving(true);
    const { error: rpcError } = await supabase.rpc('submit_inquiry', {
      p_name: form.name, p_phone: form.phone, p_complex: form.complex, p_unit: form.unit,
      p_privacy_consent: privacyConsent, p_marketing_consent: marketingConsent,

    setSubmitted(true);
  }

  const shell = (content) => (
    <div style={{ background: '#1C2620', minHeight: '100vh' }} className="w-full flex items-center justify-center px-5 py-10">
      <div style={{ background: '#FFFFFF' }} className="w-full max-w-sm rounded-2xl p-6">{content}</div>
    </div>

  if (submitted) return shell(
    <div className="text-center py-6">
      <div className="text-3xl mb-3">✅</div>
      <h2 className="text-base font-semibold" style={{ color: '#1C2620' }}>상담 신청이 접수되었습니다</h2>
      <p className="text-[13px] mt-2" style={{ color: '#6B6A63' }}>담당자가 순차적으로 연락드리겠습니다. 감사합니다.</p>
      <p className="text-[11.5px] mt-3" style={{ color: '#B0AEA4' }}>잠시 후 이 창이 자동으로 닫힙니다.</p>
    </div>
  );

  return shell(
    <React.Fragment>
      <p className="text-[11px] tracking-wide uppercase" style={{ color: '#7C9385' }}>방문 세차 정기권</p>
      <h1 className="text-xl font-semibold mt-1 mb-1" style={{ color: '#1C2620' }}>세차 상담 신청</h1>
      <p className="text-[12.5px] mb-4" style={{ color: '#6B6A63' }}>간단한 정보만 남겨주시면 담당자가 연락드립니다.</p>
      <div className="flex flex-col gap-3">
        <FieldInput label="이름 *" value={form.name} onChange={e => set('name', e.target.value)} placeholder="홍길동" />
        <FieldInput label="연락처 *" value={form.phone} onChange={e => set('phone', formatPhoneInput(e.target.value))} placeholder="010-0000-0000" maxLength={13} />
        <FieldInput label="아파트 단지" value={form.complex} onChange={e => set('complex', e.target.value)} placeholder="한빛아파트" />
        <FieldInput label="동/호수" value={form.unit} onChange={e => set('unit', e.target.value)} placeholder="101동 1203호 (선택)" />

        <label className="flex items-start gap-2 text-[12.5px]" style={{ color: '#4A4A45' }}>
          <input type="checkbox" className="mt-0.5" checked={privacyConsent} onChange={e => setPrivacyConsent(e.target.checked)} />
          <span>(필수) 수집한 개인정보는 가입신청 및 고객관리 목적 이외에는 사용하지 않는다는 <button type="button" onClick={() => setShowPolicy(true)} style={{ color: '#0C447C', textDecoration: 'underline' }}>개인정보처리방침</button>에 동의합니다</span>
        </label>
        <label className="flex items-start gap-2 text-[12.5px]" style={{ color: '#4A4A45' }}>
          <input type="checkbox" className="mt-0.5" checked={marketingConsent} onChange={e => setMarketingConsent(e.target.checked)} />
          <span>(선택) 이벤트·할인·무료 실내세차 등 마케팅 정보 수신에 동의합니다</span>
        </label>

        {error && <p className="text-[13px]" style={{ color: '#A32D2D' }}>{error}</p>}
        <button onClick={handleSubmit} disabled={saving} style={{ background: '#2F6B4F', color: '#FFFFFF' }} className="mt-1 text-sm font-medium py-2.5 rounded-lg disabled:opacity-60">{saving ? '접수 중...' : '상담 신청하기'}</button>
      </div>
      {showPolicy && <PrivacyPolicyModal onClose={() => setShowPolicy(false)} />}
    </React.Fragment>
  );
}

function App() {
  const [currentUser, setCurrentUser] = useState(null);
  const [authView, setAuthView] = useState('login');
  const [checking, setChecking] = useState(true);
  const applyToken = new URLSearchParams(window.location.search).get('apply');
  const inquiryParam = new URLSearchParams(window.location.search).get('inquiry');
  const inquiryApt = new URLSearchParams(window.location.search).get('apt');

  useEffect(() => {
    if (applyToken || inquiryParam) { setChecking(false); return; }
    (async () => {
      const { data } = await supabase.auth.getSession();
      if (data.session) {
        const { data: profile } = await supabase.from('profiles').select('*').eq('id', data.session.user.id).single();
        if (profile && profile.status === '승인') setCurrentUser(profile);
      }
      setChecking(false);
    })();
    const { data: sub } = supabase.auth.onAuthStateChange((event) => {
      if (event === 'SIGNED_OUT') setCurrentUser(null);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  async function handleLogout() {
    await supabase.auth.signOut();
    setCurrentUser(null);
    setAuthView('login');
  }

  if (applyToken) {
    return <PublicApplyPage token={applyToken} />;
  }
  if (inquiryParam) {
    return <PublicInquiryPage apt={inquiryApt} />;
  }

  if (checking) {
    return <div style={{ background: '#1C2620', minHeight: '100vh' }} className="w-full flex items-center justify-center"><p style={{ color: '#8FA89A' }} className="text-sm">불러오는 중...</p></div>;
  }

  return (
    <React.Fragment>
      <ConfigWarning />
      {!currentUser ? (
        authView === 'login'
          ? <LoginPage onLogin={setCurrentUser} onGotoSignup={() => setAuthView('signup')} />
          : <SignupPage onGotoLogin={() => setAuthView('login')} />
      ) : (
        <Dashboard currentUser={currentUser} onLogout={handleLogout} />
      )}
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
