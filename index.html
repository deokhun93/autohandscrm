// 코드(atNNN) 기반 인센티브 규칙 엔진.
// rules: [{ min_code, max_code, incentive_per_deal, override_code, override_amount, self_close_incentive }]
// staffDirectory: [{ id, member_code }] - id -> member_code 매핑용
function computeIncentiveMap(customers, rules, staffDirectory) {
  const codeById = {};
  (staffDirectory || []).forEach(u => { if (u.member_code) codeById[u.id] = u.member_code; });
  const totals = {};
  const closedCounts = {};
  let companyTotal = 0;
  const add = (code, amount) => {
    if (!code || !amount) return;
    totals[code] = (totals[code] || 0) + amount;
    companyTotal += amount;
  };
  const contracted = (customers || []).filter(c => c.status === '계약완료' && c.rep_id);
  contracted.forEach(c => {
    const code = codeById[c.rep_id];
    if (!code) return;
    closedCounts[code] = (closedCounts[code] || 0) + 1;
    const selfRule = (rules || []).find(r => r.override_code === code && r.self_close_incentive != null);
    if (selfRule) { add(code, selfRule.self_close_incentive); return; }
    const rangeRule = (rules || []).find(r => code >= r.min_code && code <= r.max_code);
    if (rangeRule) {
      add(code, rangeRule.incentive_per_deal);
      if (rangeRule.override_code && rangeRule.override_amount) add(rangeRule.override_code, rangeRule.override_amount);
      return;
    }
    add(code, INCENTIVE_PER_DEAL);
  });
  return { totals, companyTotal, closedCounts };
}

function filterCustomersByPeriod(customers, period) {
  if (period === 'all') return customers;
  const now = new Date();
  return (customers || []).filter(c => {
    if (!c.contract_date) return false;
    const d = new Date(c.contract_date);
    if (isNaN(d)) return false;
    if (period === 'today') return d.toDateString() === now.toDateString();
    if (period === 'week') {
      const start = new Date(now); start.setDate(now.getDate() - now.getDay()); start.setHours(0, 0, 0, 0);
      return d >= start;
    }
    if (period === 'month') return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    if (period === 'lastmonth') {
      const lm = new Date(now.getFullYear(), now.getMonth() - 1, 1);
      return d.getFullYear() === lm.getFullYear() && d.getMonth() === lm.getMonth();
    }
    return true;
  });
}

function maskName(name) {
  if (!name) return '';
  const chars = Array.from(name);
  if (chars.length <= 1) return chars.join('');
  if (chars.length === 2) return chars[0] + '*';
  return chars[0] + '*'.repeat(chars.length - 2) + chars[chars.length - 1];
}
function maskPhone(phone) {
  if (!phone) return '';
  const parts = String(phone).split('-');
  if (parts.length === 3) {
    const [a, b, c] = parts;
    const maskedB = '*'.repeat(b.length);
    const maskedC = c.length > 3 ? '*' + c.slice(1) : c;
    return `${a}-${maskedB}-${maskedC}`;
  }
  const s = String(phone);
  return s.length > 6 ? s.slice(0, 3) + '*'.repeat(s.length - 6) + s.slice(-3) : s;
}
function maskAccount(account) {
  if (!account) return '';
  const s = String(account);
  const digitIdx = [];
  for (let i = 0; i < s.length; i++) if (/\d/.test(s[i])) digitIdx.push(i);
  if (digitIdx.length <= 6) return s;
  const hideSet = new Set(digitIdx.slice(3, digitIdx.length - 3));
  return s.split('').map((ch, i) => hideSet.has(i) ? '*' : ch).join('');
}
function MaskedText({ value, type }) {
  const [revealed, setRevealed] = useState(false);
  if (!value) return null;
  const masked = type === 'name' ? maskName(value) : type === 'phone' ? maskPhone(value) : maskAccount(value);
  return (
    <span className="inline-flex items-center gap-1">
      <span>{revealed ? value : masked}</span>
      <button type="button" onClick={(e) => { e.stopPropagation(); setRevealed(r => !r); }} className="text-[11px] leading-none" style={{ color: '#9B998F' }} aria-label={revealed ? '가리기' : '보기'}>
        {revealed ? '🙈' : '👁'}
      </button>
    </span>
  );
}

function Leaderboard({ salesUsers, customers, currentUserId, incentiveMap }) {
  const rows = salesUsers.map(u => {
    const deals = customers.filter(c => c.rep_id === u.id && c.status === '계약완료').length;
    const incentive = (incentiveMap && u.member_code) ? (incentiveMap.totals[u.member_code] || 0) : deals * INCENTIVE_PER_DEAL;
    return { id: u.id, name: u.name, deals, incentive };
  }).sort((a, b) => b.deals - a.deals);
  const maxDeals = Math.max(1, ...rows.map(r => r.deals));
  return (
    <div className="rounded-xl p-3.5" style={{ background: '#FFFFFF', border: '1px solid #E4E2D9' }}>
      <div className="flex items-center gap-1.5 mb-2.5">
        <span className="text-[15px]">🏆</span>
        <p className="text-[13px] font-medium" style={{ color: '#1C2620' }}>영업사원별 유치완료 현황</p>
      </div>
      <div className="flex flex-col gap-2.5">
        {rows.length === 0 && <p className="text-[12.5px]" style={{ color: '#B0AEA4' }}>승인된 영업사원이 없습니다.</p>}
        {rows.map((r, i) => {
          const isMe = r.id === currentUserId;
          return (
            <div key={r.id} className="flex items-center gap-2.5">
              <span className="text-[12px] w-4 text-center shrink-0" style={{ color: i === 0 && r.deals > 0 ? '#C98A2E' : '#B0AEA4' }}>{i + 1}</span>
              <span className="text-[13px] w-16 shrink-0 font-medium truncate" style={{ color: isMe ? '#2F6B4F' : '#1C2620' }}>{r.name}{isMe ? ' (나)' : ''}</span>
              <div className="flex-1 h-2 rounded-full overflow-hidden" style={{ background: '#EFEEE8' }}>
                <div style={{ width: (r.deals / maxDeals * 100) + '%', background: isMe ? '#2F6B4F' : '#B4B2A9' }} className="h-full rounded-full" />
              </div>
              <span className="text-[12px] w-14 text-right shrink-0" style={{ color: '#6B6A63' }}>{r.deals}건</span>
              <span className="text-[12px] w-20 text-right shrink-0 font-medium" style={{ color: '#854F0B' }}>{currency(r.incentive)}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Announcements({ isAdmin, announcements, onPost, onUpdate, onDelete }) {
  const [text, setText] = useState('');
  const [showPast, setShowPast] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editText, setEditText] = useState('');
  const latest = announcements[0];
  const past = announcements.slice(1);

  function startEdit(a) { setEditingId(a.id); setEditText(a.content); }
  function saveEdit() { if (editText.trim()) onUpdate(editingId, editText.trim()); setEditingId(null); }

  function Item({ a, highlight }) {
    if (editingId === a.id) {
      return (
        <div className="rounded-lg p-3" style={{ background: highlight ? '#FFF7E8' : '#F7F6F2', border: '1px solid ' + (highlight ? '#F0D9A0' : '#E4E2D9') }}>
          <textarea value={editText} onChange={e => setEditText(e.target.value)} rows={2} className="w-full rounded-lg px-2 py-1.5 text-[13px] outline-none" style={{ background: '#FFFFFF', border: '1px solid #E4E2D9', color: '#1C2620' }} />
          <div className="flex gap-2 mt-2">
            <button onClick={() => setEditingId(null)} className="flex-1 text-[12px] py-1.5 rounded-lg" style={{ border: '1px solid #E4E2D9', color: '#4A4A45' }}>취소</button>
            <button onClick={saveEdit} className="flex-1 text-[12px] py-1.5 rounded-lg" style={{ background: '#2F6B4F', color: '#FFFFFF' }}>저장</button>
          </div>
        </div>
      );
    }
    return (
      <div className="rounded-lg p-3" style={{ background: highlight ? '#FFF7E8' : '#F7F6F2', border: '1px solid ' + (highlight ? '#F0D9A0' : '#E4E2D9') }}>
        <p className="text-[13px] whitespace-pre-wrap" style={{ color: highlight ? '#1C2620' : '#4A4A45' }}>{a.content}</p>
        <div className="flex items-center justify-between mt-1.5">
          <p className="text-[11px]" style={{ color: '#B0AEA4' }}>{new Date(a.created_at).toLocaleString('ko-KR')}</p>
          {isAdmin && (
            <div className="flex gap-2.5">
              <button onClick={() => startEdit(a)} className="text-[11px] font-medium" style={{ color: '#0C447C' }}>수정</button>
              <button onClick={() => { if (confirm('이 공지사항을 삭제할까요?')) onDelete(a.id); }} className="text-[11px] font-medium" style={{ color: '#A32D2D' }}>삭제</button>
            </div>
          )}
        </div>
      </div>
    );
  }

  return (
    <div className="rounded-xl p-3.5" style={{ background: '#FFFFFF', border: '1px solid #E4E2D9' }}>
      <div className="flex items-center gap-1.5 mb-2.5">
        <span className="text-[15px]">📢</span>
        <p className="text-[13px] font-medium" style={{ color: '#1C2620' }}>공지사항</p>
      </div>
      {latest ? <Item a={latest} highlight={true} /> : <p className="text-[12.5px]" style={{ color: '#B0AEA4' }}>등록된 공지사항이 없습니다.</p>}

      {isAdmin && (
        <div className="flex gap-2 mt-2.5">
          <input value={text} onChange={e => setText(e.target.value)} placeholder="새 공지사항을 입력하세요" style={{ background: '#F7F6F2', border: '1px solid #E4E2D9', color: '#1C2620' }} className="flex-1 rounded-lg px-3 py-2 text-sm outline-none" />
          <button onClick={() => { if (text.trim()) { onPost(text.trim()); setText(''); } }} style={{ background: '#2F6B4F', color: '#FFFFFF' }} className="px-3.5 rounded-lg text-sm font-medium">등록</button>
        </div>
      )}

      {past.length > 0 && (
        <button onClick={() => setShowPast(s => !s)} className="text-[12px] mt-3" style={{ color: '#6B6A63' }}>
          {showPast ? '지난 공지사항 닫기 ▲' : `지난 공지사항 보기 (${past.length}) ▼`}
        </button>
      )}
      {showPast && (
        <div className="flex flex-col gap-2 mt-2">
          {past.map(a => <Item key={a.id} a={a} highlight={false} />)}
        </div>
      )}
    </div>
  );
}

function TrashPanel({ trashed, onRestore, onPurge, onBulkPurge }) {

    return diff > 0 ? diff : 0;

              <span className="text-[11px] px-2 py-0.5 rounded-full whitespace-nowrap" style={{ background: '#FAEEDA', color: '#854F0B' }}>{daysLeft(c.deleted_at)}일 후 완전삭제</span>
            </div>

function StaffIncentivePanel({ customers, rules, staffDirectory, isMaster }) {
  const [rangeStart, setRangeStart] = useState('');
  const [rangeEnd, setRangeEnd] = useState('');
  const filtered = useMemo(() => {
    if (!rangeStart && !rangeEnd) return customers;
    return (customers || []).filter(c => {
      if (!c.contract_date) return false;
      if (rangeStart && c.contract_date < rangeStart) return false;
      if (rangeEnd && c.contract_date > rangeEnd) return false;
      return true;
    });
  }, [customers, rangeStart, rangeEnd]);
  const { totals, closedCounts } = useMemo(() => computeIncentiveMap(filtered, rules, staffDirectory), [filtered, rules, staffDirectory]);

  const rows = (staffDirectory || [])
    .filter(u => u.member_code)
    .map(u => ({ ...u, count: closedCounts[u.member_code] || 0, incentive: totals[u.member_code] || 0 }))
    .sort((a, b) => b.incentive - a.incentive || a.member_code.localeCompare(b.member_code));

  const totalIncentive = rows.reduce((sum, r) => sum + r.incentive, 0);
  const totalCount = rows.reduce((sum, r) => sum + r.count, 0);

  return (
    <div className="flex flex-col gap-3">
      <div className="rounded-xl p-3.5" style={{ background: '#FFFFFF', border: '1px solid #E4E2D9' }}>

            <label className="text-[11.5px]" style={{ color: '#6B6A63' }}>시작일</label>

            <label className="text-[11.5px]" style={{ color: '#6B6A63' }}>종료일</label>

          </div>
        </div>
        {(rangeStart || rangeEnd) && (
          <button onClick={() => { setRangeStart(''); setRangeEnd(''); }} className="text-[11.5px] mt-2" style={{ color: '#0C447C' }}>전체 기간 다시 보기</button>
        )}
        {!rangeStart && !rangeEnd && <p className="text-[11px] mt-2" style={{ color: '#B0AEA4' }}>날짜를 선택하지 않으면 실시간 전체 기간이 표시됩니다.</p>}

        <div>
          <p className="text-[12.5px]" style={{ color: '#6B6A63' }}>선택한 기간 전체 유치 {totalCount}건</p>
          <p className="text-xl font-semibold" style={{ color: '#1C2620' }}>{currency(totalIncentive)}</p>
        </div>
        <span className="text-3xl">📊</span>
      </div>

      <div className="flex flex-col gap-2">
        {rows.length === 0 && (
          <div className="text-center py-10 rounded-xl" style={{ background: '#FFFFFF', border: '1px solid #E4E2D9' }}>
            <p className="text-sm" style={{ color: '#9B998F' }}>직원 정보가 없습니다.</p>

function SmsComposeModal({ targetLabel, defaultText, onClose, onSend }) {
  const [text, setText] = useState(defaultText || '');
  const [sending, setSending] = useState(false);
  const [result, setResult] = useState(null);
  const [attachImage, setAttachImage] = useState(false);

  async function handleSend() {
    if (!text.trim()) return;
    setSending(true);
    const res = await onSend(text.trim(), attachImage);
    setSending(false);
    setResult(res);
  }

  return (
    <div className="fixed inset-0 z-30 flex items-end sm:items-center justify-center" style={{ background: 'rgba(28,38,32,0.5)' }}>
      <div style={{ background: '#FFFFFF' }} className="rounded-t-2xl sm:rounded-2xl w-full sm:max-w-sm max-h-[88vh] overflow-y-auto p-4">
        <h2 className="text-base font-semibold mb-1" style={{ color: '#1C2620' }}>문자 발송</h2>
        <p className="text-[12px] mb-3" style={{ color: '#6B6A63' }}><strong>{targetLabel}</strong>에게 아래 내용 그대로 발송됩니다. 수신거부한 고객은 자동으로 제외됩니다.</p>
        <textarea value={text} onChange={e => setText(e.target.value)} rows={5} style={{ background: '#F7F6F2', border: '1px solid #E4E2D9', color: '#1C2620' }} className="w-full rounded-lg px-3 py-2.5 text-sm outline-none resize-none" placeholder="발송할 문자 내용을 입력하세요" />
        <p className="text-[11px] mt-1.5" style={{ color: '#B0AEA4' }}>문자 앞에 "(광고)"와 수신거부 안내가 자동으로 한 번만 추가됩니다.</p>
        <label className="flex items-center gap-2 mt-2.5 text-[12.5px] px-3 py-2 rounded-lg" style={{ background: '#F1EFE8', color: '#4A4A45' }}>
          <input type="checkbox" checked={attachImage} onChange={e => setAttachImage(e.target.checked)} />
          🖼️ 오토핸즈 포스터 이미지 첨부해서 MMS로 보내기 (건당 비용이 더 높습니다)
        </label>
        {attachImage && (
          <div className="mt-2.5 rounded-lg p-2" style={{ background: '#F7F6F2' }}>
            <p className="text-[11px] mb-1.5" style={{ color: '#6B6A63' }}>실제 발송될 미리보기</p>
            <img src={PROMO_POSTER_IMAGE} alt="첨부 이미지 미리보기" className="w-full rounded-lg" style={{ border: '1px solid #E4E2D9', maxHeight: '260px', objectFit: 'contain' }} />
          </div>
        )}
        {result && (
          <div className="mt-2 px-3 py-2 rounded-lg" style={{ background: (result.results || []).some(r => r.status !== '성공') ? '#FAEEDA' : '#E1F5EE' }}>
            <p className="text-[12.5px]" style={{ color: (result.results || []).some(r => r.status !== '성공') ? '#854F0B' : '#085041' }}>
              시도 {result.sent || 0}건{result.skipped > 0 ? ` · 수신거부로 ${result.skipped}건 제외` : ''}
              {result.results ? ` · 실제 성공 ${result.results.filter(r => r.status === '성공').length}건` : ''}
            </p>
            {(result.results || []).filter(r => r.status !== '성공').slice(0, 3).map((r, i) => (
              <p key={i} className="text-[11.5px] mt-1" style={{ color: '#A32D2D' }}>실패: {r.status}</p>
            ))}
          </div>
        )}
        <div className="flex gap-2 mt-3">
          <button onClick={onClose} style={{ border: '1px solid #E4E2D9', color: '#4A4A45' }} className="flex-1 text-sm font-medium py-2.5 rounded-lg">닫기</button>
          <button onClick={handleSend} disabled={sending} style={{ background: '#2F6B4F', color: '#FFFFFF' }} className="flex-1 text-sm font-medium py-2.5 rounded-lg disabled:opacity-60">{sending ? '발송 중...' : '전송'}</button>
        </div>
      </div>
    </div>
  );
}

                <p className="text-[12px] font-medium mb-1" style={{ color: '#6B6A63' }}>발신: {nameOf(m.from_user)}</p>

              <div className="flex items-center justify-between mt-1.5">

                  <span className="text-[10.5px] px-1.5 py-0.5 rounded-full" style={{ background: m.is_read ? '#E1F5EE' : '#FAEEDA', color: m.is_read ? '#085041' : '#854F0B' }}>{m.is_read ? '읽음' : '안읽음'}</span>
                  <button onClick={(e) => { e.stopPropagation(); if (confirm('이 메시지를 삭제할까요?')) onDelete(m.id); }} className="text-[11px] font-medium" style={{ color: '#A32D2D' }}>삭제</button>

function MyScriptEditor({ personalValue, onSave }) {
  const [open, setOpen] = useState(false);
  const [draft, setDraft] = useState(personalValue || DEFAULT_SMS_SCRIPT);
  const [copied, setCopied] = useState(false);
  const [saved, setSaved] = useState(false);

  useEffect(() => { setDraft(personalValue || DEFAULT_SMS_SCRIPT); }, [personalValue]);

  function copy() {
    navigator.clipboard.writeText(draft).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1500); });
  }
  function save() {
    onSave(draft);
    setSaved(true);
    setTimeout(() => setSaved(false), 1500);
  }

  return (
    <div className="rounded-xl overflow-hidden" style={{ background: '#FFFFFF', border: '1px solid #E4E2D9' }}>
      <button onClick={() => setOpen(o => !o)} className="w-full flex items-center justify-between px-3.5 py-3">
        <span className="text-[13px] font-medium" style={{ color: '#1C2620' }}>📱 내 문자 스크립트 (전화번호 등 개인화)</span>
        <span style={{ color: '#9B998F' }}>{open ? '▲' : '▼'}</span>
      </button>
      {open && (
        <div className="px-3.5 pb-3.5 flex flex-col gap-2">
          <p className="text-[11.5px]" style={{ color: '#B0AEA4' }}>기본 문구를 그대로 불러왔습니다. 전화번호 등 원하는 부분을 본인 것으로 바꿔서 저장하면, 이후 고객에게 문자를 보낼 때 나에게만 이 버전이 사용됩니다.</p>
          <textarea value={draft} onChange={e => setDraft(e.target.value)} rows={6} className="w-full rounded-lg px-3 py-2.5 text-sm outline-none resize-none" style={{ background: '#F7F6F2', border: '1px solid #E4E2D9', color: '#1C2620' }} />
          <div className="flex gap-2">
            <button onClick={copy} style={{ border: '1px solid #E4E2D9', color: '#4A4A45' }} className="flex-1 text-[12.5px] py-2 rounded-lg font-medium">{copied ? '복사됨 ✓' : '복사하기'}</button>
            <button onClick={save} style={{ background: '#2F6B4F', color: '#FFFFFF' }} className="flex-1 text-[12.5px] py-2 rounded-lg font-medium">{saved ? '저장됨 ✓' : '저장'}</button>
          </div>
          <div className="h-px my-1" style={{ background: '#E4E2D9' }} />
          <p className="text-[12px] font-medium" style={{ color: '#1C2620' }}>오토핸즈 홍보 포스터 (카카오톡 등으로 같이 보낼 이미지)</p>

function ScriptAccordion({ id, title, isAdmin, content, onSave }) {
  const [open, setOpen] = useState(false);
  const [draft, setDraft] = useState(content || '');

  useEffect(() => { setDraft(content || ''); }, [content]);

function exportCustomersToExcel(rows, salesUsers, filename) {
  if (!window.XLSX) { alert('엑셀 내보내기 기능을 불러오지 못했습니다.'); return; }
  const repName = (id) => (salesUsers.find(u => u.id === id) || {}).name || '';
  const data = rows.map(c => ({
    'DB시작일': c.visit_date || '', '계약일': c.contract_date || '', '고객명': c.name || '', '연락처': c.phone || '',
    '계약자명': c.contractor_name || '', '차량번호': c.car_number || '', '주소': c.address || '', '상세주소': c.address_detail || '',
    '입금자명': c.depositor_name || '', '입차시간': c.entry_time || '', '출차시간': c.exit_time || '', '상품': c.product || '', '월이용료': c.amount || 0,
    '담당영업사원': repName(c.rep_id), '상태': c.status || '', '메모': c.memo || '',
  }));
  const ws = window.XLSX.utils.json_to_sheet(data);
  const wb = window.XLSX.utils.book_new();
  window.XLSX.utils.book_append_sheet(wb, ws, '계약내역');
  window.XLSX.writeFile(wb, filename);
}

function getMonthCells(year, month) {
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  return cells;
}

function isInCurrentWeek(dateStr) {
  if (!dateStr) return false;
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  const day = now.getDay();
  const diffToMonday = (day === 0 ? -6 : 1 - day);
  const monday = new Date(now); monday.setDate(now.getDate() + diffToMonday); monday.setHours(0, 0, 0, 0);
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6); sunday.setHours(23, 59, 59, 999);
  return d >= monday && d <= sunday;
}
function isInLastMonth(dateStr) {
  if (!dateStr) return false;
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  const lastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  return d.getFullYear() === lastMonth.getFullYear() && d.getMonth() === lastMonth.getMonth();
}

              <div className="flex items-center justify-between mb-2">
                <p className="font-semibold text-[14px]" style={{ color: '#1C2620' }}>{q.complex}</p>
                {isMaster && <button onClick={() => { if (confirm('이 QR을 삭제할까요?')) onDelete(q.id); }} className="text-[11.5px] font-medium" style={{ color: '#A32D2D' }}>삭제</button>}
              </div>
              <div className="flex flex-col items-center gap-2 py-1">
                <img src={qrImg} alt={`${q.complex} QR 코드`} width={150} height={150} style={{ borderRadius: '8px', border: '1px solid #E4E2D9' }} />
              </div>
              <div className="flex gap-2 mt-2">
                <input readOnly value={link} className="flex-1 text-[11.5px] rounded-lg px-3 py-2 outline-none" style={{ background: '#F7F6F2', border: '1px solid #E4E2D9', color: '#4A4A45' }} />
                <button onClick={() => copyLink(q.id, link)} style={{ background: '#2F6B4F', color: '#FFFFFF' }} className="px-3.5 rounded-lg text-[12px] font-medium whitespace-nowrap">{copiedId === q.id ? '복사됨' : '복사'}</button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Dashboard({ currentUser, onLogout }) {
  const isRealMaster = currentUser.role === 'master';
  const isRealAdmin = currentUser.role === 'admin' || isRealMaster;
  // previewMode: 'none' | 'admin' | 'sales' - 마스터는 관리자/영업사원 화면을 각각 미리볼 수 있고, 일반 관리자는 영업사원 화면만 미리볼 수 있음
  const [previewMode, setPreviewMode] = useState('none');
  const isAdmin = isRealMaster ? (previewMode !== 'sales') : (isRealAdmin && previewMode !== 'sales');
  const isMaster = isRealMaster && previewMode === 'none';
  const myId = currentUser.id;
  const [tab, setTab] = useState('customers');
  const [search, setSearch] = useState('');
  const [statusFilter, setStatusFilter] = useState('전체');
  const [repFilter, setRepFilter] = useState('전체');
  const [marketingFilter, setMarketingFilter] = useState('전체');
  const [myDbFilter, setMyDbFilter] = useState('all');
  const [bulkSelected, setBulkSelected] = useState({});
  const [smsRequest, setSmsRequest] = useState(null);
  const [showSenderSetting, setShowSenderSetting] = useState(false);
  const [currentUserSender, setCurrentUserSender] = useState(currentUser.sms_sender_number || '');
  const [myPersonalScript, setMyPersonalScript] = useState(currentUser.personal_customer_script || '');
  const [editing, setEditing] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [customers, setCustomers] = useState([]);
  const [salesUsers, setSalesUsers] = useState([]);
  const [pendingUsers, setPendingUsers] = useState([]);
  const [departedUsers, setDepartedUsers] = useState([]);
  const [accessLogs, setAccessLogs] = useState([]);
  const [qrCodes, setQrCodes] = useState([]);
  const [trashedCustomers, setTrashedCustomers] = useState([]);
  const [updateLogs, setUpdateLogs] = useState([]);
  const [showUpdatePopup, setShowUpdatePopup] = useState(false);
  const [lastSeenUpdateId, setLastSeenUpdateId] = useState(currentUser.last_seen_update_id || 0);
  const [staffDirectory, setStaffDirectory] = useState([]);
  const [incentiveRules, setIncentiveRules] = useState([]);
  const [announcements, setAnnouncements] = useState([]);
  const [allStaff, setAllStaff] = useState([]);
  const [inboxMessages, setInboxMessages] = useState([]);
  const [sentMessages, setSentMessages] = useState([]);
  const [scripts, setScripts] = useState({});
  const [showInbox, setShowInbox] = useState(false);
  const [messageTarget, setMessageTarget] = useState(null);
  const [loading, setLoading] = useState(true);

  async function loadAll() {
    setLoading(true);
    const { data: custData } = await supabase.from('customers').select('*').is('deleted_at', null).order('created_at', { ascending: false }).limit(5000);
    setCustomers(custData || []);
    const { data: salesData } = await supabase.from('profiles').select('*').eq('role', 'sales').eq('status', '승인');
    setSalesUsers(salesData || []);
    const { data: annData } = await supabase.from('announcements').select('*').order('created_at', { ascending: false });
    setAnnouncements(annData || []);
    const { data: staffData } = await supabase.from('profiles').select('*').eq('status', '승인');
    setAllStaff(staffData || []);
    const { data: recvData } = await supabase.from('messages').select('*').eq('to_user', myId).order('created_at', { ascending: false });
    setInboxMessages(recvData || []);
    const { data: sentData } = await supabase.from('messages').select('*').eq('from_user', myId).order('created_at', { ascending: false });
    setSentMessages(sentData || []);
    const { data: scriptData } = await supabase.from('scripts').select('*');
    const scriptMap = {};
    (scriptData || []).forEach(s => { scriptMap[s.id] = s.content; });
    setScripts(scriptMap);
    const { data: dirData } = await supabase.rpc('list_staff_directory');
    setStaffDirectory(dirData || []);
    const { data: ruleData } = await supabase.from('incentive_rules').select('*').order('created_at', { ascending: false });
    setIncentiveRules(ruleData || []);
    const { data: updateData } = await supabase.from('update_logs').select('*').order('id', { ascending: false });
    setUpdateLogs(updateData || []);
    if (updateData && updateData.length > 0) {
      const latestId = updateData[0].id;
      const { data: freshProfile } = await supabase.from('profiles').select('last_seen_update_id').eq('id', myId).single();
      const seenId = (freshProfile && freshProfile.last_seen_update_id) || 0;
      setLastSeenUpdateId(seenId);
      if (latestId > seenId) setShowUpdatePopup(true);
    }
    if (isAdmin) {
      const { data: pendingData } = await supabase.from('profiles').select('*').eq('status', '대기');
      setPendingUsers(pendingData || []);
      const { data: departedData } = await supabase.from('profiles').select('*').eq('status', '탈퇴');
      setDepartedUsers(departedData || []);
      const { data: logData } = await supabase.from('access_logs').select('*').order('created_at', { ascending: false }).limit(500);
      setAccessLogs(logData || []);
      const { data: qrData } = await supabase.from('qr_codes').select('*').order('created_at', { ascending: false });
      setQrCodes(qrData || []);
      await supabase.rpc('purge_old_trash');
      const { data: trashData } = await supabase.from('customers').select('*').not('deleted_at', 'is', null).order('deleted_at', { ascending: false });
      setTrashedCustomers(trashData || []);
    }
    setLoading(false);
  }

  useEffect(() => { loadAll(); }, []);
  useEffect(() => {
    const interval = setInterval(() => { loadAll(); }, 3600000);
    return () => clearInterval(interval);
  }, []);

  const repName = (id) => {
    const active = salesUsers.find(u => u.id === id);
    if (active) return active.name;
    const departed = departedUsers.find(u => u.id === id);
    if (departed) return `${departed.name} (퇴사원)`;
    return '미배정';
  };
  const canEdit = (c) => isAdmin || c.rep_id === myId;
  const departedCustomers = useMemo(() => customers.filter(c => c.rep_id && departedUsers.some(u => u.id === c.rep_id)), [customers, departedUsers]);
  const inquiryCustomers = useMemo(() => customers.filter(c => c.status === '청약대기').sort((a, b) => new Date(b.visit_date) - new Date(a.visit_date)), [customers]);
  const unreviewedInquiryCount = useMemo(() => inquiryCustomers.filter(c => !c.reviewed).length, [inquiryCustomers]);

  const filtered = useMemo(() => customers.filter(c => {
    if (!c.rep_id) return false;
    if (departedUsers.some(u => u.id === c.rep_id)) return false;
    if (!isAdmin && myDbFilter !== 'all') {
      if (c.rep_id !== myId) return false;
      if (myDbFilter === 'today') { if (c.visit_date !== new Date().toISOString().slice(0, 10)) return false; }
      else if (myDbFilter === 'week') { if (!isInCurrentWeek(c.visit_date)) return false; }
      else if (myDbFilter === 'lastmonth') { if (!isInLastMonth(c.visit_date)) return false; }
      else if (myDbFilter === 'uncontracted') { if (!(c.call1 && c.sms2 && c.recall3 && c.status !== '계약완료')) return false; }
    }
    if (statusFilter !== '전체' && c.status !== statusFilter) return false;
    if (isAdmin && repFilter !== '전체' && c.rep_id !== repFilter) return false;
    if (isAdmin && marketingFilter === '동의' && !c.marketing_consent) return false;
    if (isAdmin && marketingFilter === '미동의' && c.marketing_consent) return false;
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      if (!`${c.name} ${c.phone} ${c.complex} ${c.unit} ${c.memo || ''} ${c.car_number || ''}`.toLowerCase().includes(q)) return false;
    }
    return true;
  }), [customers, search, statusFilter, repFilter, isAdmin, myDbFilter, myId, marketingFilter, departedUsers]);

  const unassignedCustomers = useMemo(() => customers.filter(c => !c.rep_id && c.status !== '청약대기'), [customers]);

  const scope = isAdmin ? customers.filter(c => c.rep_id) : customers.filter(c => c.rep_id === myId);
  const stats = useMemo(() => {
    const total = scope.length;
    const contracted = scope.filter(c => c.status === '계약완료').length;
    const inTalk = scope.filter(c => c.status === '상담중').length;
    return { total, contracted, inTalk };
  }, [scope]);
  const incentiveMap = useMemo(() => computeIncentiveMap(customers, incentiveRules, staffDirectory), [customers, incentiveRules, staffDirectory]);
  const myIncentive = incentiveMap.totals[currentUser.member_code] || 0;
  const companyIncentive = incentiveMap.companyTotal;

  async function toggleStage(id, key) {
    const target = customers.find(c => c.id === id);
    const newVal = !target[key];
    setCustomers(prev => prev.map(c => c.id === id ? { ...c, [key]: newVal } : c));
    await supabase.from('customers').update({ [key]: newVal }).eq('id', id);
  }

  // 문자 발송 성공 시 영업진행과정의 "문자" 단계를 자동 체크하고, 발송 횟수를 (1),(2)... 로 누적 표시
  async function markSmsSent(ids) {
    for (const id of ids) {
      const target = customers.find(c => c.id === id);
      if (!target) continue;
      const newCount = (target.sms_sent_count || 0) + 1;
      await supabase.from('customers').update({ sms2: true, sms_sent_count: newCount }).eq('id', id);
      setCustomers(prev => prev.map(c => c.id === id ? { ...c, sms2: true, sms_sent_count: newCount } : c));
    }
  }

  async function logAccess(action, customer) {
    try {
      await supabase.from('access_logs').insert({ actor_id: myId, actor_name: currentUser.name, action, customer_id: customer.id, customer_name: customer.name });
    } catch (e) { /* 로그 실패는 조용히 무시 */ }
  }
  async function refreshAccessLogs() {
    const { data: logData } = await supabase.from('access_logs').select('*').order('created_at', { ascending: false }).limit(500);
    setAccessLogs(logData || []);
  }

  function openNew() {
    setEditing({ id: null, name: '', phone: '', complex: '', unit: '', visit_date: new Date().toISOString().slice(0, 10), rep_id: isAdmin ? (salesUsers[0] ? salesUsers[0].id : null) : myId, status: '신규', product: '', amount: 0, memo: '', call1: false, sms2: false, recall3: false, sms_sent_count: 0 });
  }

  function openExisting(c) {
    setEditing({ ...c });
    logAccess('조회', c);
  }

  async function openInquiry(c) {
    if (!c.reviewed) {
      await supabase.from('customers').update({ reviewed: true }).eq('id', c.id);
      setCustomers(prev => prev.map(x => x.id === c.id ? { ...x, reviewed: true } : x));
    }
    setEditing({ ...c, reviewed: true });
    logAccess('조회', c);
  }

  async function addQrCode(complex) {
    const { data, error } = await supabase.from('qr_codes').insert({ complex, created_by: myId }).select().single();
    if (!error) setQrCodes(prev => [data, ...prev]);
  }
  async function deleteQrCode(id) {
    await supabase.from('qr_codes').delete().eq('id', id);
    setQrCodes(prev => prev.filter(q => q.id !== id));
  }

  async function saveCustomer(rawData) {
    const data = { ...rawData, rep_id: rawData.rep_id || null };
    const prevRecord = customers.find(c => c.id === data.id);
    if (prevRecord && prevRecord.status === '계약완료' && data.status !== '계약완료') {
      // 계약취소: 계약현황 캘린더에서 자동으로 사라지도록 계약일을 비웁니다.
      data.contract_date = null;
    }
    if (data.id == null) {
      const { id, ...rest } = data;
      const { data: inserted, error } = await supabase.from('customers').insert(rest).select().single();
      if (!error) { setCustomers(prev => [inserted, ...prev]); logAccess('등록', inserted); }
    } else {
      const { id, ...rest } = data;
      const { error } = await supabase.from('customers').update(rest).eq('id', id);
      if (!error) { setCustomers(prev => prev.map(c => c.id === id ? data : c)); logAccess('수정', data); }
    }
    setEditing(null);
  }

  async function deleteCustomer(id) {
    const { data: moved } = await supabase.from('customers').update({ deleted_at: new Date().toISOString(), deleted_by: myId }).eq('id', id).select().single();
    setCustomers(prev => prev.filter(c => c.id !== id));
    if (moved) setTrashedCustomers(prev => [moved, ...prev]);
    setConfirmDelete(null);
    setEditing(null);
  }

  async function approveUser(id) {
    await supabase.from('profiles').update({ status: '승인' }).eq('id', id);
    setPendingUsers(prev => prev.filter(u => u.id !== id));
    loadAll();
  }
  async function rejectUser(id) {
    await supabase.from('profiles').update({ status: '거절' }).eq('id', id);
    setPendingUsers(prev => prev.filter(u => u.id !== id));
  }
  async function changeStaffRole(id, role) {
    await supabase.from('profiles').update({ role }).eq('id', id);
    setAllStaff(prev => prev.map(u => u.id === id ? { ...u, role } : u));
    setSalesUsers(prev => role === 'sales' ? prev : prev.filter(u => u.id !== id));
    await loadAll();
  }
  async function sendSmsToIds(ids, message, attachImage) {
    const body = { customer_ids: ids, message };
    if (attachImage) { body.image_base64 = PROMO_POSTER_IMAGE; body.image_filename = '오토핸즈_포스터.png'; }
    const { data, error } = await supabase.functions.invoke('clever-endpoint', { body });
    if (error || (data && data.error)) {
      alert('발송 실패: ' + (data && data.error ? data.error : (error ? error.message : '알 수 없는 오류')));
      return { sent: 0, skipped: 0 };
    }
    return data;
  }
  function requestSms(ids, targetLabel, onSent) {
    if (!ids || ids.length === 0) return;
    setSmsRequest({ ids, targetLabel: targetLabel || `${ids.length}건`, onSent });
  }
  async function saveSenderNumber(number) {
    await supabase.from('profiles').update({ sms_sender_number: number }).eq('id', myId);
    setCurrentUserSender(number);
    setShowSenderSetting(false);
  }
  async function savePersonalScript(text) {
    await supabase.from('profiles').update({ personal_customer_script: text }).eq('id', myId);
    setMyPersonalScript(text);
  }
  async function withdrawUser(id) {
    if (!confirm('이 영업사원을 탈퇴 처리할까요? 더 이상 로그인할 수 없게 되고, 저장된 개인정보(연락처·생년월일·계좌·주소)는 자동으로 파기됩니다.')) return;
    const departedUser = salesUsers.find(u => u.id === id) || allStaff.find(u => u.id === id);
    await supabase.from('profiles').update({ status: '탈퇴' }).eq('id', id);
    setSalesUsers(prev => prev.filter(u => u.id !== id));
    setAllStaff(prev => prev.filter(u => u.id !== id));
    if (departedUser) setDepartedUsers(prev => [...prev, { ...departedUser, status: '탈퇴' }]);
  }
  async function deleteAccountCompletely(user) {
    if (!confirm(`${user.name}님의 로그인 계정을 완전히 삭제할까요?\n이메일/비밀번호를 포함한 모든 정보가 영구 삭제되며 되돌릴 수 없습니다.`)) return;
    const { data, error } = await supabase.functions.invoke('hyper-function', { body: { user_id: user.id } });
    if (error || (data && data.error)) {
      let reason = data && data.error ? data.error : (error ? error.message : '알 수 없는 오류');
      if (error && error.context && typeof error.context.json === 'function') {
        try { const body = await error.context.json(); if (body && body.error) reason = body.error; } catch (e) { /* 무시 */ }
      }
      alert('삭제에 실패했습니다: ' + reason);
      return;
    }
    setSalesUsers(prev => prev.filter(u => u.id !== user.id));
    setAllStaff(prev => prev.filter(u => u.id !== user.id));
  }
  async function postAnnouncement(content) {
    const { data, error } = await supabase.from('announcements').insert({ content, created_by: myId }).select().single();
    if (!error) setAnnouncements(prev => [data, ...prev]);
  }
  async function updateAnnouncement(id, content) {
    await supabase.from('announcements').update({ content }).eq('id', id);
    setAnnouncements(prev => prev.map(a => a.id === id ? { ...a, content } : a));
  }
  async function deleteAnnouncement(id) {
    await supabase.from('announcements').delete().eq('id', id);
    setAnnouncements(prev => prev.filter(a => a.id !== id));
  }
  async function postUpdateLog(title, content) {
    const { data, error } = await supabase.from('update_logs').insert({ title, content, created_by: myId }).select().single();
    if (!error) setUpdateLogs(prev => [data, ...prev]);
  }
  async function editUpdateLog(id, title, content) {
    await supabase.from('update_logs').update({ title, content }).eq('id', id);
    setUpdateLogs(prev => prev.map(u => u.id === id ? { ...u, title, content } : u));
  }
  async function deleteUpdateLog(id) {
    await supabase.from('update_logs').delete().eq('id', id);
    setUpdateLogs(prev => prev.filter(u => u.id !== id));
  }
  async function addIncentiveRule(rule) {
    const { data, error } = await supabase.from('incentive_rules').insert({ ...rule, created_by: myId }).select().single();
    if (!error) setIncentiveRules(prev => [data, ...prev]);
    else alert('규칙 추가 실패: ' + error.message);
  }
  async function deleteIncentiveRule(id) {
    await supabase.from('incentive_rules').delete().eq('id', id);
    setIncentiveRules(prev => prev.filter(r => r.id !== id));
  }
  async function dismissUpdatePopup() {
    const latestId = updateLogs[0] ? updateLogs[0].id : 0;
    await supabase.from('profiles').update({ last_seen_update_id: latestId }).eq('id', myId);
    setLastSeenUpdateId(latestId);
    setShowUpdatePopup(false);
  }
  async function sendMessage(toId, content) {
    const { data, error } = await supabase.from('messages').insert({ to_user: toId, from_user: myId, content }).select().single();
    if (!error) setSentMessages(prev => [data, ...prev]);
    setMessageTarget(null);
  }
  async function markMessageRead(id) {
    await supabase.from('messages').update({ is_read: true }).eq('id', id);
    setInboxMessages(prev => prev.map(m => m.id === id ? { ...m, is_read: true } : m));
  }
  async function deleteMessage(id) {
    await supabase.from('messages').delete().eq('id', id);
    setInboxMessages(prev => prev.filter(m => m.id !== id));
    setSentMessages(prev => prev.filter(m => m.id !== id));
  }
  async function saveScript(id, content) {
    await supabase.from('scripts').upsert({ id, content, updated_at: new Date().toISOString() });
    setScripts(prev => ({ ...prev, [id]: content }));
  }
  function chunkArray(arr, size) {
    const out = [];
    for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
    return out;
  }
  async function distributeAmongReps(list, label) {
    if (salesUsers.length === 0) { alert('승인된 영업사원이 없습니다.'); return; }
    if (list.length === 0) return;
    if (!confirm(`${label} ${list.length}명을 영업사원 ${salesUsers.length}명에게 균등하게 나눠 배분할까요?`)) return;
    const groups = salesUsers.map(() => []);
    list.forEach((c, i) => groups[i % salesUsers.length].push(c.id));
    for (let i = 0; i < salesUsers.length; i++) {
      for (const batch of chunkArray(groups[i], 100)) {
        if (batch.length === 0) continue;
        await supabase.from('customers').update({ rep_id: salesUsers[i].id }).in('id', batch);
      }
    }
    await loadAll();
  }
  async function assignToRep(ids, repId) {
    for (const batch of chunkArray(ids, 100)) {
      await supabase.from('customers').update({ rep_id: repId }).in('id', batch);
    }
    setCustomers(prev => prev.map(c => ids.includes(c.id) ? { ...c, rep_id: repId } : c));
  }
  async function assignLinkCopier(customerId, repId) {
    if (customerId == null) return;
    await supabase.from('customers').update({ rep_id: repId }).eq('id', customerId);
    setCustomers(prev => prev.map(c => c.id === customerId ? { ...c, rep_id: repId } : c));
  }
  const bulkSelectedCount = Object.values(bulkSelected).filter(Boolean).length;
  function toggleBulkSelect(id) { setBulkSelected(prev => ({ ...prev, [id]: !prev[id] })); }
  async function bulkUnassign() {
    const ids = Object.keys(bulkSelected).filter(id => bulkSelected[id]).map(Number);
    if (ids.length === 0) return;
    if (!confirm(`선택한 ${ids.length}건을 미배정 상태로 되돌릴까요?`)) return;
    for (const batch of chunkArray(ids, 100)) {
      await supabase.from('customers').update({ rep_id: null }).in('id', batch);
    }
    setCustomers(prev => prev.map(c => ids.includes(c.id) ? { ...c, rep_id: null } : c));
    setBulkSelected({});
  }
  async function bulkDeleteCustomers(ids) {
    const movedRows = customers.filter(c => ids.includes(c.id));
    for (const batch of chunkArray(ids, 100)) {
      await supabase.from('customers').update({ deleted_at: new Date().toISOString(), deleted_by: myId }).in('id', batch);
    }
    setCustomers(prev => prev.filter(c => !ids.includes(c.id)));

                {isAdmin && <button onClick={() => { const ids = Object.keys(bulkSelected).filter(id => bulkSelected[id]).map(Number); if (ids.length === 0) return; if (!confirm(`선택한 ${ids.length}건을 삭제할까요?\n휴지통으로 이동되며, 휴지통 화면에서 복구하거나 완전삭제할 수 있습니다.`)) return; bulkDeleteCustomers(ids); setBulkSelected({}); }} style={{ background: '#7A2323', color: '#FFFFFF' }} className="text-[12.5px] px-3.5 py-2 rounded-lg font-medium whitespace-nowrap">🗑 전체삭제</button>}
                <button onClick={() => requestSms(Object.keys(bulkSelected).filter(id => bulkSelected[id]).map(Number), `${bulkSelectedCount}건`, () => setBulkSelected({}))} style={{ background: '#2F6B4F', color: '#FFFFFF' }} className="ml-auto text-[12.5px] px-3.5 py-2 rounded-lg font-medium whitespace-nowrap">📱 문자 발송</button>
              </div>
            )}
          </React.Fragment>
        )}
      </div>

      {tab === 'customers' && (
        <button onClick={openNew} style={{ background: '#2F6B4F' }} className="fixed bottom-5 right-5 text-white rounded-full w-14 h-14 flex items-center justify-center shadow-lg text-2xl" aria-label="신규DB 등록">＋</button>
      )}

      {editing && <EditModal data={editing} isAdmin={isAdmin} salesUsers={isAdmin ? allStaff : salesUsers} isNew={editing.id == null} onClose={() => setEditing(null)} onSave={saveCustomer} onDelete={(id) => setConfirmDelete(id)} currentUserId={myId} onAssignSelf={assignLinkCopier} effectiveScript={myPersonalScript || DEFAULT_SMS_SCRIPT} onRequestSms={(ids, label) => requestSms(ids, label)} />}

      {confirmDelete != null && (
        <div className="fixed inset-0 z-30 flex items-center justify-center px-6" style={{ background: 'rgba(28,38,32,0.5)' }}>
          <div style={{ background: '#FFFFFF' }} className="rounded-xl p-5 w-full max-w-xs">
            <p className="text-sm font-medium" style={{ color: '#1C2620' }}>이 고객 정보를 휴지통으로 보낼까요?</p>
            <p className="text-[13px] mt-1" style={{ color: '#6B6A63' }}>30일간 휴지통에 보관되며, 그 안에 관리자가 복원할 수 있습니다. 30일이 지나면 자동으로 완전히 삭제됩니다.</p>
            <div className="flex gap-2 mt-4">
              <button onClick={() => setConfirmDelete(null)} style={{ border: '1px solid #E4E2D9', color: '#4A4A45' }} className="flex-1 text-sm py-2 rounded-lg">취소</button>
              <button onClick={() => deleteCustomer(confirmDelete)} style={{ background: '#A32D2D', color: '#FFFFFF' }} className="flex-1 text-sm py-2 rounded-lg">삭제</button>
            </div>
          </div>
        </div>
      )}

      {showInbox && <MessageCenter received={inboxMessages} sent={sentMessages} staff={allStaff} onMarkRead={markMessageRead} onDelete={deleteMessage} onClose={() => setShowInbox(false)} />}
      {messageTarget && <MessageComposeModal target={messageTarget} onClose={() => setMessageTarget(null)} onSend={(text) => sendMessage(messageTarget.id, text)} />}
      {smsRequest && <SmsComposeModal targetLabel={smsRequest.targetLabel} defaultText={myPersonalScript || DEFAULT_SMS_SCRIPT} onClose={() => setSmsRequest(null)} onSend={async (msg, img) => {
        const res = await sendSmsToIds(smsRequest.ids, msg, img);
        if (res.sent > 0) {
          const successIds = (res.results || []).filter(r => r.status === '성공').map(r => r.customer_id);
          if (successIds.length > 0) await markSmsSent(successIds);
          if (smsRequest.onSent) smsRequest.onSent();
        }
        return res;
      }} />}
      {showSenderSetting && <SenderNumberModal currentNumber={currentUserSender} onClose={() => setShowSenderSetting(false)} onSave={saveSenderNumber} />}
      {showUpdatePopup && updateLogs.length > 0 && <UpdatePopupModal updates={updateLogs} lastSeenUpdateId={lastSeenUpdateId} onClose={dismissUpdatePopup} />}
    </div>
  );
}

function EditModal({ data, isAdmin, salesUsers, isNew, onClose, onSave, onDelete, currentUserId, onAssignSelf, effectiveScript, onRequestSms }) {
  const [form, setForm] = useState(data);
  const [error, setError] = useState('');
  const [showApplication, setShowApplication] = useState(false);
  const [linkCopied, setLinkCopied] = useState(false);
  const set = (k, v) => setForm(prev => ({ ...prev, [k]: v }));
  const toggleStage = (key) => setForm(prev => ({ ...prev, [key]: !prev[key] }));
  function handleSave() {
    if (!form.name.trim() || !form.phone.trim()) { setError('고객명, 연락처는 필수입니다.'); return; }
    onSave(form);
  }
  function openSmsPreview() {
    if (!form.id) { alert('먼저 저장한 뒤에 문자를 보낼 수 있습니다.'); return; }
    onRequestSms([form.id], form.name + '님');
  }
  function copyApplyLink() {
    if (!form.apply_token) { alert('신청서 링크를 사용할 수 없습니다. (이미 신청 완료되었거나 링크가 없는 건입니다)'); return; }
    const link = `${window.location.origin}${window.location.pathname}?apply=${form.apply_token}`;
    navigator.clipboard.writeText(link).then(() => {
      setLinkCopied(true);
      setTimeout(() => setLinkCopied(false), 1800);
      if (currentUserId && form.rep_id !== currentUserId) {
        onAssignSelf(form.id, currentUserId);
        setForm(prev => ({ ...prev, rep_id: currentUserId }));
      }
    });
  }
  const inputStyle = { background: '#F7F6F2', border: '1px solid #E4E2D9', color: '#1C2620' };
  const repName = (salesUsers.find(u => u.id === form.rep_id) || {}).name || '';
  return (
    <div className="fixed inset-0 z-20 flex items-end sm:items-center justify-center" style={{ background: 'rgba(28,38,32,0.5)' }}>
      <div style={{ background: '#FFFFFF' }} className="rounded-t-2xl sm:rounded-2xl w-full sm:max-w-md max-h-[88vh] overflow-y-auto">
        <div className="flex items-center justify-between px-4 pt-4 pb-2 sticky top-0" style={{ background: '#FFFFFF' }}>
          <h2 className="text-base font-semibold" style={{ color: '#1C2620' }}>{isNew ? '신규DB' : 'DB 수정'}</h2>
          <button onClick={onClose} aria-label="닫기" className="text-lg" style={{ color: '#9B998F' }}>✕</button>
        </div>
        <div className="px-4 pb-5 flex flex-col gap-3">
          <FieldInput label="DB시작일" type="date" value={form.visit_date || ''} onChange={e => set('visit_date', e.target.value)} />
          <FieldInput label="고객명 *" value={form.name} onChange={e => set('name', e.target.value)} placeholder="홍길동" />
          <div>
            <label className="text-[12.5px]" style={{ color: '#6B6A63' }}>연락처 *</label>
            <div className="flex items-center gap-2 mt-1">
              <input value={form.phone} onChange={e => set('phone', formatPhoneInput(e.target.value))} placeholder="010-0000-0000" maxLength={13} style={inputStyle} className="flex-1 rounded-lg px-3 py-2.5 text-sm outline-none" />
              {!isNew && (
                <button type="button" onClick={openSmsPreview} title="문자 발송" className="text-xl shrink-0">✉️</button>
              )}
            </div>
            {!isNew && (
              <label className="flex items-center gap-2 mt-1.5 text-[11.5px]" style={{ color: '#6B6A63' }}>
                <input type="checkbox" checked={!!form.sms_opt_out} onChange={e => set('sms_opt_out', e.target.checked)} />
                이 고객은 문자 수신을 거부했습니다 (체크 시 이후 모든 문자 발송에서 자동 제외)
              </label>
            )}
          </div>
          <div>
            <label className="text-[12.5px]" style={{ color: '#6B6A63' }}>영업 진행 단계</label>
            <div className="flex gap-2 mt-1.5">
              {STAGES.map(s => { const done = form[s.key]; return (
                <button key={s.key} type="button" onClick={() => toggleStage(s.key)} style={{ background: done ? '#2F6B4F' : '#F7F6F2', color: done ? '#FFFFFF' : '#6B6A63', border: '1px solid ' + (done ? '#2F6B4F' : '#E4E2D9') }} className="flex-1 flex items-center justify-center gap-1.5 rounded-lg py-2 text-[12.5px] font-medium">
                  <span>{done ? '✔' : s.icon}</span>{s.label}{s.key === 'sms2' && form.sms_sent_count > 0 ? `(${form.sms_sent_count})` : ''}
                </button>
              );})}
            </div>
          </div>
          <div>
            <label className="text-[12.5px]" style={{ color: '#6B6A63' }}>상태</label>
            <select value={form.status} onChange={e => set('status', e.target.value)} style={inputStyle} className="w-full mt-1 rounded-lg px-3 py-2.5 text-sm outline-none">
              {STATUS_ORDER.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <div>
            <label className="text-[12.5px]" style={{ color: '#6B6A63' }}>담당 영업사원</label>
            {isAdmin ? (
              <select value={form.rep_id || ''} onChange={e => set('rep_id', e.target.value)} style={inputStyle} className="w-full mt-1 rounded-lg px-3 py-2.5 text-sm outline-none">
                <option value="">미배정</option>
                {salesUsers.map(u => <option key={u.id} value={u.id}>{u.name}{u.role === 'admin' ? ' (관리자)' : ''}</option>)}
              </select>
            ) : <p className="mt-1 text-sm py-2.5" style={{ color: '#1C2620' }}>본인 담당</p>}
          </div>
          <div>
            <label className="text-[12.5px]" style={{ color: '#6B6A63' }}>상담 메모</label>
            <textarea value={form.memo || ''} onChange={e => set('memo', e.target.value)} style={inputStyle} rows={3} className="w-full mt-1 rounded-lg px-3 py-2.5 text-sm outline-none resize-none" placeholder="상담 내용을 기록하세요" />
          </div>
          {error && <p className="text-[13px]" style={{ color: '#A32D2D' }}>{error}</p>}
          {!isNew && form.status === '계약완료' && (
            <p className="text-[11.5px] px-3 py-2 rounded-lg" style={{ background: '#FAEEDA', color: '#854F0B' }}>계약완료 상태의 고객은 삭제할 수 없습니다. 삭제하려면 먼저 상태를 다른 값으로 바꾸고 저장해주세요.</p>
          )}
          {!isNew && (
            <button onClick={copyApplyLink} style={{ border: '1px solid #85B7EB', color: '#0C447C' }} className="text-[12.5px] font-medium py-2.5 rounded-lg">
              {linkCopied ? '링크 복사됨 ✓' : '📋 고객용 신청서 링크 복사'}
            </button>
          )}
          {!isNew && <p className="text-[11px] -mt-1.5" style={{ color: '#B0AEA4' }}>링크를 복사하면 이 고객의 담당자가 자동으로 본인으로 지정됩니다.</p>}
          <div className="flex gap-2 mt-1">
            {!isNew && (
              form.status === '계약완료'
                ? <button disabled title="계약완료 상태에서는 삭제할 수 없습니다" style={{ border: '1px solid #E4E2D9', color: '#C4C2B8', cursor: 'not-allowed' }} className="px-3.5 py-2.5 rounded-lg">🗑</button>
                : <button onClick={() => onDelete(form.id)} style={{ border: '1px solid #F0999540', color: '#A32D2D' }} className="px-3.5 py-2.5 rounded-lg">🗑</button>
            )}
            <button onClick={onClose} style={{ border: '1px solid #E4E2D9', color: '#4A4A45' }} className="flex-1 text-sm font-medium py-2.5 rounded-lg">취소</button>
            <button onClick={() => setShowApplication(true)} style={{ border: '1px solid #2F6B4F', color: '#2F6B4F' }} className="flex-1 text-sm font-medium py-2.5 rounded-lg">신청서 작성</button>
            <button onClick={handleSave} style={{ background: '#2F6B4F', color: '#FFFFFF' }} className="flex-1 text-sm font-medium py-2.5 rounded-lg">저장</button>
          </div>
        </div>
      </div>

      {showApplication && (
        <ApplicationModal
          base={form}
          repName={repName}
          onClose={() => setShowApplication(false)}
          onSubmit={(merged) => { setShowApplication(false); onSave(merged); }}
        />
      )}
    </div>
  );
}

function ApplicationModal({ base, repName, onClose, onSubmit }) {
  const [form, setForm] = useState({
    ...base,
    contractor_name: base.contractor_name || '',
    car_number: base.car_number || '',
    address: base.address || '',
    address_detail: base.address_detail || '',
    depositor_name: base.depositor_name || '',
    entry_time: base.entry_time || '',
    exit_time: base.exit_time || '',
  });
  const [freq, setFreq] = useState('');
  const [size, setSize] = useState('');
  const [isForeign, setIsForeign] = useState(false);
  const [sameAsCustomer, setSameAsCustomer] = useState(false);
  const [sameAsContractor, setSameAsContractor] = useState(false);
  const [privacyConsent, setPrivacyConsent] = useState(!!base.privacy_consent);
  const [marketingConsent, setMarketingConsent] = useState(!!base.marketing_consent);
  const [showPolicy, setShowPolicy] = useState(false);
  const [error, setError] = useState('');
  const set = (k, v) => setForm(prev => ({ ...prev, [k]: v }));
  const inputStyle = { background: '#F7F6F2', border: '1px solid #E4E2D9', color: '#1C2620' };
  const currentPrice = (freq && size) ? PRICE_TABLE[freq][size] + (isForeign ? 5000 : 0) : null;

  useEffect(() => {
    if (sameAsCustomer) set('contractor_name', form.name || '');
  }, [sameAsCustomer, form.name]);

  useEffect(() => {
    if (sameAsContractor) set('depositor_name', form.contractor_name || '');
  }, [sameAsContractor, form.contractor_name]);

  function openAddressSearch() {
    if (!window.daum || !window.daum.Postcode) {
      alert('주소 검색 기능을 불러오지 못했습니다. 페이지를 새로고침한 뒤 인터넷 연결 상태에서 다시 시도해주세요.');
      return;
    }
    new window.daum.Postcode({
      oncomplete: function (data) {
        const addr = data.roadAddress || data.address;
        set('address', addr);
      }
    }).open();
  }

  function handleSubmit() {
    if (!form.contractor_name.trim() || !form.car_number.trim() || !form.address.trim() || !form.depositor_name.trim() || !form.entry_time || !form.exit_time) {
      setError('계약자명, 차량번호, 주소, 입금자명, 입차시간, 출차시간은 필수입니다.');
      return;
    }
    if (!freq || !size) {
      setError('상품 카테고리(주기·크기)를 선택해주세요.');
      return;
    }
    if (!privacyConsent) {
      setError('개인정보 수집·이용 동의는 필수입니다.');
      return;
    }
    const amount = PRICE_TABLE[freq][size] + (isForeign ? 5000 : 0);
    const freqLabel = freq === '격주' ? '월2회(격주)' : '월4회';
    const sizeLabel = size === '대형' ? '대형(SUV포함)' : size;
    const product = `${freqLabel} · ${sizeLabel}${isForeign ? ' · 외제차' : ''}`;
    onSubmit({ ...form, amount, product, status: '계약완료', contract_date: new Date().toISOString().slice(0, 10), privacy_consent: privacyConsent, marketing_consent: marketingConsent });
  }

  return (
    <div className="fixed inset-0 z-30 flex items-end sm:items-center justify-center" style={{ background: 'rgba(28,38,32,0.6)' }}>
      <div style={{ background: '#FFFFFF' }} className="rounded-t-2xl sm:rounded-2xl w-full sm:max-w-md max-h-[90vh] overflow-y-auto">

          <h2 className="text-base font-semibold" style={{ color: '#1C2620' }}>신청서 작성</h2>
          <button onClick={onClose} aria-label="닫기" className="text-lg" style={{ color: '#9B998F' }}>✕</button>
        </div>
        <div className="px-4 pb-5 flex flex-col gap-3">
          <p className="text-[11.5px] px-3 py-2 rounded-lg" style={{ background: '#F1EFE8', color: '#6B6A63' }}>아래 정보는 신규DB에서 자동으로 불러왔습니다. 필요하면 수정할 수 있어요.</p>
          <FieldInput label="DB시작일" type="date" value={form.visit_date || ''} onChange={e => set('visit_date', e.target.value)} />
          <FieldInput label="고객명" value={form.name || ''} onChange={e => set('name', e.target.value)} />
          <FieldInput label="연락처" value={form.phone || ''} onChange={e => set('phone', formatPhoneInput(e.target.value))} maxLength={13} />
          <div>
            <label className="text-[12.5px]" style={{ color: '#6B6A63' }}>담당 영업사원</label>
            <p className="mt-1 text-sm py-2.5" style={{ color: '#1C2620' }}>{repName || '미배정'}</p>

            <label className="text-[12.5px]" style={{ color: '#6B6A63' }}>상담 메모</label>
            <textarea value={form.memo || ''} onChange={e => set('memo', e.target.value)} style={inputStyle} rows={2} className="w-full mt-1 rounded-lg px-3 py-2.5 text-sm outline-none resize-none" />
          </div>

          <div className="h-px my-1" style={{ background: '#E4E2D9' }} />

          <FieldInput label="입금자명 *" value={form.depositor_name} onChange={e => set('depositor_name', e.target.value)} placeholder="입금자명" disabled={sameAsContractor} />

          </label>
          <label className="flex items-start gap-2 text-[12.5px]" style={{ color: '#4A4A45' }}>

function PublicApplyPage({ token }) {
  const [loading, setLoading] = useState(true);
  const [notFound, setNotFound] = useState(false);
  const [customer, setCustomer] = useState(null);
  const [submitted, setSubmitted] = useState(false);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState('');
  const [form, setForm] = useState({ contractor_name: '', car_number: '', address: '', address_detail: '', depositor_name: '', entry_time: '', exit_time: '' });
  const [freq, setFreq] = useState('');
  const [size, setSize] = useState('');
  const [isForeign, setIsForeign] = useState(false);
  const [sameAsCustomer, setSameAsCustomer] = useState(false);
  const [sameAsContractor, setSameAsContractor] = useState(false);
  const [privacyConsent, setPrivacyConsent] = useState(false);
  const [marketingConsent, setMarketingConsent] = useState(false);
  const [showPolicy, setShowPolicy] = useState(false);
  const inputStyle = { background: '#F7F6F2', border: '1px solid #E4E2D9', color: '#1C2620' };
  const set = (k, v) => setForm(prev => ({ ...prev, [k]: v }));
  const currentPrice = (freq && size) ? PRICE_TABLE[freq][size] + (isForeign ? 5000 : 0) : null;

  useEffect(() => {
    (async () => {
      const { data, error: rpcError } = await supabase.rpc('get_application_by_token', { p_token: token });
      if (rpcError || !data) { setNotFound(true); setLoading(false); return; }
      setCustomer(data);
      setLoading(false);
    })();
  }, [token]);

  useEffect(() => { if (sameAsCustomer && customer) set('contractor_name', customer.name || ''); }, [sameAsCustomer, customer]);
  useEffect(() => { if (sameAsContractor) set('depositor_name', form.contractor_name || ''); }, [sameAsContractor, form.contractor_name]);

  useEffect(() => {
    if (!submitted) return;
    const timer = setTimeout(() => { window.close(); }, 3000);
    return () => clearTimeout(timer);
  }, [submitted]);

  function openAddressSearch() {
    if (!window.daum || !window.daum.Postcode) { alert('주소 검색 기능을 불러오지 못했습니다. 새로고침 후 다시 시도해주세요.'); return; }
    new window.daum.Postcode({ oncomplete: (data) => set('address', data.roadAddress || data.address) }).open();
  }

  async function handleSubmit() {
    if (!form.contractor_name.trim() || !form.car_number.trim() || !form.address.trim() || !form.depositor_name.trim() || !form.entry_time || !form.exit_time) {
      setError('계약자명, 차량번호, 주소, 입금자명, 입차시간, 출차시간을 모두 입력해주세요.'); return;
    }
    if (!freq || !size) { setError('상품 카테고리(주기·크기)를 선택해주세요.'); return; }
    if (!privacyConsent) { setError('개인정보 수집·이용 동의는 필수입니다.'); return; }
    setError(''); setSaving(true);
    const amount = PRICE_TABLE[freq][size] + (isForeign ? 5000 : 0);
    const freqLabel = freq === '격주' ? '월2회(격주)' : '월4회';
    const sizeLabel = size === '대형' ? '대형(SUV포함)' : size;
    const product = `${freqLabel} · ${sizeLabel}${isForeign ? ' · 외제차' : ''}`;
    const { error: rpcError } = await supabase.rpc('submit_application', {
      p_token: token, p_contractor_name: form.contractor_name, p_car_number: form.car_number,
      p_address: form.address, p_address_detail: form.address_detail, p_depositor_name: form.depositor_name,
      p_entry_time: form.entry_time, p_exit_time: form.exit_time, p_product: product, p_amount: amount,
      p_privacy_consent: privacyConsent, p_marketing_consent: marketingConsent,
    });
    setSaving(false);
    if (rpcError) { setError('제출 중 오류가 발생했습니다. 다시 시도해주세요.'); return; }
    setSubmitted(true);
  }

    <div style={{ background: '#1C2620', minHeight: '100vh' }} className="w-full flex items-center justify-center px-5 py-10">
      <div style={{ background: '#FFFFFF' }} className="w-full max-w-sm rounded-2xl p-6">{content}</div>
    </div>
  );

  if (loading) return shell(<p className="text-sm text-center py-10" style={{ color: '#6B6A63' }}>불러오는 중...</p>);
  if (notFound) return shell(<div className="text-center py-6"><div className="text-3xl mb-3">⚠️</div><p className="text-sm" style={{ color: '#4A4A45' }}>유효하지 않거나 이미 제출된 링크입니다.<br />담당 영업사원에게 새 링크를 요청해주세요.</p></div>);
  if (submitted) return shell(<div className="text-center py-6"><div className="text-3xl mb-3">✅</div><h2 className="text-base font-semibold" style={{ color: '#1C2620' }}>신청이 완료되었습니다</h2><p className="text-[13px] mt-2" style={{ color: '#6B6A63' }}>담당 영업사원이 확인 후 순차적으로 안내드리겠습니다. 감사합니다.</p><p className="text-[11.5px] mt-3" style={{ color: '#B0AEA4' }}>잠시 후 이 창이 자동으로 닫힙니다.</p></div>);

  return shell(
    <React.Fragment>
      <p className="text-[11px] tracking-wide uppercase" style={{ color: '#7C9385' }}>방문 세차 정기권</p>
      <h1 className="text-xl font-semibold mt-1 mb-1" style={{ color: '#1C2620' }}>신청서 작성</h1>
      <p className="text-[12.5px] mb-4" style={{ color: '#6B6A63' }}>{customer.name}님, 아래 정보를 입력해주세요.</p>
      <div className="flex flex-col gap-3">
        <FieldInput label="계약자명 *" value={form.contractor_name} onChange={e => set('contractor_name', e.target.value)} placeholder="계약 당사자 이름" disabled={sameAsCustomer} />
        <label className="flex items-center gap-2 -mt-1.5 text-[12.5px]" style={{ color: '#6B6A63' }}>
          <input type="checkbox" checked={sameAsCustomer} onChange={e => setSameAsCustomer(e.target.checked)} />
          신청자 본인과 계약자명이 동일합니다
        </label>
        <FieldInput label="차량번호 *" value={form.car_number} onChange={e => set('car_number', e.target.value)} placeholder="12가 3456" />
        <div>
          <label className="text-[12.5px]" style={{ color: '#6B6A63' }}>주소 *</label>
          <div className="flex gap-2 mt-1">
            <input value={form.address} onChange={e => set('address', e.target.value)} placeholder="주소찾기를 누르거나 직접 입력하세요" style={inputStyle} className="flex-1 rounded-lg px-3 py-2.5 text-sm outline-none" />
            <button type="button" onClick={openAddressSearch} style={{ background: '#2A362E', color: '#FFFFFF' }} className="px-3.5 rounded-lg text-sm font-medium whitespace-nowrap">주소찾기</button>
          </div>
        </div>
        <FieldInput label="상세주소" value={form.address_detail} onChange={e => set('address_detail', e.target.value)} placeholder="동/호수 등 상세주소" />
        <FieldInput label="입금자명 *" value={form.depositor_name} onChange={e => set('depositor_name', e.target.value)} placeholder="입금자명" disabled={sameAsContractor} />
        <label className="flex items-center gap-2 -mt-1.5 text-[12.5px]" style={{ color: '#6B6A63' }}>
          <input type="checkbox" checked={sameAsContractor} onChange={e => setSameAsContractor(e.target.checked)} />
          계약자명과 입금자명이 동일합니다
        </label>
        <div className="grid grid-cols-2 gap-2">
          <FieldInput label="입차시간 *" type="time" value={form.entry_time} onChange={e => set('entry_time', e.target.value)} />
          <FieldInput label="출차시간 *" type="time" value={form.exit_time} onChange={e => set('exit_time', e.target.value)} />
        </div>

        <div className="h-px my-1" style={{ background: '#E4E2D9' }} />

        <div>
          <label className="text-[12.5px]" style={{ color: '#6B6A63' }}>상품 카테고리 *</label>
          <div className="flex gap-2 mt-1.5">
            {['격주', '월4회'].map(f => (
              <button key={f} type="button" onClick={() => { setFreq(f); setSize(''); }} style={{ background: freq === f ? '#2F6B4F' : '#F7F6F2', color: freq === f ? '#FFFFFF' : '#6B6A63', border: '1px solid ' + (freq === f ? '#2F6B4F' : '#E4E2D9') }} className="flex-1 rounded-lg py-2 text-[12.5px] font-medium">
                {f === '격주' ? '월2회 (격주)' : '월4회'}
              </button>
            ))}
          </div>
          {freq && (
            <div className="flex gap-2 mt-2">
              {['소형', '중형', '대형'].map(s => (
                <button key={s} type="button" onClick={() => setSize(s)} style={{ background: size === s ? '#2F6B4F' : '#F7F6F2', color: size === s ? '#FFFFFF' : '#6B6A63', border: '1px solid ' + (size === s ? '#2F6B4F' : '#E4E2D9') }} className="flex-1 rounded-lg py-2 text-[12px] font-medium">
                  {s === '대형' ? '대형(SUV)' : s}
                </button>
              ))}
            </div>
          )}
          {freq && size && (
            <label className="flex items-center gap-2 mt-2.5 text-[12.5px]" style={{ color: '#6B6A63' }}>
              <input type="checkbox" checked={isForeign} onChange={e => setIsForeign(e.target.checked)} />
              외제차 (+5,000원)
            </label>
          )}
          {currentPrice != null && <p className="text-[14px] font-semibold mt-2" style={{ color: '#085041' }}>월 이용료: {currency(currentPrice)}</p>}
        </div>

        <div className="h-px my-1" style={{ background: '#E4E2D9' }} />

        <label className="flex items-start gap-2 text-[12.5px]" style={{ color: '#4A4A45' }}>
          <input type="checkbox" className="mt-0.5" checked={privacyConsent} onChange={e => setPrivacyConsent(e.target.checked)} />
          <span>(필수) 수집한 개인정보는 가입신청 및 고객관리 목적 이외에는 사용하지 않는다는 <button type="button" onClick={() => setShowPolicy(true)} style={{ color: '#0C447C', textDecoration: 'underline' }}>개인정보처리방침</button>에 동의합니다</span>
        </label>
        <label className="flex items-start gap-2 text-[12.5px]" style={{ color: '#4A4A45' }}>
          <input type="checkbox" className="mt-0.5" checked={marketingConsent} onChange={e => setMarketingConsent(e.target.checked)} />
          <span>(선택) 이벤트·할인·무료 실내세차 등 마케팅 정보 수신에 동의합니다</span>
        </label>

        {error && <p className="text-[13px]" style={{ color: '#A32D2D' }}>{error}</p>}
        <button onClick={handleSubmit} disabled={saving} style={{ background: '#2F6B4F', color: '#FFFFFF' }} className="mt-1 text-sm font-medium py-2.5 rounded-lg disabled:opacity-60">{saving ? '제출 중...' : '신청서 제출하기'}</button>
      </div>
      {showPolicy && <PrivacyPolicyModal onClose={() => setShowPolicy(false)} />}
    </React.Fragment>
  );
}

function PublicInquiryPage({ apt }) {

  const [privacyConsent, setPrivacyConsent] = useState(false);
  const [marketingConsent, setMarketingConsent] = useState(false);

  const [error, setError] = useState('');
  const [saving, setSaving] = useState(false);
  const [submitted, setSubmitted] = useState(false);
  const set = (k, v) => setForm(prev => ({ ...prev, [k]: v }));

  useEffect(() => {
    if (!submitted) return;
    const timer = setTimeout(() => { window.close(); }, 3000);
    return () => clearTimeout(timer);
  }, [submitted]);

  async function handleSubmit() {
    if (!form.name.trim() || !form.phone.trim()) { setError('이름과 연락처는 필수입니다.'); return; }
    if (!privacyConsent) { setError('개인정보 수집·이용 동의는 필수입니다.'); return; }
    setError(''); setSaving(true);
    const { error: rpcError } = await supabase.rpc('submit_inquiry', {
      p_name: form.name, p_phone: form.phone, p_complex: form.complex, p_unit: form.unit,
      p_privacy_consent: privacyConsent, p_marketing_consent: marketingConsent,

    if (rpcError) { setError('접수 중 오류가 발생했습니다. 다시 시도해주세요.'); return; }

      <h2 className="text-base font-semibold" style={{ color: '#1C2620' }}>상담 신청이 접수되었습니다</h2>
      <p className="text-[13px] mt-2" style={{ color: '#6B6A63' }}>담당자가 순차적으로 연락드리겠습니다. 감사합니다.</p>
      <p className="text-[11.5px] mt-3" style={{ color: '#B0AEA4' }}>잠시 후 이 창이 자동으로 닫힙니다.</p>

    <React.Fragment>
      <p className="text-[11px] tracking-wide uppercase" style={{ color: '#7C9385' }}>방문 세차 정기권</p>

      <p className="text-[12.5px] mb-4" style={{ color: '#6B6A63' }}>간단한 정보만 남겨주시면 담당자가 연락드립니다.</p>
      <div className="flex flex-col gap-3">
        <FieldInput label="이름 *" value={form.name} onChange={e => set('name', e.target.value)} placeholder="홍길동" />
        <FieldInput label="연락처 *" value={form.phone} onChange={e => set('phone', formatPhoneInput(e.target.value))} placeholder="010-0000-0000" maxLength={13} />
        <FieldInput label="아파트 단지" value={form.complex} onChange={e => set('complex', e.target.value)} placeholder="한빛아파트" />
        <FieldInput label="동/호수" value={form.unit} onChange={e => set('unit', e.target.value)} placeholder="101동 1203호 (선택)" />

        <label className="flex items-start gap-2 text-[12.5px]" style={{ color: '#4A4A45' }}>
          <input type="checkbox" className="mt-0.5" checked={privacyConsent} onChange={e => setPrivacyConsent(e.target.checked)} />
          <span>(필수) 수집한 개인정보는 가입신청 및 고객관리 목적 이외에는 사용하지 않는다는 <button type="button" onClick={() => setShowPolicy(true)} style={{ color: '#0C447C', textDecoration: 'underline' }}>개인정보처리방침</button>에 동의합니다</span>
        </label>
        <label className="flex items-start gap-2 text-[12.5px]" style={{ color: '#4A4A45' }}>
          <input type="checkbox" className="mt-0.5" checked={marketingConsent} onChange={e => setMarketingConsent(e.target.checked)} />
          <span>(선택) 이벤트·할인·무료 실내세차 등 마케팅 정보 수신에 동의합니다</span>
        </label>

        {error && <p className="text-[13px]" style={{ color: '#A32D2D' }}>{error}</p>}
        <button onClick={handleSubmit} disabled={saving} style={{ background: '#2F6B4F', color: '#FFFFFF' }} className="mt-1 text-sm font-medium py-2.5 rounded-lg disabled:opacity-60">{saving ? '접수 중...' : '상담 신청하기'}</button>
      </div>
      {showPolicy && <PrivacyPolicyModal onClose={() => setShowPolicy(false)} />}
    </React.Fragment>
  );
}

function App() {
  const [currentUser, setCurrentUser] = useState(null);
  const [authView, setAuthView] = useState('login');
  const [checking, setChecking] = useState(true);
  const applyToken = new URLSearchParams(window.location.search).get('apply');
  const inquiryParam = new URLSearchParams(window.location.search).get('inquiry');
  const inquiryApt = new URLSearchParams(window.location.search).get('apt');

  useEffect(() => {
    if (applyToken || inquiryParam) { setChecking(false); return; }
    (async () => {
      const { data } = await supabase.auth.getSession();
      if (data.session) {
        const { data: profile } = await supabase.from('profiles').select('*').eq('id', data.session.user.id).single();
        if (profile && profile.status === '승인') setCurrentUser(profile);
      }
      setChecking(false);
    })();
    const { data: sub } = supabase.auth.onAuthStateChange((event) => {
      if (event === 'SIGNED_OUT') setCurrentUser(null);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  async function handleLogout() {
    await supabase.auth.signOut();
    setCurrentUser(null);
    setAuthView('login');
  }

  if (applyToken) {
    return <PublicApplyPage token={applyToken} />;
  }
  if (inquiryParam) {
    return <PublicInquiryPage apt={inquiryApt} />;
  }

  if (checking) {
    return <div style={{ background: '#1C2620', minHeight: '100vh' }} className="w-full flex items-center justify-center"><p style={{ color: '#8FA89A' }} className="text-sm">불러오는 중...</p></div>;
  }

  return (
    <React.Fragment>
      <ConfigWarning />
      {!currentUser ? (
        authView === 'login'
          ? <LoginPage onLogin={setCurrentUser} onGotoSignup={() => setAuthView('signup')} />
          : <SignupPage onGotoLogin={() => setAuthView('login')} />
      ) : (
        <Dashboard currentUser={currentUser} onLogout={handleLogout} />
      )}
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
