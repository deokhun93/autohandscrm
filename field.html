.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:calc(100% - 32px);max-width:488px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-size:13.5px;z-index:60;display:flex;gap:10px;align-items:center}
.toast.err{background:#7A2E1C}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--sub)}
.pw{position:relative}.pw input{padding-right:48px;width:100%}

.auto{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer;user-select:none}.auto input{width:20px;height:20px;accent-color:#0C1422;margin:0;flex:none}

.memo-line .st{font-size:11px;font-weight:700;color:var(--sub)}.memo-line .st b{color:#1F5136}.memo-line .rp{color:#1D3A6E;font-weight:600}
.sheet{width:100%;max-width:440px;background:var(--paper);border-radius:20px;padding:20px 16px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(12,20,34,.3);max-height:92vh;overflow:auto}
.sheet .acts{display:flex;gap:10px}.sheet .acts>*{flex:1}
.ph-grid{display:flex;flex-wrap:wrap;gap:8px}.ph-grid .ph{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--line-2);background:#fff}
.ph-grid .ph img{width:100%;height:100%;object-fit:cover}.ph-grid .ph button{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(12,20,34,.75);color:#fff;font-size:14px;line-height:24px;padding:0}
.ph-add{width:72px;height:72px;border-radius:10px;border:1.5px dashed var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--sub);cursor:pointer;background:#fff}
.ph-add span{font-size:22px;line-height:1}
</style>

admin:'<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>'};

/* 여러 창(CRM·관리자웹·직원웹)이 로그인을 함께 써요: 다른 창이 3분 안에 열려 있었으면 '사용 중'으로 봐요 */
const STAFF_BEAT_KEY='crm-alive-at';
function staffBeat(){ try{ localStorage.setItem(STAFF_BEAT_KEY,String(Date.now())); }catch(_){} }
function staffAlive(){ try{ return sessionStorage.getItem(STAFF_ALIVE_KEY)==='1' || (Date.now()-Number(localStorage.getItem(STAFF_BEAT_KEY)||0))<180000; }catch(_){ return false; } }
let staffBeating=false;

function togglePw(btn){

/* ---------- 휴대폰 알림 (직원·관리자) ---------- */
I.bell=I.bell||'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>';

function b64ToU8(b){const p='='.repeat((4-b.length%4)%4);const raw=atob((b+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));}
const pushIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent), pushStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
async function checkPush(){
  try{
    if(pushIOS()&&!pushStandalone()) pushState='ios';
    else if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)) pushState='unsupported';
    else if(Notification.permission==='denied') pushState='denied';
    else { const reg=await navigator.serviceWorker.getRegistration(); const sub=reg?await reg.pushManager.getSubscription():null; pushState=(sub&&Notification.permission==='granted')?'on':'off'; }
  }catch(_){ pushState='off'; }
}
async function enablePush(){
  await checkPush();
  if(pushState==='on'){ toast('휴대폰 알림이 이미 켜져 있어요.'); return; }
  if(pushState==='ios'){ toast('아이폰은 홈 화면에 추가한 앱으로 열어야 알림을 받을 수 있어요.',true); return; }
  if(pushState==='unsupported'){ toast('이 브라우저는 알림을 지원하지 않아요. 크롬에서 열어 주세요.',true); return; }
  if(pushState==='denied'){ toast('알림이 차단되어 있어요. 휴대폰 설정 → 애플리케이션 → 앱(또는 Chrome) → 알림을 허용해 주세요.',true); return; }
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){ await checkPush(); render(); toast('알림이 허용되지 않았어요.',true); return; }

    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();

  }catch(e){ await checkPush(); render(); toast(friendly(e),true); }
}

async function loadMe(){
  const {data,error}=await db.from('profiles').select('id,name,role,status').eq('id',S.session.user.id).maybeSingle();
  if(error) throw error; S.me=data; if(window.StaffNotice) StaffNotice.reload();
}
async function loadAll(){
  try{
    if(!S.me) await loadMe();
    if(!S.me||S.me.status!=='승인'){ render(); return; }
    await db.rpc('ensure_wash_jobs',{p_from:S.day,p_to:S.day});  // 지정 요일 고객 일정을 자동으로 채움
    const [jobs,sum,reqs]=await Promise.all([
      db.from('wash_jobs').select('id,customer_id,wash_date,staff_id,sort_order,status,interior,interior_done,moved_from,done_at,customers(name,complex,unit,car_number,car_model,car_color)')
        .eq('wash_date',S.day).eq('staff_id',S.me.id).order('sort_order').order('id'),
      db.rpc('get_my_staff_summary',{p_day:S.day}),
      db.rpc('list_customer_requests',{p_type:'msg',p_only_open:false})
    ]);
    if(jobs.error) throw jobs.error; if(sum.error) throw sum.error;
    S.jobs=jobs.data||[]; S.sum=(sum.data&&sum.data[0])||null; S.reqs=reqs.error?[]:(reqs.data||[]);
    try{ const r=await db.rpc('list_my_field_reports',{p_date:S.day}); S.reps=r.error?[]:(r.data||[]); }catch(_){ S.reps=[]; }
    S.sel=S.sel.filter(id=>S.jobs.some(j=>j.customer_id===id));
    S.err='';
  }catch(e){ S.err=friendly(e); }
  render();
}

// 사진 줄이기 (긴 쪽 1600px, JPEG) — 데이터·저장공간 절약
async function shrinkImage(file){
  try{
    const url=URL.createObjectURL(file);
    const img=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=url;});
    const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement('canvas'); cv.width=Math.round(img.naturalWidth*k); cv.height=Math.round(img.naturalHeight*k);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(url);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.8));
    if(blob) return {blob,ext:'jpg',type:'image/jpeg'};
  }catch(_){}
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
  return {blob:file,ext,type:file.type||'image/jpeg'};
}
async function sendMemo(){
  const m=S.memo; if(!m||S.busy) return;
  const body=m.body.trim(); if(!body&&!m.files.length) return;
  S.busy=true; render();
  const paths=[];
  try{
    for(let i=0;i<m.files.length;i++){
      m.prog=`사진 올리는 중 ${i+1}/${m.files.length}`; render();
      const {blob,ext,type}=await shrinkImage(m.files[i].file);
      const path=`${S.me.id}/${S.day}/${Date.now()}-${i}-${Math.random().toString(36).slice(2,7)}.${ext}`;
      const up=await db.storage.from('field-photos').upload(path,blob,{contentType:type,upsert:false});
      if(up.error) throw up.error;
      paths.push(path);
    }
    m.prog='보내는 중...'; render();
    const {error}=await db.rpc('submit_field_report',{p_job_id:m.jobId,p_body:body,p_photos:paths});
    if(error) throw error;
    m.files.forEach(f=>URL.revokeObjectURL(f.url));
    S.memo=null; S.busy=false; kickPush(); toast('담당 관리자에게 전달했어요.'); await loadAll();
  }catch(err){
    if(paths.length) db.storage.from('field-photos').remove(paths).catch(()=>{});
    S.busy=false; m.prog=''; toast(/bucket|not found/i.test(err.message||'')?'사진 저장소가 아직 준비되지 않았어요. 관리자에게 21번 SQL 실행을 요청해 주세요.':friendly(err),true); render();
  }
}

let tt;function toast(m,err){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.appendChild(t);}t.className='toast'+(err?' err':'');t.innerHTML=`${ic(err?'bell':'check')}<span>${esc(m)}</span>`;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200);}
async function upd(id,patch,okMsg){
  S.busy=true;
  const {error}=await db.from('wash_jobs').update(patch).eq('id',id);
  S.busy=false; S.dialog=null;
  if(error){ toast(friendly(error),true); render(); return; }
  kickPush(); if(okMsg) toast(okMsg); await loadAll();
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  if(t.classList.contains('scrim')&&e.target.closest('[data-stop]')) return;
  const a=t.dataset.act, id=Number(t.dataset.id), j=S.jobs.find(x=>x.id===id);
  switch(a){
    case 'logout': await db.auth.signOut(); break;
    case 'reload': await loadAll(); toast('새로 불러왔어요.'); break;
    case 'push-on': await enablePush(); break;
    case 'pw-eye': togglePw(t); break;
    case 'day': {const [y,m,d]=S.day.split('-').map(Number);const dt=new Date(y,m-1,d+Number(t.dataset.d));S.day=keyOf(dt);S.sel=[];await loadAll();break;}
    case 'today': S.day=keyOf(new Date()); S.sel=[]; await loadAll(); break;
    case 'apt': S.apt=t.dataset.a; render(); break;
    case 'close': if(!S.busy){S.dialog=null;render();} break;
    case 'memo': S.memo={jobId:id,body:'',files:[],prog:''}; render(); setTimeout(()=>{const el=$('#memo-body'); if(el) el.focus();},40); break;
    case 'memo-close': if(!S.busy&&(e.target===t||t.tagName==='BUTTON')){ if(S.memo) S.memo.files.forEach(f=>URL.revokeObjectURL(f.url)); S.memo=null; render(); } break;
    case 'memo-rm': if(S.memo&&!S.busy){ const i=Number(t.dataset.i); const f=S.memo.files.splice(i,1)[0]; if(f) URL.revokeObjectURL(f.url); render(); } break;
    case 'memo-send': await sendMemo(); break;
    case 'done': S.dialog={title:'고객에게 완료 알림을 보낼까요?',body:`${(j.customers||{}).car_number||''} 세차를 완료로 처리하고 고객 앱에 '세차가 완료되었어요' 알림을 보내요.`,ok:'알림 보내기',run:()=>upd(id,{status:'완료'},'완료 알림을 보냈어요. +'+won(PAY))}; render(); break;
    case 'skip': S.dialog={title:'미작업으로 처리할까요?',body:'차량이 없거나 세차를 못 한 경우에 눌러 주세요. 회사에 미작업으로 보고돼요.',ok:'미작업 처리',run:()=>upd(id,{status:'미작업'},'미작업으로 처리했어요.')}; render(); break;
    case 'undo': await upd(id,{status:'대기'},'다시 대기로 바꿨어요.'); break;
    case 'confirm': if(S.dialog&&!S.busy){ S.busy=true; render(); await S.dialog.run(); } break;
    case 'sel-all': {const ids=S.jobs.filter(j=>S.apt==='전체'||((j.customers||{}).complex||'기타')===S.apt).map(j=>j.customer_id);const all=ids.every(x=>S.sel.includes(x));S.sel=all?S.sel.filter(x=>!ids.includes(x)):[...new Set([...S.sel,...ids])];render();break;}
    case 'notice': {
      const body=S.notice.trim(); if(!body||!S.sel.length) break;
      S.busy=true; render();
      const {data,error}=await db.rpc('send_customer_notice',{p_customer_ids:S.sel,p_title:'공지사항',p_body:body});
      S.busy=false;
      if(error){ toast(friendly(error),true); render(); break; }
      kickPush(); S.notice=''; S.sel=[]; toast(`${data||0}명에게 공지를 보냈어요.`); render(); break;
    }
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='day'&&t.value){ S.day=t.value; S.sel=[]; await loadAll(); return; }
  if(t.dataset.sel){ const id=Number(t.dataset.sel); S.sel=t.checked?[...new Set([...S.sel,id])]:S.sel.filter(x=>x!==id); render(); return; }
  if(t.dataset.int){ await upd(Number(t.dataset.int),{interior_done:t.checked},null); }
  if(t.id==='memo-file'&&S.memo){
    const room=MAX_PH-S.memo.files.length, list=[...t.files].filter(f=>/^image\//.test(f.type)||/\.(heic|heif|jpe?g|png|webp)$/i.test(f.name));
    if(list.length>room) toast(`사진은 ${MAX_PH}장까지 넣을 수 있어요.`,true);
    list.slice(0,room).forEach(f=>S.memo.files.push({file:f,url:URL.createObjectURL(f)})); render();
  }
});
document.addEventListener('input',e=>{ if(e.target.id==='memo-body'&&S.memo){ S.memo.body=e.target.value; const b=document.querySelector('[data-act="memo-send"]'); if(b) b.disabled=S.busy||(!S.memo.body.trim()&&!S.memo.files.length); return; } if(e.target.id==='notice'){ S.notice=e.target.value; const b=$('#nt-send'); if(b) b.disabled=!(S.sel.length&&S.notice.trim()); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.dialog&&!S.busy){S.dialog=null;render();} else if(e.key==='Escape'&&S.memo&&!S.busy){S.memo=null;render();} });
document.addEventListener('submit',async e=>{
  if(e.target.id!=='login') return; e.preventDefault();
  const em=$('#em').value.trim(), pw=$('#pw').value;
  if(!em||!pw){ S.err='이메일과 비밀번호를 입력해 주세요.'; render(); return; }
  const autoOn=!!($('#auto')||{}).checked; staffSetAuto(autoOn);
  S.busy=true; S.err=''; render(); $('#em').value=em; if($('#auto')) $('#auto').checked=autoOn;
  const {error}=await db.auth.signInWithPassword({email:em,password:pw});
  S.busy=false; if(error){ S.err=friendly(error); render(); $('#em').value=em; }
});
(async function boot(){
  if(!db){ S.ready=true; render(); return; }
  let {data}=await db.auth.getSession();
  // 자동 로그인을 끈 경우: 앱(브라우저)을 완전히 닫았다 열면 로그아웃
  const alive=staffAlive();
  if(data.session && !staffGetAuto() && !alive){ await db.auth.signOut({scope:'local'}); data={session:null}; }
  try{ sessionStorage.setItem(STAFF_ALIVE_KEY,'1'); }catch(_){}
  staffStartBeat();
  S.session=data.session; S.ready=true;
  if(S.session) await loadAll(); else render();
  db.auth.onAuthStateChange(async (ev,session)=>{ const was=!!S.session; S.session=session; if(!session){ S.me=null; S.jobs=[]; render(); return; } if(!was){ S.err=''; await loadAll(); } });
  setInterval(()=>{ const ae=document.activeElement; if(S.session&&S.me&&!S.dialog&&!S.memo&&!(ae&&/INPUT|TEXTAREA/.test(ae.tagName))&&document.visibilityState==='visible') loadAll(); },60000);
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}</script>
</body>
