.auto{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer;user-select:none}.auto input{width:20px;height:20px;accent-color:#0C1422;margin:0;flex:none}
.memo-line{margin:0;display:flex;flex-direction:column;gap:3px;font-size:12.5px;background:#EEF2F8;border-radius:10px;padding:8px 10px;color:var(--text)}
.memo-line .st{font-size:11px;font-weight:700;color:var(--sub)}.memo-line .st b{color:#1F5136}.memo-line .rp{color:#1D3A6E;font-weight:600}
.sheet{width:100%;max-width:440px;background:var(--paper);border-radius:20px;padding:20px 16px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(12,20,34,.3);max-height:92vh;overflow:auto}
.sheet .acts{display:flex;gap:10px}.sheet .acts>*{flex:1}
.ph-grid{display:flex;flex-wrap:wrap;gap:8px}.ph-grid .ph{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--line-2);background:#fff}
.ph-grid .ph img{width:100%;height:100%;object-fit:cover}.ph-grid .ph button{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(12,20,34,.75);color:#fff;font-size:14px;line-height:24px;padding:0}
.ph-add{width:72px;height:72px;border-radius:10px;border:1.5px dashed var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--sub);cursor:pointer;background:#fff}
.ph-add span{font-size:22px;line-height:1}
.lang-sw{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;background:var(--card)}.lang-sw button{border:0;background:none;padding:7px 11px;font-size:12px;font-weight:800;color:var(--sub);cursor:pointer}.lang-sw button[aria-pressed="true"]{background:var(--ink);color:#E2C77F}
.part{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--paper)}.part.ok{background:var(--ok);border-color:#7DBE98}.part.no{background:#F8E3DD;border-color:#E3B4A6}
.part .by{font-weight:500;color:var(--sub);font-size:12.5px}.rsn{display:flex;flex-wrap:wrap;gap:8px}
.tr-link{font-size:12px;font-weight:700;color:#1D3A6E;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
</style>

<script>
const SUPABASE_URL='https://kkmmfbqiddirhbiqtqsu.supabase.co';
const SUPABASE_KEY='sb_publishable_4UNSE0BXfpI5lp4uc-ulxA_EqldYgh-';
const PAY=5000;
/* ---------- 언어 (한국어 / English) — 고른 언어는 이 휴대폰에 기억돼요 ---------- */
const LANG_KEY='ah-field-lang';
let LANG=(()=>{ try{ return localStorage.getItem(LANG_KEY)||((navigator.language||'').toLowerCase().startsWith('ko')?'ko':'ko'); }catch(_){ return 'ko'; } })();
const tr=(ko,en)=>LANG==='en'?en:ko;
function setLang(l){ LANG=l; try{ localStorage.setItem(LANG_KEY,l); }catch(_){} document.documentElement.lang=l; render(); if(window.StaffNotice) StaffNotice.reload(); }
document.documentElement.lang=LANG;
// 파파고 번역 창 열기 (sk=auto: 언어 자동 감지)
const papago=(text,to)=>`https://papago.naver.com/?sk=auto&tk=${to}&st=${encodeURIComponent(String(text||'').slice(0,1500))}`;
const trLink=(text,to)=>text?`<a class="tr-link" href="${papago(text,to)}" target="_blank" rel="noopener">🌐 ${to==='ko'?'한국어로 번역':'Translate to English'}</a>`:'';
const db=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'carwash-crm-auth'}}):null;
const I={drop:'<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>',
check:'<path d="M20 6 9 17l-5-5"/>',send:'<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/>',
undo:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',logout:'<path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>',
msg:'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',bell:'<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>',
refresh:'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
admin:'<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>'};
const ic=(n,s)=>`<svg class="i" viewBox="0 0 24 24"${s?` style="width:${s}px;height:${s}px"`:''} aria-hidden="true">${I[n]}</svg>`;
/* ---------- 비밀번호 보기 · 자동 로그인 (CRM·관리자·직원 앱 공통 설정) ---------- */
I.eye=I.eye||'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
I.eyeOff=I.eyeOff||'<path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.2 3.2"/><path d="M6.6 6.6C3.9 8.3 2 12 2 12s3.5 7 10 7c1.9 0 3.5-.5 4.9-1.3"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/>';
const STAFF_AUTO_KEY='crm-auto-login', STAFF_ALIVE_KEY='crm-alive';
/* 여러 창(CRM·관리자웹·직원웹)이 로그인을 함께 써요: 다른 창이 3분 안에 열려 있었으면 '사용 중'으로 봐요 */
const STAFF_BEAT_KEY='crm-alive-at';
function staffBeat(){ try{ localStorage.setItem(STAFF_BEAT_KEY,String(Date.now())); }catch(_){} }
function staffAlive(){ try{ return sessionStorage.getItem(STAFF_ALIVE_KEY)==='1' || (Date.now()-Number(localStorage.getItem(STAFF_BEAT_KEY)||0))<180000; }catch(_){ return false; } }
let staffBeating=false;
function staffStartBeat(){ if(staffBeating) return; staffBeating=true; staffBeat(); setInterval(staffBeat,30000); addEventListener('pagehide',staffBeat); document.addEventListener('visibilitychange',staffBeat); }

const staffGetAuto=()=>{ try{ return localStorage.getItem(STAFF_AUTO_KEY)!=='0'; }catch(_){ return true; } };
function staffSetAuto(on){ try{ localStorage.setItem(STAFF_AUTO_KEY,on?'1':'0'); sessionStorage.setItem(STAFF_ALIVE_KEY,'1'); }catch(_){} }
function togglePw(btn){
  const inp=document.getElementById(btn.dataset.for); if(!inp) return;
  const show=inp.type==='password'; inp.type=show?'text':'password';
  btn.innerHTML=ic(show?'eyeOff':'eye',20); btn.setAttribute('aria-pressed',String(show)); btn.setAttribute('aria-label',show?'비밀번호 숨기기':'비밀번호 보기');
  inp.focus({preventScroll:true}); try{ const n=inp.value.length; inp.setSelectionRange(n,n); }catch(_){}
}

/* ---------- 휴대폰 알림 (직원·관리자) ---------- */
I.bell=I.bell||'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>';
const VAPID_PUBLIC_KEY='BK2UTh2PXr0eHlrzE6aF_yQz6oePPhcAc2brXaYMI19efZnUKa8oI8OR8BLG-QsJayVjcRNA7Zyu0xX3icYEE7A';
let pushState='checking';
function kickPush(){ try{ if(db) db.functions.invoke('hyper-endpoint',{body:{}}).catch(()=>{}); }catch(_){} }
function b64ToU8(b){const p='='.repeat((4-b.length%4)%4);const raw=atob((b+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));}
const pushIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent), pushStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
async function checkPush(){
  try{
    if(pushIOS()&&!pushStandalone()) pushState='ios';
    else if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)) pushState='unsupported';
    else if(Notification.permission==='denied') pushState='denied';
    else { const reg=await navigator.serviceWorker.getRegistration(); const sub=reg?await reg.pushManager.getSubscription():null; pushState=(sub&&Notification.permission==='granted')?'on':'off'; }
  }catch(_){ pushState='off'; }
}
async function enablePush(){
  await checkPush();
  if(pushState==='on'){ toast(tr('휴대폰 알림이 이미 켜져 있어요.','Phone notifications are already on.')); return; }
  if(pushState==='ios'){ toast(tr('아이폰은 홈 화면에 추가한 앱으로 열어야 알림을 받을 수 있어요.','On iPhone, open the app from your home screen to get notifications.'),true); return; }
  if(pushState==='unsupported'){ toast(tr('이 브라우저는 알림을 지원하지 않아요. 크롬에서 열어 주세요.','This browser does not support notifications. Please use Chrome.'),true); return; }
  if(pushState==='denied'){ toast(tr('알림이 차단되어 있어요. 휴대폰 설정 → 애플리케이션 → 앱(또는 Chrome) → 알림을 허용해 주세요.','Notifications are blocked. Go to phone Settings → Apps → this app (or Chrome) → allow notifications.'),true); return; }
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){ await checkPush(); render(); toast(tr('알림이 허용되지 않았어요.','Notifications were not allowed.'),true); return; }
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(VAPID_PUBLIC_KEY)});
    const j=sub.toJSON();
    const {error}=await db.rpc('save_staff_push',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});
    if(error) throw error;
    pushState='on'; render(); toast(tr('휴대폰 알림을 켰어요. 새 요청이 오면 바로 알려드려요.','Phone notifications are on.'));
  }catch(e){ await checkPush(); render(); toast(friendly(e),true); }
}

async function loadMe(){
  const {data,error}=await db.from('profiles').select('id,name,role,status').eq('id',S.session.user.id).maybeSingle();
  if(error) throw error; S.me=data; if(window.StaffNotice) StaffNotice.reload();

async function loadAll(){
  try{
    if(!S.me) await loadMe();
    if(!S.me||S.me.status!=='승인'){ render(); return; }
    await db.rpc('ensure_wash_jobs',{p_from:S.day,p_to:S.day});  // 지정 요일 고객 일정을 자동으로 채움
    const [jobs,sum,reqs]=await Promise.all([
      db.rpc('list_my_jobs',{p_day:S.day}).then(r=>{ if(!r.error){ S.v53=true; return {data:(r.data||[]).map(x=>({...x,customers:{name:x.name,complex:x.complex,unit:x.unit,car_number:x.car_number,car_model:x.car_model,car_color:x.car_color}}))}; }
        S.v53=false; return db.from('wash_jobs').select('id,customer_id,wash_date,staff_id,sort_order,status,interior,interior_done,moved_from,done_at,customers(name,complex,unit,car_number,car_model,car_color)')
          .eq('wash_date',S.day).eq('staff_id',S.me.id).order('sort_order').order('id'); }),
      db.rpc('get_my_staff_summary',{p_day:S.day}),
      db.rpc('list_customer_requests',{p_type:'msg',p_only_open:false})
    ]);
    if(jobs.error) throw jobs.error; if(sum.error) throw sum.error;
    S.jobs=jobs.data||[]; S.sum=(sum.data&&sum.data[0])||null; S.reqs=reqs.error?[]:(reqs.data||[]);
    try{ const r=await db.rpc('list_my_field_reports',{p_date:S.day}); S.reps=r.error?[]:(r.data||[]); }catch(_){ S.reps=[]; }
    S.sel=S.sel.filter(id=>S.jobs.some(j=>j.customer_id===id));
    S.err='';
  }catch(e){ S.err=friendly(e); }
  render();
}

// 사진 줄이기 (긴 쪽 1600px, JPEG) — 데이터·저장공간 절약
async function shrinkImage(file){
  try{
    const url=URL.createObjectURL(file);
    const img=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=url;});
    const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement('canvas'); cv.width=Math.round(img.naturalWidth*k); cv.height=Math.round(img.naturalHeight*k);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(url);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.8));
    if(blob) return {blob,ext:'jpg',type:'image/jpeg'};
  }catch(_){}
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
  return {blob:file,ext,type:file.type||'image/jpeg'};
}
async function sendMemo(){
  const m=S.memo; if(!m||S.busy) return;
  const body=m.body.trim(); if(!body&&!m.files.length) return;
  S.busy=true; render();
  const paths=[];
  try{
    for(let i=0;i<m.files.length;i++){
      m.prog=tr(`사진 올리는 중 ${i+1}/${m.files.length}`,`Uploading photo ${i+1}/${m.files.length}`); render();
      const {blob,ext,type}=await shrinkImage(m.files[i].file);
      const path=`${S.me.id}/${S.day}/${Date.now()}-${i}-${Math.random().toString(36).slice(2,7)}.${ext}`;
      const up=await db.storage.from('field-photos').upload(path,blob,{contentType:type,upsert:false});
      if(up.error) throw up.error;
      paths.push(path);
    }
    m.prog=tr('보내는 중...','Sending...'); render();
    const {error}=await db.rpc('submit_field_report',{p_job_id:m.jobId,p_body:body,p_photos:paths});
    if(error) throw error;
    m.files.forEach(f=>URL.revokeObjectURL(f.url));
    S.memo=null; S.busy=false; kickPush(); toast(tr('담당 관리자에게 전달했어요.','Sent to your manager.')); await loadAll();
  }catch(err){
    if(paths.length) db.storage.from('field-photos').remove(paths).catch(()=>{});
    S.busy=false; m.prog=''; toast(/bucket|not found/i.test(err.message||'')?tr('사진 저장소가 아직 준비되지 않았어요. 관리자에게 21번 SQL 실행을 요청해 주세요.','Photo storage is not ready yet. Please tell the manager.'):friendly(err),true); render();
  }
}

  if(d) setTimeout(()=>$('#dg-ok')&&$('#dg-ok').focus(),30);

let tt;function toast(m,err){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.appendChild(t);}t.className='toast'+(err?' err':'');t.innerHTML=`${ic(err?'bell':'check')}<span>${esc(m)}</span>`;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200);}
async function upd(id,patch,okMsg){
  S.busy=true;
  const {error}=await db.from('wash_jobs').update(patch).eq('id',id);
  S.busy=false; S.dialog=null;
  if(error){ toast(friendly(error),true); render(); return; }
  kickPush(); if(okMsg) toast(okMsg); await loadAll();
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  if(t.classList.contains('scrim')&&e.target.closest('[data-stop]')) return;
  const a=t.dataset.act, id=Number(t.dataset.id), j=S.jobs.find(x=>x.id===id);
  switch(a){
    case 'logout': await db.auth.signOut(); break;
    case 'lang': setLang(t.dataset.l); break;
    case 'tr-notice': { const v=($('#notice')||{}).value||''; if(!v.trim()){ toast('Write your message first.',true); break; } window.open(papago(v,'ko'),'_blank','noopener'); break; }
    case 'reload': await loadAll(); toast(tr('새로 불러왔어요.','Refreshed.')); break;
    case 'push-on': await enablePush(); break;
    case 'pw-eye': togglePw(t); break;
    case 'day': {const [y,m,d]=S.day.split('-').map(Number);const dt=new Date(y,m-1,d+Number(t.dataset.d));S.day=keyOf(dt);S.sel=[];await loadAll();break;}
    case 'today': S.day=keyOf(new Date()); S.sel=[]; await loadAll(); break;
    case 'apt': S.apt=t.dataset.a; render(); break;
    case 'close': if(!S.busy){S.dialog=null;render();} break;
    case 'memo': S.memo={jobId:id,body:'',files:[],prog:''}; render(); setTimeout(()=>{const el=$('#memo-body'); if(el) el.focus();},40); break;
    case 'memo-close': if(!S.busy&&(e.target===t||t.tagName==='BUTTON')){ if(S.memo) S.memo.files.forEach(f=>URL.revokeObjectURL(f.url)); S.memo=null; render(); } break;
    case 'memo-rm': if(S.memo&&!S.busy){ const i=Number(t.dataset.i); const f=S.memo.files.splice(i,1)[0]; if(f) URL.revokeObjectURL(f.url); render(); } break;
    case 'memo-send': await sendMemo(); break;
    case 'part': { if(!j) break; const part=t.dataset.part, st=t.dataset.st, car=(j.customers||{}).car_number||'', lab=part==='ext'?tr('외부세차','exterior wash'):tr('실내세차','interior wash');
      if(st==='미완료'){ S.rsn={jobId:id,part,v:'',etc:''}; render(); break; }
      if(st==='대기'){ await setPart(id,part,'대기','',tr('대기로 되돌렸어요.','Changed back to waiting.')); break; }
      S.dialog={title:tr(`${lab} 완료 알림을 보낼까요?`,`Send "${lab} done" to the customer?`),body:tr(`${car} ${lab}를 완료로 처리하고 고객 앱에 '${lab}가 완료되었어요' 알림을 보내요.`,`Marks ${car} ${lab} as done and notifies the customer.`),ok:tr('알림 보내기','Send'),
        run:()=>setPart(id,part,'완료','',part==='ext'?tr('외부세차 완료 알림을 보냈어요. +','Exterior done notice sent. +')+won(PAY):tr('실내세차 완료 알림을 보냈어요.','Interior done notice sent.'))}; render(); break; }
    case 'rsn-pick': if(S.rsn&&!S.busy){ S.rsn.v=t.dataset.v; render(); if(S.rsn.v==='기타') setTimeout(()=>{const el=$('#rsn-etc'); if(el) el.focus();},30); } break;
    case 'rsn-close': if(!S.busy&&(e.target===t||t.tagName==='BUTTON')){ S.rsn=null; render(); } break;
    case 'rsn-send': { const r=S.rsn; if(!r||!r.v||S.busy) break; const why=r.v==='기타'?String(r.etc||'').trim():r.v;
      if(!why){ toast(tr('기타 사유를 적어 주세요.','Please write the reason.'),true); break; }
      await setPart(r.jobId,r.part,'미완료',r.v==='기타'?'기타: '+why:why,tr('미완료로 보고했어요.','Reported as not done.')); break; }
    case 'done': S.dialog={title:tr('고객에게 완료 알림을 보낼까요?','Send "wash done" to the customer?'),body:tr(`${(j.customers||{}).car_number||''} 세차를 완료로 처리하고 고객 앱에 '세차가 완료되었어요' 알림을 보내요.`,`Marks ${(j.customers||{}).car_number||''} as done and notifies the customer.`),ok:tr('알림 보내기','Send'),run:()=>upd(id,{status:'완료'},tr('완료 알림을 보냈어요. +','Done notice sent. +')+won(PAY))}; render(); break;
    case 'skip': S.dialog={title:tr('미작업으로 처리할까요?','Mark as not done?'),body:tr('차량이 없거나 세차를 못 한 경우에 눌러 주세요. 회사에 미작업으로 보고돼요.','Use this when the car was not there or could not be washed. It is reported to the office.'),ok:tr('미작업 처리','Not done'),run:()=>upd(id,{status:'미작업'},tr('미작업으로 처리했어요.','Marked as not done.'))}; render(); break;
    case 'undo': await upd(id,{status:'대기'},tr('다시 대기로 바꿨어요.','Changed back to waiting.')); break;
    case 'confirm': if(S.dialog&&!S.busy){ S.busy=true; render(); await S.dialog.run(); } break;
    case 'sel-all': {const ids=S.jobs.filter(j=>S.apt==='전체'||((j.customers||{}).complex||'기타')===S.apt).map(j=>j.customer_id);const all=ids.every(x=>S.sel.includes(x));S.sel=all?S.sel.filter(x=>!ids.includes(x)):[...new Set([...S.sel,...ids])];render();break;}
    case 'notice': {
      const body=S.notice.trim(); if(!body||!S.sel.length) break;

      const {data,error}=await db.rpc('send_customer_notice',{p_customer_ids:S.sel,p_title:'공지사항',p_body:body});
      S.busy=false;
      if(error){ toast(friendly(error),true); render(); break; }
      kickPush(); S.notice=''; S.sel=[]; toast(tr(`${data||0}명에게 공지를 보냈어요.`,`Notice sent to ${data||0} customer(s).`)); render(); break;
    }
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='day'&&t.value){ S.day=t.value; S.sel=[]; await loadAll(); return; }

document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.dialog&&!S.busy){S.dialog=null;render();} else if(e.key==='Escape'&&S.memo&&!S.busy){S.memo=null;render();} });
document.addEventListener('submit',async e=>{
  if(e.target.id!=='login') return; e.preventDefault();

(async function boot(){
  if(!db){ S.ready=true; render(); return; }
  let {data}=await db.auth.getSession();
  // 자동 로그인을 끈 경우: 앱(브라우저)을 완전히 닫았다 열면 로그아웃
  const alive=staffAlive();
  if(data.session && !staffGetAuto() && !alive){ await db.auth.signOut({scope:'local'}); data={session:null}; }
  try{ sessionStorage.setItem(STAFF_ALIVE_KEY,'1'); }catch(_){}
  staffStartBeat();
  S.session=data.session; S.ready=true;
  if(S.session) await loadAll(); else render();
  db.auth.onAuthStateChange(async (ev,session)=>{ const was=!!S.session; S.session=session; if(!session){ S.me=null; S.jobs=[]; render(); return; } if(!was){ S.err=''; await loadAll(); } });
  setInterval(()=>{ const ae=document.activeElement; if(S.session&&S.me&&!S.dialog&&!S.memo&&!S.rsn&&!(ae&&/INPUT|TEXTAREA/.test(ae.tagName))&&document.visibilityState==='visible') loadAll(); },60000);
})();
