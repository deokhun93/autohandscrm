<style>
:root{--ink:#0C1422;--paper:#F7F5F0;--card:#fff;--muted:#F1EEE6;--gold:#C9A44C;--gold-2:#E2C77F;--gold-soft:#F1E7CC;--gold-dark:#8A6D25;--blue:#1D3A6E;

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--f);font-size:14.5px;line-height:1.55;word-break:keep-all;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff}
.top .in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo .mark{width:34px;height:34px;border-radius:9px;background:var(--blue);display:grid;place-items:center}
.logo b{display:block;font-family:var(--f-en);font-weight:800;letter-spacing:.14em;font-size:15px;line-height:1.1}
.logo small{display:block;font-family:var(--f-en);font-size:9px;letter-spacing:.2em;color:var(--gold-2);font-weight:600}
.top a,.top button.tl{color:#D5DAE3;text-decoration:none;font-size:13.5px;font-weight:700;background:none;border:0;padding:6px 8px;display:inline-flex;gap:6px;align-items:center}
.tabs{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:58px;z-index:19}

.pres{position:relative;display:flex;align-items:center}.pres:empty{display:none}

.pres-pop{position:absolute;top:calc(100% + 8px);right:0;z-index:40;background:var(--card,#fff);color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:10px 12px;min-width:240px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.pres-row{display:flex;align-items:center;gap:8px}.pres-row .pav{margin-left:0;border-color:var(--card,#fff)}.pres-row small{color:var(--sub)}
.pres-tab{display:inline-flex}.pres-tab:empty{display:none}.pdot{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:800;color:#fff;margin-left:-4px;border:1.5px solid var(--card,#fff)}.pres-tab .pdot:first-child{margin-left:2px}.pdot.more{background:#5D6D7E;width:auto;padding:0 4px;border-radius:9px}
.tabs button.tab-set{margin-left:auto;color:var(--sub);font-size:15px;padding:12px 12px 10px;position:sticky;right:0;background:var(--card)}
.tabset{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow:auto}
.tabset li{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff}.tabset li.off{opacity:.55}
.tabs .cnt{font-size:11px;background:var(--gold);color:var(--ink);border-radius:999px;padding:0 7px;line-height:18px}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px;display:flex;flex-direction:column;gap:16px}
h1.h{font-size:22px;font-weight:900;letter-spacing:-.03em;margin:0}h2.h{font-size:16px;font-weight:700;margin:0}
.sub{color:var(--sub);font-size:13px;margin:0}.note{color:var(--sub);font-size:12.5px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}.grow{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:13px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-weight:700;font-size:13.5px}
.btn:hover{background:#1A2740}.btn:disabled{background:#E7E3D9;border-color:#E7E3D9;color:#9A9384;cursor:not-allowed}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--card);font-weight:700;font-size:13.5px}
.btn2:hover{background:var(--gold-soft)}.btn2.danger{color:var(--err);border-color:#E9C3B9}

.p-new{background:var(--gold);color:var(--ink)}.p-ok{background:var(--ok);color:var(--ok-ink)}.p-hold{background:var(--skip);color:#555}
.t-msg{background:var(--slate)}.p-urgent{background:#C62828;color:#fff}
.chip-red[aria-pressed="true"]{background:#C62828;border-color:#C62828;color:#fff}
.req-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.req-tools select{min-width:130px}.req-tools input{min-width:200px}.req-tools label.auto input{min-width:0;flex:0 0 auto}
.req .who{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.req .apt{font-weight:900;font-size:16px}
.req.is-sameday{border:2.5px solid #C62828!important}.p-sameday{background:#FCEAEA;color:#9B1C1C;border:1px solid #C62828}
.req.is-urgent{border-color:#E8A9A9;box-shadow:inset 4px 0 0 #C62828,var(--shadow)}
.req.is-done{background:#EEECE6;box-shadow:none}.req.is-done .msg,.req.is-done .who{text-decoration:line-through;text-decoration-color:#9A9384;color:#7C7768}.req.is-done .msg{background:#E4E1D8}
.flags{display:flex;gap:8px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px}
.flag{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 12px;border:1px solid var(--line-2);border-radius:10px;background:#fff;font-weight:700;cursor:pointer;user-select:none}
.flag input{width:19px;height:19px;margin:0;accent-color:var(--ink)}.flag input:disabled+span{color:#A8A396}
.flag.f-urgent input{accent-color:#C62828}.flag.f-urgent:has(input:checked){border-color:#C62828;background:#FCEAEA;color:#9B1C1C}
.flag:has(input:checked):not(.f-urgent){border-color:var(--ink);background:var(--gold-soft)}
.by{font-size:11.5px;font-weight:500;color:var(--sub)}
.memo{background:#FFF8E6;border:1px solid var(--gold-soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}.memo p{margin:0;white-space:pre-wrap}
.memo-edit{display:flex;flex-direction:column;gap:8px}.memo-add{align-self:flex-start}
.sch-card{margin-top:14px}.sch-row td{vertical-align:top}.sch-row .sch-st{font-size:11px}.sch-wait .sch-st{background:#FFF4E5;color:#B35C00}.sch-sent .sch-st{background:#E6F4EA;color:#1E7B34}.sch-fail .sch-st{background:#FDECEC;color:#C92A2A}.sch-cancel{opacity:.6}.sch-pick{flex-wrap:wrap}
.reply-box{background:#EAF2FB;border:1px solid #BFD3EE;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}.reply-box p{margin:0;white-space:pre-wrap}.reply-box b{font-size:12.5px;color:#1D3A6E}.reply-box.sch-reply{background:#FFF8EC;border-color:#F5C77E}.reply-box.sch-reply b{color:#8A4B00}
.reply-edit{display:flex;flex-direction:column;gap:8px;background:#F4F8FD;border:1px solid #BFD3EE;border-radius:10px;padding:10px}.reply-edit .chips{gap:6px}.reply-add{align-self:flex-start}
.selbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.btn.sm,.btn2.sm{min-height:36px;padding:0 12px;font-size:13px}.btn.danger{background:#7A2323;border-color:#7A2323}.btn.danger:hover{background:#5E1A1A}.btn.danger:disabled{background:#E7E3D9;border-color:#E7E3D9;color:#9A9384}
.sel{display:inline-grid;place-items:center;width:30px;height:30px;margin:-4px 0 -4px -4px;cursor:pointer}.sel input{width:19px;height:19px;margin:0;accent-color:#7A2323}
.req.is-sel{outline:2px solid #7A2323;outline-offset:-1px}
.chip-trash[aria-pressed="true"]{background:#7A2323;border-color:#7A2323;color:#fff}
.trash-note{margin:0;background:#F1EFE8;color:#6B6A63;border-radius:10px;padding:10px 12px;font-size:13px}
.p-days{background:#FAEEDA;color:#854F0B}.req.is-trash{background:#FBFAF7}
.cm-tbl td{white-space:nowrap}
/* 넓은 표: 화면 안에서 위아래 · 좌우로 움직이고, 제목 줄과 앞쪽 칸(차량)은 고정 */
.tbl.cm-tbl{max-height:calc(100vh - 170px);min-height:220px;overflow:auto;overscroll-behavior:contain}
.cm-tbl thead th{position:sticky;top:0;z-index:3;box-shadow:0 1px 0 var(--line)}
.cm-tbl .stk{position:sticky;z-index:2;background:var(--card)}.cm-tbl thead th.stk{z-index:4;background:var(--paper)}
.cm-tbl .stk-last{box-shadow:2px 0 0 var(--line)}
.cm-tbl tr.open>td.stk,.cm-tbl tr.picked>td.stk{background:var(--gold-soft)}.cm-tbl tr.grp-sub>td.stk{background:#F6F8FC}
.hs-bar{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin:0 0 -4px}.hs-bar .sub{font-size:11.5px;margin-right:auto}
.hs-bar button{all:unset;cursor:pointer;width:34px;height:30px;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;background:var(--card);font-weight:900;color:var(--text)}
.hs-bar button:disabled{opacity:.35;cursor:default}
@media (max-width:700px){.tbl.cm-tbl{max-height:calc(100vh - 210px)}}.cm-tbl tr.cm-row.open td{background:var(--gold-soft)}.nowrap{white-space:nowrap}
.memo-tog{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border:1px solid var(--line-2);border-radius:999px;background:#fff;font-weight:700;font-size:13px}
.memo-tog .chev{width:16px;height:16px;transition:transform .15s}.memo-tog[aria-expanded="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}.memo-tog[aria-expanded="true"] .chev{transform:rotate(180deg)}
.memo-tog .star{font-size:12px}
.cm-notes>td{background:#FBF8F0;padding:0 !important;white-space:normal}
.notes-box{position:sticky;left:0;width:min(760px,calc(100vw - 50px));padding:14px;display:flex;flex-direction:column;gap:12px}
.note-new{display:flex;flex-direction:column;gap:8px}.note-new textarea{width:100%;min-height:70px}
.flag.f-star:has(input:checked){border-color:var(--gold);background:var(--gold-soft)}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

.notes li.imp{border-color:var(--gold);background:#FFF8E6}.notes p{margin:0 0 2px;white-space:pre-wrap}
.star-btn{border:0;background:none;font-size:18px;line-height:1;padding:2px;color:#B9B3A3}
.note-open{border:0;background:none;text-align:left;padding:0;cursor:pointer;color:inherit}.note-open .nb{display:block;white-space:pre-wrap;margin:0 0 2px}.note-open:hover .nb{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px}
.dialog.note-modal{max-width:640px;max-height:calc(100vh - 40px);overflow:auto}.nm-text{width:100%;min-height:220px;font-size:15px;line-height:1.6;resize:vertical}
.cm-tbl th.ck,.cm-tbl td.ck{width:40px;text-align:center;padding-left:10px}.cm-tbl .ck input{width:18px;height:18px;margin:0;accent-color:var(--ink);vertical-align:middle}

.cm-row.is-pause td{background:#FFF4C2}.cm-row.is-soon td{background:#FDE2E0}
/* 2단계 상태 색: 정지 = 노란 음영 · 일시정지 = 연한 하늘색 · 해지 = 회색 */

.pill.st-stop{background:#F7D64A;color:#5A4500}.pill.st-pz{background:#8CCBF2;color:#0B3954}

.pz-reasons{display:flex;gap:6px;flex-wrap:wrap}
/* 아파트 여러 개 선택 상자 */
.apt-multi{position:relative}.apt-multi>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}.apt-multi>summary::-webkit-details-marker{display:none}

.apt-multi .am-pop label{justify-content:flex-start;width:100%;text-align:left}.apt-multi .am-pop input{flex:0 0 auto;min-width:0;width:17px;height:17px;margin:0;accent-color:var(--ink)}
.mtag.off-work{background:#E3F4EA;color:#1F5136}

.cm-row.picked td{box-shadow:inset 0 2px 0 var(--ink),inset 0 -2px 0 var(--ink)}
.pill.st-on{background:var(--ok);color:var(--ok-ink)}.pill.st-pause{background:#F7D64A;color:#5A4500}.pill.st-soon{background:#C62828;color:#fff}.pill.st-cancel{background:#9A9384;color:#fff}
.btn2:disabled{opacity:.45;cursor:not-allowed}
.btn2.st-pause{border-color:#E6C23A;background:#FFF4C2}.btn2.st-cancel{border-color:#B8B2A3;background:#ECEAE4}

.coll-tools{display:flex;gap:8px;flex-wrap:wrap}.file-btn{cursor:pointer}

            cmgr:{key:'cm_cols',name:'고객관리',cols:()=>CM_COLS},
            coll:{key:'coll_cols',name:'수금관리',cols:()=>CL_COLS},
            jobs:{key:'jobs_cols',name:'세차 일정',cols:()=>JB_COLS} };
const colLabel=(t,k)=>{ const c=TBL[t].cols().find(x=>x[0]===k); if(!c) return k; return typeof c[1]==='function'?c[1]():c[1]; };
const colName=(t,k)=>colLabel(t,k)||k;
function colNorm(t,v){ const C=TBL[t].cols(), K=C.map(c=>c[0]); v=v&&typeof v==='object'?v:{};
  const order=(Array.isArray(v.order)?v.order:[]).filter((k,i,a)=>K.includes(k)&&a.indexOf(k)===i);
  K.forEach(k=>{ if(!order.includes(k)){ const at=K.indexOf(k), prev=K.slice(0,at).reverse().find(x=>order.includes(x)); order.splice(prev?order.indexOf(prev)+1:0,0,k); } });
  const hidden=Array.isArray(v.hidden)?v.hidden.filter(k=>K.includes(k)):C.filter(c=>!c[3]).map(c=>c[0]);
  if(Array.isArray(v.known)) C.forEach(c=>{ if(!c[3]&&!v.known.includes(c[0])&&!hidden.includes(c[0])) hidden.push(c[0]); });   // 새로 생긴 추가 칸은 숨김으로
  return {order,hidden:hidden.length>=K.length?[]:hidden,known:[...K]}; }
const colsOn=t=>{ const P=(S.colPref||{})[t]||colNorm(t,null), C=TBL[t].cols();
  return P.order.filter(k=>!P.hidden.includes(k)).map(k=>C.find(c=>c[0]===k)).filter(c=>c&&(!c[4]||c[4]())); };
async function loadCols(t){ S.colPref=S.colPref||{}; if(S.colPref[t]) return; let v=null;
  try{ v=await q(db.rpc('get_my_ui_pref',{p_key:TBL[t].key})); S.colServer=true; }catch(_){ S.colServer=false; try{ v=JSON.parse(localStorage.getItem('ah-'+TBL[t].key)||'null'); }catch(__){} }
  S.colPref[t]=colNorm(t,v); }

    <input class="inp grow" id="rdQ" type="search" value="${esc(S.rdQ)}" placeholder="차량번호 · 고객 · 동호수 · 연락처 검색" aria-label="검색">

/* ---------- 탭: 실시간 세차 현황 (기간 합산 · 아파트별 · 담당자별 · 완료/미완료 목록) ---------- */
const pct=(a,b)=>b?Math.round(a*100/b):0;
const lFrom=()=>S.liveFrom||S.liveDay, lTo=()=>S.liveTo||S.liveDay;
function lPreset(k){ const t=new Date(), d=x=>keyOf(x); let f=d(t), to=d(t);
  if(k==='yday'){ const y=new Date(t); y.setDate(y.getDate()-1); f=to=d(y); }
  if(k==='week'){ const m=new Date(t); m.setDate(m.getDate()-((m.getDay()+6)%7)); f=d(m); }
  if(k==='month'){ f=d(new Date(t.getFullYear(),t.getMonth(),1)); }
  if(k==='lmonth'){ f=d(new Date(t.getFullYear(),t.getMonth()-1,1)); to=d(new Date(t.getFullYear(),t.getMonth(),0)); }
  return [f,to]; }
const LP=[['today','오늘'],['yday','어제'],['week','이번 주'],['month','이번 달'],['lmonth','지난 달']];
const ljIO=j=>j.interior&&j.sort_order>=900;
const ljExt=j=>j.status==='완료'?'done':j.status==='미작업'?'skip':'wait';
const ljInt=j=>j.interior_done?'done':(j.interior_skip||(ljIO(j)&&j.status==='미작업'))?'skip':'wait';
const ljApt=j=>((j.customers||{}).complex||'').trim()||'아파트 미입력';
const ljStaff=j=>j.staff_id||'', ljIStaff=j=>j.interior_staff_id||j.staff_id||'';
function lStat(jobs){ const ext=jobs.filter(j=>!ljIO(j)), int=jobs.filter(j=>j.interior);
  const c=(a,f)=>a.filter(f).length;
  return {total:ext.length,done:c(ext,j=>ljExt(j)==='done'),wait:c(ext,j=>ljExt(j)==='wait'),skip:c(ext,j=>ljExt(j)==='skip'),
    itotal:int.length,idone:c(int,j=>ljInt(j)==='done'),
    last:ext.map(j=>j.done_at).filter(Boolean).sort().pop()||null}; }

async function signPhotos(paths){
  const need=[...new Set(paths)].filter(p=>p&&!S.purl[p]); if(!need.length) return;
  try{ const {data}=await db.storage.from('field-photos').createSignedUrls(need,3600); (data||[]).forEach(d=>{ if(d.signedUrl) S.purl[d.path]=d.signedUrl; }); }catch(_){}
}

async function loadCarPhotos(ids){
  try{ const r=await q(db.rpc('list_car_photos',{p_customer_ids:ids})); S.cphoto={}; (r||[]).forEach(x=>S.cphoto[x.customer_id]=x); S.cphotoOk=true;
    const need=(r||[]).map(x=>x.path).filter(p=>p&&!S.purl['car:'+p]);
    if(need.length){ const {data}=await db.storage.from('car-photos').createSignedUrls(need,3600); (data||[]).forEach(d=>{ if(d.signedUrl) S.purl['car:'+d.path]=d.signedUrl; }); }
  }catch(_){ S.cphoto={}; S.cphotoOk=false; } }
async function shrinkImage(file){
  try{ const url=URL.createObjectURL(file); const img=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=url;});
    const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)), cv=document.createElement('canvas'); cv.width=Math.round(img.naturalWidth*k); cv.height=Math.round(img.naturalHeight*k);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(url); const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.8)); if(blob) return blob; }catch(_){}
  return file; }
async function uploadCarPhoto(cid,file){
  const blob=await shrinkImage(file), path=`${cid}/${S.me.id}-${Date.now()}.jpg`;
  const up=await db.storage.from('car-photos').upload(path,blob,{contentType:'image/jpeg',upsert:false}); if(up.error) throw up.error;
  let old; try{ old=await q(db.rpc('set_car_photo',{p_customer_id:cid,p_path:path})); }catch(e){ db.storage.from('car-photos').remove([path]).catch(()=>{}); throw e; }
  if(old) db.storage.from('car-photos').remove([old]).catch(()=>{});
  await loadCarPhotos(S.customers.map(c=>c.id)); }

const REPLY_QUICK=['네, 확인했어요.','요청하신 대로 처리할게요.','담당 직원에게 전달했어요.','일정 변경해 드렸어요.'];
function reqCard(r){
  let act='';
  if(r.status==='접수'||r.status==='보류'){
    if(r.req_type==='interior') act=`<button class="link" data-act="req" data-id="${r.id}" data-a="hold">보류</button><button class="btn" data-act="req" data-id="${r.id}" data-a="approve">${ic('check')}승인</button>`;
    if(r.req_type==='schedule') act=/^\[당일 변경 · 미정\]/.test(r.message||'')?`<span class="note">오늘 세차는 빠졌어요. 다시 시작할 날은 [회차 현황] 달력에서 넣고 [완료]를 체크해 주세요.</span>`
      :`<button class="link" data-act="req" data-id="${r.id}" data-a="hold">보류</button><button class="btn" data-act="req" data-id="${r.id}" data-a="approve">${ic('check')}일정 적용</button>`;
  }
  const where=[r.complex,r.unit].filter(Boolean).join(' ')||'아파트 미입력';
  const editing=S.memoEdit===r.id;
  const memo=editing
    ?`<div class="memo-edit"><textarea class="inp" id="memo-${r.id}" maxlength="1000" placeholder="조치 내용, 통화 내용 등 내부 메모 (고객에게 안 보여요)">${esc(r.staff_memo||'')}</textarea><div class="row"><span class="grow"></span><button class="link" data-act="memoCancel">취소</button><button class="btn" data-act="memoSave" data-id="${r.id}">메모 저장</button></div></div>`
    :r.staff_memo?`<div class="memo"><p>${esc(r.staff_memo)}</p><div class="row">${byName(r.memo_name,r.memo_at)}<span class="grow"></span><button class="link" data-act="memoEdit" data-id="${r.id}">메모 수정</button></div></div>`
    :`<button class="link memo-add" data-act="memoEdit" data-id="${r.id}">+ 메모 쓰기</button>`;
  // 고객에게 답변 (4번) — 고객 앱 메시지 아래에 보이고 알림이 가요
  const rEdit=S.replyEdit===r.id, rSch=schedPending().find(x=>x.kind==='reply'&&x.request_id===r.id);
  const schBox=rSch&&!rEdit?`<div class="reply-box sch-reply"><b>⏰ 예약한 답변 · ${esc(kdt(rSch.send_at))}에 보내요</b><p>${esc(rSch.body)}</p><div class="row"><span class="sub">예약: ${esc(rSch.created_name||'')}</span><span class="grow"></span><button class="link" data-act="replyEdit" data-id="${r.id}">고치기</button><button class="link" data-act="schCancel" data-id="${rSch.id}">예약 취소</button></div></div>`:'';
  const reply=rEdit
    ?`<div class="reply-edit"><b class="sub" style="color:var(--text)">💬 고객에게 답변</b><div class="chips">${REPLY_QUICK.map(x=>`<button type="button" class="chip" data-act="replyQuick" data-id="${r.id}" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>
      <textarea class="inp" id="reply-${r.id}" maxlength="1000" placeholder="고객 앱에 보이는 답변이에요. 예: 네, 확인했어요. 내일 세차할 때 트렁크는 열지 않을게요.">${esc(S.replyDraft!==undefined?S.replyDraft:(rSch?rSch.body:(r.reply||'')))}</textarea>
      <div class="row sch-pick" style="gap:6px"><label class="sub" for="replyAt-${r.id}">⏰ 예약 시간</label><input class="inp" type="datetime-local" id="replyAt-${r.id}" value="${esc(rSch?dtLocal(new Date(rSch.send_at)):schedDefault())}" min="${dtLocal(new Date())}" style="width:auto"><button class="btn2 sm" data-act="replySched" data-id="${r.id}">${rSch?'예약 고치기':'예약 보내기'}</button></div>
      <div class="row"><span class="grow note">보내면 고객 앱에 '매니저 답변이 왔어요' 알림이 가요.</span><button class="link" data-act="replyCancel">취소</button><button class="btn" data-act="replySend" data-id="${r.id}">${r.reply?'고친 답변 보내기':'답변 보내기'}</button></div></div>`
    :schBox?schBox+(r.reply?`<div class="reply-box"><b>💬 고객에게 보낸 답변</b><p>${esc(r.reply)}</p><div class="row">${byName(r.reply_name,r.reply_at)}</div></div>`:'')
    :r.reply?`<div class="reply-box"><b>💬 고객에게 보낸 답변</b><p>${esc(r.reply)}</p><div class="row">${byName(r.reply_name,r.reply_at)}<span class="grow"></span><button class="link" data-act="replyEdit" data-id="${r.id}">답변 고치기</button></div></div>`
    :`<button class="btn2 sm reply-add" data-act="replyEdit" data-id="${r.id}">💬 고객에게 답변 보내기</button>`;
  const sd=/^\[당일 변경/.test(r.message||''), sdOw=sd?ownersOf(r.complex):[];
  return `<article class="card req${r.urgent?' is-urgent':''}${sd?' is-sameday':''}${r.done_at?' is-done':''}${S.sel.includes(r.id)?' is-sel':''}">
    <div class="row"><label class="sel"><input type="checkbox" data-rsel="${r.id}" ${S.sel.includes(r.id)?'checked':''} aria-label="선택 (휴지통으로 보낼 요청)"></label><span class="pill t-${r.req_type}">${RT[r.req_type]||r.req_type}</span>${r.urgent?'<span class="pill p-urgent">긴급</span>':''}${sd?`<span class="pill p-sameday">📅 당일날짜 변경신청${/미정\]/.test(r.message)?' · 미정':''}</span>${sdOw.length?`<span class="sub">담당 총무 <b>${esc(sdOw.join(', '))}</b></span>`:''}`:''}${r.done_at?'<span class="pill p-ok">완료</span>':''}<span class="grow"></span><span class="sub" title="고객 앱에 보이는 상태">고객 화면: ${statusPill(r.status,r.req_type)}</span></div>
    <div class="who"><span class="apt">${esc(where)}</span><span class="car">${esc(r.car_number||'-')}</span></div>
    <p class="sub" style="margin-top:-6px">${esc(r.customer_name||'')}${r.car_model?' · '+esc(r.car_model):''}${r.wash_plan?' · 월 '+r.wash_plan+'회':''}</p>
    ${phoneLine(r.phone,'r'+r.id)}
    <p class="text msg">${esc(r.message)}</p>
    ${act?`<div class="row"><span class="grow sub">신청 처리</span>${act}</div>`:''}
    <div class="flags">
      <label class="flag f-urgent"><input type="checkbox" data-rflag="urgent" data-id="${r.id}" ${r.urgent?'checked':''} ${r.done_at?'disabled':''}><span>긴급</span></label>
      <label class="flag"><input type="checkbox" data-rflag="check" data-id="${r.id}" ${r.checked_at?'checked':''} ${r.done_at?'disabled':''}><span>확인</span>${r.checked_at?byName(r.checked_name,r.checked_at):''}</label>
      <label class="flag"><input type="checkbox" data-rflag="done" data-id="${r.id}" ${r.done_at?'checked':''}><span>완료</span>${r.done_at?byName(r.done_name,r.done_at):''}</label>
    </div>
    ${reply}
    ${memo}
    <div class="row"><span class="sub grow">접수 ${when(r.created_at)}</span></div></article>`;
}

function prRange(){

  if(pr.mode==='month'){ const a=new Date(now.getFullYear(),now.getMonth()+pr.off,1); return {from:keyOf(a),to:keyOf(new Date(a.getFullYear(),a.getMonth()+1,0))}; }

  const endM=now.getDate()<=P?now.getMonth():now.getMonth()+1;

function payHint(need,amt){ if(!amt) return '받은 금액을 적어 주세요.'; if(amt<need) return `<b style="color:var(--red)">${won0(need-amt)}</b>이 미수로 남아요. (수금완료가 아니라 '일부 입금'으로 표시)`; if(amt>need) return `청구보다 ${won0(amt-need)} 더 받았어요. 마지막 달에 초과 입금으로 기록돼요.`; return '청구 금액과 같아요. 수금완료로 처리돼요.'; }
async function payRun(mid){
  const picks=payPicked(mid), amt=Number(String(S.payAmt).replace(/[^0-9]/g,''))||0;
  if(!picks.length){ toast('입금할 달을 체크해 주세요.',true); return; } if(amt<=0){ toast('받은 금액을 적어 주세요.',true); return; }
  if(NOTE_KINDS.includes(S.payMethod)&&!String(S.payNote||'').trim()){ toast(`${ML(S.payMethod)}은(는) 메모에 사유를 꼭 적어 주세요.`,true); throw Object.assign(new Error('keep'),{keep:true}); }
  let left=amt, n=0;
  for(let i=0;i<picks.length&&left>0;i++){ const b=picks[i], last=i===picks.length-1, put=last?left:Math.min(left,b.remaining); if(put<=0) continue;
    await q(db.rpc('pay_collection_bill_amount',{p_bill_id:b.id,p_amount:put,p_paid_at:S.payDate||keyOf(new Date()),p_note:S.payNote||'',...payArgs()})); left-=put; n++; }

}

function hsEnhance(){
  document.querySelectorAll('.tbl.cm-tbl').forEach(el=>{
    const tb=el.querySelector('table'); if(!tb) return;
    // 앞쪽 칸 고정: 넓은 화면은 체크 · 아파트 · 동호수 · 차량번호, 좁은 화면은 체크 · 차량번호만
    const heads=[...tb.querySelectorAll('thead th')], names=heads.map(h=>h.textContent.trim());
    const want=window.innerWidth<700?['','차량번호']:['','아파트','동·호수','차종','차량번호'];
    let idx=want.map(w=>names.indexOf(w)).filter(i=>i>=0).sort((a,b)=>a-b);
    if(window.innerWidth>=700){ const k=[]; for(const i of idx){ if(i===k.length) k.push(i); else break; } idx=k; }   // 넓은 화면: 맨 앞에 붙어 있는 칸만 고정 (칸 순서를 바꿔도 겹치지 않게)
    let left=0; const lefts=[];
    idx.forEach(i=>{ lefts.push([i,left]); left+=heads[i].getBoundingClientRect().width; });
    if(left>el.clientWidth*0.6) lefts.length=Math.max(1,lefts.length-2);
    tb.querySelectorAll('tr').forEach(tr=>{ const cells=tr.children; if(cells.length<heads.length) return;
      lefts.forEach(([i,l],k)=>{ const c=cells[i]; if(!c) return; c.classList.add('stk'); c.style.left=l+'px'; c.classList.toggle('stk-last',k===lefts.length-1); }); });
    // ◀ ▶ 버튼 (표 바로 위)
    if(!(el.previousElementSibling&&el.previousElementSibling.classList.contains('hs-bar'))){
      const bar=document.createElement('div'); bar.className='hs-bar';
      bar.innerHTML='<span class="sub">표가 넓어요 · ◀ ▶ 버튼이나 Shift+마우스 휠로 좌우 이동</span><button type="button" data-hs="-1" aria-label="왼쪽으로">◀</button><button type="button" data-hs="1" aria-label="오른쪽으로">▶</button>';
      el.parentNode.insertBefore(bar,el);
    }
    const p=HS.pos[hsKey(el)]; if(p){ el.scrollLeft=p.l; el.scrollTop=p.t; }
    const upd=()=>{ const bar=el.previousElementSibling; if(!bar||!bar.classList.contains('hs-bar')) return; const max=el.scrollWidth-el.clientWidth;
      bar.style.display=max>4?'':'none'; const [a,b]=bar.querySelectorAll('button'); a.disabled=el.scrollLeft<=2; b.disabled=el.scrollLeft>=max-2; };
    if(!el._hs){ el._hs=1; el.addEventListener('scroll',()=>{ HS.pos[hsKey(el)]={l:el.scrollLeft,t:el.scrollTop}; upd(); },{passive:true}); }
    upd();
  });
}

  if(t.dataset.jstaff){ const id=Number(t.dataset.jstaff), part=t.dataset.part||'ext';
    if(S.jobs53) await act(()=>q(db.rpc('admin_set_job',{p_job_id:id,p_data:part==='int'?{interior_staff_id:t.value||''}:{staff_id:t.value||''}})),part==='int'?'실내세차 직원을 바꿨어요.':'외부세차 직원을 바꿨어요.');
    else await act(()=>q(db.from('wash_jobs').update({staff_id:t.value||null}).eq('id',id)),'담당 직원을 바꿨어요.');
    return; }
  if(t.dataset.jkind){ await act(()=>q(db.rpc('admin_set_job',{p_job_id:Number(t.dataset.jkind),p_data:{kind:t.value}})),'세차 종류를 바꿨어요.'); return; }
  if(t.dataset.jst){ const id=Number(t.dataset.jst), part=t.dataset.part, v=t.value, j=S.jobs.find(x=>x.id===id)||{}, c=j.customers||{};
    const run=(reason)=>act(()=>q(db.rpc('admin_set_job',{p_job_id:id,p_data:part==='ext'?{ext_state:v,ext_reason:reason||''}:{int_state:v,int_reason:reason||''}})),`${part==='ext'?'외부':'실내'} 상태를 '${v}'(으)로 바꿨어요.`);
    if(v!=='미완료'){ await run(''); return; }
    S.rsn={v:'',etc:''};
    ask(`${part==='ext'?'외부세차':'실내세차'} 미완료 사유 · ${c.car_number||''}`,'사유를 골라 주세요. 기타를 고르면 직접 적을 수 있어요.','미완료로 저장',async()=>{
      const r=S.rsn||{}, reason=r.v==='기타'?String(r.etc||'').trim():r.v;
      if(!reason){ toast(r.v==='기타'?'기타 사유를 적어 주세요.':'사유를 골라 주세요.',true); S.busy=false; render(); return; }
      await run(r.v==='기타'?'기타: '+reason:reason); },rsnHtml());
    S.dialog.rebuild=rsnHtml; S.dialog.onClose=()=>render(); return; }
  if(t.dataset.jfK){ const f=jfLoad(), k=t.dataset.jfK, v=t.dataset.jfV; f[k]=t.checked?[...new Set([...f[k],v])]:f[k].filter(x=>x!==v); jfSave(); render(); return; }
  if(t.dataset.jint){ await act(()=>q(db.from('wash_jobs').update({interior:t.checked}).eq('id',Number(t.dataset.jint))),null); return; }
  if(t.dataset.nsel){ const id=Number(t.dataset.nsel); S.noticeSel=t.checked?[...new Set([...S.noticeSel,id])]:S.noticeSel.filter(x=>x!==id); render(); }
});
document.addEventListener('input',e=>{ if(/^reply-\d+$/.test(e.target.id)){ S.replyDraft=e.target.value; return; } if(e.target.dataset&&e.target.dataset.svf==='reason'&&S.rdc&&S.rdc.sv){ S.rdc.sv.reason=e.target.value; return; } if(e.target.id==='rsnEtc'&&S.rsn){ S.rsn.etc=e.target.value; return; } if(e.target.id==='mvDate'&&S.mv){ S.mv.date=e.target.value; return; } if(e.target.dataset&&e.target.dataset.rcwhyetc&&S.rdc){ S.rdc.rs[e.target.dataset.rcwhyetc]=e.target.value.trim(); return; }
  if(e.target.dataset&&(e.target.dataset.pz==='memo'||e.target.dataset.pz==='date')&&S.pz){ S.pz[e.target.dataset.pz]=e.target.value; return; }
  if(e.target.dataset&&e.target.dataset.ipc){ const k=e.target.dataset.ipc; S.ipDraft=S.ipDraft||{}; const r=(S.iprices||[]).find(x=>x.car_class===k)||{}; const v=e.target.value.trim(); if(String(r.price)===v.replace(/\D/g,'')&&v!=='') delete S.ipDraft[k]; else S.ipDraft[k]=v; const b=document.querySelector('[data-act=ipSave]'); if(b) b.disabled=!Object.keys(S.ipDraft).length; return; }
  if(/^nt(Title|Body)$/.test(e.target.id)){ ntRead(); return; }
  if(/^td(Title|Memo)$/.test(e.target.id)){ tdRead(); return; }
  if(e.target.id==='add-q'){ S.addQ=e.target.value; S.addCid=null; const h=$('#add-cust'); if(h) h.value=''; const r=$('#add-res'); if(r) r.innerHTML=addResHtml(); return; }
  if(e.target.id==='rdQ'){ S.rdQ=e.target.value; const pos=e.target.selectionStart; render(); const el=$('#rdQ'); if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(_){} } return; }
  if(e.target.id==='rdTplIn'){ S.rdTplDraft=e.target.value; const pv=$('#rdPrev'); const r=(S.rounds||[]).find(x=>x.customer_id===S.rdSel[0]); if(pv&&r) pv.textContent=rdFill(S.rdTplDraft,r); if(S.dialog&&S.rdRows) S.dialog.extra=rdNoticeExtra(S.rdRows); return; }
  if(e.target.id==='rdTitle'){ S.rdTitle=e.target.value; return; }
  if(e.target.id==='rdAcc'){ S.rdAcc=Number(e.target.value)||null; const pv=$('#rdPrev'); const r=(S.rdRows||[])[0]; if(pv&&r) pv.textContent=rdFill(S.rdTplDraft,r); return; }
  if(e.target.id&&e.target.id.startsWith('frr-')){ S.frReply[Number(e.target.id.slice(4))]=e.target.value; return; }

  if(e.target.id==='reqQ'){ S.reqQ=e.target.value; }
  if(e.target.id==='cmQ'){ S.cmQin=e.target.value; }
  if(e.target.id==='nm-body'){ S.nmBody=e.target.value; }
  if(e.target.id==='resQ'){ S.resQ=e.target.value; if(S.dialog){ S.dialog.extra=resAddHtml(); render(); const el=$('#resQ'); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } } }
  if(e.target.id==='collQ'){ S.collQin=e.target.value; }
  if(e.target.dataset&&e.target.dataset.cf&&S.cform){ S.cform[e.target.dataset.cf]=e.target.value; }
  if(e.target.dataset&&e.target.dataset.cu&&S.cuform){ S.cuform[e.target.dataset.cu]=e.target.value; }
  if(e.target.id==='payDate'){ S.payDate=e.target.value; }
  if(e.target.id==='payAmt'){ S.payAmt=e.target.value; S.payAmtTouched=true; const picks=payPicked(S.payMid), need=picks.reduce((a,b)=>a+b.remaining,0), h=$('#payHint'); if(h) h.innerHTML=payHint(need,Number(String(S.payAmt).replace(/[^0-9]/g,''))||0); if(S.dialog) S.dialog.extra=payExtra(S.payMid); return; }
  if(e.target.id==='payNote'){ S.payNote=e.target.value; if(S.dialog) S.dialog.extra=payExtra(S.payMid); return; }
  if(e.target.id==='payNote2'){ S.payNote=e.target.value; return; }
  if(e.target.id==='adjVal'){ S.adjVal=e.target.value; return; }
  if(e.target.id==='adjNote'){ S.adjNote=e.target.value; return; }
  if(e.target.id&&e.target.id.startsWith('cnote-')){ S.cnDraft[Number(e.target.id.slice(6))]=e.target.value; }
  if(e.target.id==='pauseDate'){ S.pauseDate=e.target.value; }
  if(e.target.id&&e.target.id.startsWith('note-')){ S.noteDraft[Number(e.target.id.slice(5))]=e.target.value; }
  if(e.target.id==='ntAt'){ S.ntAt=e.target.value; return; }
  if(e.target.id==='ntQ'){ S.ntQ=e.target.value; const L=ntList(), tb=$('#ntTbl'), cn=$('#ntCnt'); if(tb) tb.innerHTML=ntRows(L); if(cn) cn.textContent=`목록 ${L.length}명`; return; }
  if(e.target.id==='notice'){ S.notice=e.target.value; const b=$('#nsend'); if(b) b.disabled=!(S.noticeSel.length&&S.notice.trim()); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.target.id==='tdTitle'||e.target.id==='tdMemo')&&!e.isComposing){ e.preventDefault(); tdSave(); return; } if(e.key==='Escape'&&S.dialog&&!S.busy){S.dialog=null;render();} else if(e.key==='Escape'&&S.noteModal&&!S.busy){S.noteModal=null;render();} });
document.addEventListener('submit',async e=>{
  if(e.target.id==='rdsearch'){ e.preventDefault(); return; }
  if(e.target.id==='collsearch'){ e.preventDefault(); S.collQin=($('#collQ')||{}).value||''; S.collQ=S.collQin.trim(); render(); return; }
  if(e.target.id==='cmsearch'){ e.preventDefault(); S.cmQin=($('#cmQ')||{}).value||''; S.cmQ=S.cmQin.trim(); render(); return; }
  if(e.target.id==='reqsearch'){ e.preventDefault(); S.reqQ=($('#reqQ')||{}).value||''; await loadTab(); return; }
  if(e.target.id!=='login') return; e.preventDefault();
  const em=$('#em').value.trim(), pw=$('#pw').value;
  if(!em||!pw){ S.err='이메일과 비밀번호를 입력해 주세요.'; render(); return; }
  const autoOn=!!($('#auto')||{}).checked; staffSetAuto(autoOn);
  S.busy=true; S.err=''; render(); $('#em').value=em; if($('#auto')) $('#auto').checked=autoOn;
  const {error}=await db.auth.signInWithPassword({email:em,password:pw});
  S.busy=false; if(error){ S.err=friendly(error); render(); $('#em').value=em; }
});
async function start(){
  try{ const ok=await loadBase(); if(ok){ presStart(); await loadTabPref(); setTab(S.tab); if(window.StaffNotice) StaffNotice.reload(); await refreshCounts(); await loadTab(); return; } }catch(e){ S.err=friendly(e); }
  render();
}
(async function boot(){
  if(!db){ S.ready=true; render(); return; }
  let {data}=await db.auth.getSession();
  // 자동 로그인을 끈 경우: 앱(브라우저)을 완전히 닫았다 열면 로그아웃
  const alive=staffAlive();
  if(data.session && !staffGetAuto() && !alive){ await db.auth.signOut({scope:'local'}); data={session:null}; }
  try{ sessionStorage.setItem(STAFF_ALIVE_KEY,'1'); }catch(_){}
  staffStartBeat();
  S.session=data.session; S.ready=true;
  // 앱을 새로 열면 '오늘(공지·할 일)'부터 보여줘요. 링크(#탭)로 들어오거나 새로고침하면 그 탭 그대로예요.
  { const h=(location.hash||'').slice(1);
    if(h==='cust'){ S.tab='cmgr'; S.cmMode='set'; S.fromHash=true; } else if(TAB_KEYS.includes(h)){ S.tab=h; S.fromHash=true; } else S.tab='today'; }
  // 주소 끝(#cmgr 등)만 바꿔도 그 메뉴로 이동
  window.addEventListener('hashchange',async()=>{ const h=(location.hash||'').slice(1); if((TAB_KEYS.includes(h)||h==='cust')&&h!==S.tab&&S.me){ setTab(h); render(); await loadTab(); } });
  if(S.session) await start(); else render();
  // 실시간 세차 현황 · 현장전달: 30초마다 자동 새로고침 (입력 중이거나 창이 숨겨져 있으면 건너뜀)
  let tick=0;
  setInterval(async()=>{
    if(!S.session||!S.me||S.dialog||S.pview||S.busy||document.visibilityState!=='visible') return;
    const ae=document.activeElement; if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&ae.type!=='checkbox') return;
    tick++;
    if(S.tab==='live'||S.tab==='field') await loadTab();
    else if(tick%2===0){ const a=S.cntReq,b=S.cntAcc,c=S.cntFieldAll; await refreshCounts(); if(a!==S.cntReq||b!==S.cntAcc||c!==S.cntFieldAll) render(); }
  },30000);
  // 예약 메시지: 1분마다 보낼 시간이 된 것을 보내요 (창이 숨겨져 있어도)
  setInterval(runDue,60000); setTimeout(runDue,5000);
  window.addEventListener('myinfo:saved',e=>{ if(S.me&&e.detail&&e.detail.name){ S.me.name=e.detail.name; render(); } });  // 내 정보 수정 후 이름 바로 반영
  db.auth.onAuthStateChange(async (ev,session)=>{ const was=!!S.session; S.session=session; if(!session){ presStop(); S.me=null; render(); return; } if(!was){ S.err=''; await start(); } });
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}</script>
