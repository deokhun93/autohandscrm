<style>

.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px;display:flex;flex-direction:column;gap:16px}

.p-days{background:#FAEEDA;color:#854F0B}.req.is-trash{background:#FBFAF7}
.cm-tbl td{white-space:nowrap}

function liveSum(rows){ const z={total:0,done:0,waiting:0,skipped:0,ext_total:0,ext_done:0,int_total:0,int_done:0,report_count:0}; rows.forEach(r=>Object.keys(z).forEach(k=>z[k]+=r[k]||0)); return z; }
function liveView(){

    ${S.fmgr.length?`<div class="tbl"><table><thead><tr><th>현장직원</th><th>담당 관리자</th></tr></thead><tbody>${S.fmgr.map(m=>`<tr><td><b>${esc(m.staff_name||'')}</b></td><td><select data-fmgr="${m.staff_id}" aria-label="${esc(m.staff_name||'')} 담당 관리자"><option value="">관리자 전체</option>${admins.map(a=>`<option value="${a.id}" ${a.id===m.manager_id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`:'<p class="sub">승인된 현장직원(field) 계정이 없어요.</p>'}</details>`;
  if(!rows) return head+'<div class="empty">불러오는 중...</div>'+mgr;
  return head+(rows.length?`<div class="fr-list">${rows.map(r=>{const sel=S.frSel.includes(r.id), ph=r.photos||[];
    return `<article class="fr ${r.done_at?'done':!r.read_at?'new':''}${sel?' picked':''}"><input type="checkbox" data-frsel="${r.id}" ${sel?'checked':''} aria-label="선택" style="margin-top:4px">
      <div class="bd"><div class="row" style="gap:8px;flex-wrap:wrap"><b class="car" style="font-size:15px">${esc(r.car_number||'-')}</b>${r.interior?'<span class="pill p-new">실내 포함</span>':''}<span class="sub">${esc([r.complex,r.unit].filter(Boolean).join(' '))}${r.car_model?' · '+esc(r.car_model):''}${r.customer_name?' · '+esc(r.customer_name):''}</span><span class="grow"></span>
        ${r.done_at?'<span class="pill p-ok">처리완료</span>':r.read_at?'<span class="pill p-hold">확인함</span>':'<span class="pill p-new">새 메모</span>'}</div>
        <span class="sub">${kdate(r.wash_date)} · <b style="color:var(--text)">${esc(r.staff_name||'')}</b> → ${esc(r.manager_name||'관리자 전체')} · ${when(r.created_at)}${r.job_status?` · 세차 ${esc(r.job_status)}`:''}</span>
        ${r.body?`<p class="body">${esc(r.body)}</p>${/[A-Za-z]{3}/.test(r.body)&&!/[가-힣]/.test(r.body)?`<a class="tr-btn" href="https://papago.naver.com/?sk=auto&tk=ko&st=${encodeURIComponent(r.body.slice(0,1500))}" target="_blank" rel="noopener">🌐 한국어로 번역 (파파고)</a>`:''}`:''}
        ${ph.length?`<div class="fr-ph">${ph.map((p,i)=>`<button data-act="pvOpen" data-id="${r.id}" data-i="${i}" aria-label="사진 ${i+1} 크게 보기">${S.purl[p]?`<img src="${S.purl[p]}" alt="" loading="lazy">`:'📷'}</button>`).join('')}</div>`:''}
        <div class="reply"><input class="inp" id="frr-${r.id}" maxlength="500" placeholder="처리 메모 (직원웹에 보여요 · 외국인 직원은 English 화면에서 번역 버튼으로 봐요) 예: 고객 통화 완료" value="${esc(S.frReply[r.id]!==undefined?S.frReply[r.id]:(r.reply||''))}"><button class="btn2 sm" data-act="frReply" data-id="${r.id}">저장</button></div>
        <div class="row" style="gap:8px;flex-wrap:wrap"><span class="sub">${r.read_at?`확인 ${esc(r.read_name||'')} ${when(r.read_at)}`:''}${r.done_at?` · 처리완료 ${esc(r.done_name||'')} ${when(r.done_at)}`:''}</span><span class="grow"></span>
          ${r.read_at?'':`<button class="btn2 sm" data-act="frFlag" data-f="read" data-on="1" data-id="${r.id}">확인함</button>`}
          ${r.done_at?`<button class="link" data-act="frFlag" data-f="done" data-on="0" data-id="${r.id}">처리완료 취소</button>`:`<button class="btn sm" data-act="frFlag" data-f="done" data-on="1" data-id="${r.id}">처리완료</button>`}</div></div></article>`;}).join('')}</div>`
    :`<div class="empty">${S.frState==='done'?'처리완료된 메모가 없어요.':S.frState==='new'?'확인 안 한 메모가 없어요.':'현장전달 메모가 없어요.'}<br><span class="note">현장직원이 직원웹 배정 차량의 [📝 특이사항 메모]로 보내면 여기에 모여요.</span></div>`)+mgr;
}

/* ---------- 탭: 고객 요청 ---------- */
const byName=(name,ts)=>name||ts?`<small class="by">${esc(name||'')}${ts?' · '+when(ts):''}</small>`:'';
function reqView(){
  const TY={all:()=>true,msg:r=>r.req_type==='msg',interior:r=>r.req_type==='interior',schedule:r=>r.req_type==='schedule'};
  const list=S.reqs.filter(TY[S.reqType]||TY.all);
  const apts=[...new Set([...complexes(),...S.reqs.map(r=>r.complex)].filter(Boolean))].sort((x,y)=>x.localeCompare(y,'ko'));
  const nUrgent=S.reqs.filter(r=>r.urgent&&!r.done_at).length;
  return `<div class="row"><div class="grow"><h1 class="h">고객 요청</h1><p class="sub">고객 앱에서 들어온 메시지 · 실내세차 신청 · 일정 변경요청 — 긴급 표시, 확인·메모, 완료 체크</p></div></div>
  <div class="chips">${[['open','진행 중'],['urgent','긴급'],['done','완료'],['all','전체'],['trash','🗑 휴지통']].map(([k,l])=>`<button class="chip${k==='urgent'?' chip-red':''}${k==='trash'?' chip-trash':''}" aria-pressed="${S.reqF===k}" data-act="reqF" data-f="${k}">${l}${k==='open'&&S.cntReq?` <b>${S.cntReq}</b>`:''}${k==='trash'&&S.cntTrash?` <b>${S.cntTrash}</b>`:''}</button>`).join('')}</div>
  ${S.reqF==='trash'?trashView():reqListView(list,apts,nUrgent)}`;
}
function selBar(ids,isTrash){
  const n=S.sel.length, all=ids.length&&ids.every(x=>S.sel.includes(x));
  return `<div class="selbar"><button class="btn2 sm" data-act="selAll" data-ids="${ids.join(',')}">${all?'선택 해제':'현재 목록 전체 선택'}</button>${n?`<button class="link" data-act="selNone">선택 해제</button><b class="sub" style="color:var(--text)">${n}건 선택됨</b>`:''}<span class="grow"></span>
    ${isTrash?`<button class="btn2 sm" data-act="trRestore" ${n?'':'disabled'}>모두 복원</button><button class="btn sm danger" data-act="trPurge" ${n?'':'disabled'}>선택 항목 완전삭제</button>`
      :`<button class="btn sm danger" data-act="reqTrash" ${n?'':'disabled'}>🗑 전체삭제${n?` (${n}건)`:''}</button>`}</div>`;
}
function trashView(){
  const list=S.trash;
  return `<p class="trash-note">휴지통에 있는 메시지는 휴지통으로 이동한 날로부터 30일이 지나면 자동으로 완전히 삭제됩니다. 그 전에는 복원할 수 있어요.</p>
  ${list.length?selBar(list.map(r=>r.id),true)+`<div class="grid">${list.map(r=>`<article class="card req is-trash${S.sel.includes(r.id)?' is-sel':''}">
    <div class="row"><label class="sel"><input type="checkbox" data-rsel="${r.id}" ${S.sel.includes(r.id)?'checked':''} aria-label="선택"></label><span class="pill t-${r.req_type}">${RT[r.req_type]||r.req_type}</span><span class="grow"></span><span class="pill p-days">${r.days_left}일 후 완전삭제</span></div>
    <div class="who"><span class="apt">${esc([r.complex,r.unit].filter(Boolean).join(' ')||'아파트 미입력')}</span><span class="car">${esc(r.car_number||'-')}</span></div>
    <p class="sub" style="margin-top:-6px">${esc(r.customer_name||'')}</p>
    <p class="text msg">${esc(r.message)}</p>
    <p class="sub">접수 ${when(r.created_at)} · 삭제 ${when(r.deleted_at)}${r.deleted_name?' ('+esc(r.deleted_name)+')':''}</p>
    <div class="row"><button class="btn2 grow" data-act="trRestoreOne" data-id="${r.id}">복원</button><button class="btn2 danger grow" data-act="trPurgeOne" data-id="${r.id}">지금 완전삭제</button></div></article>`).join('')}</div>`
  :`<div class="empty">휴지통이 비어 있어요.</div>`}`;
}
function reqListView(list,apts,nUrgent){
  return `  <form id="reqsearch" class="req-tools" role="search">
    <select class="inp" id="reqApt" aria-label="아파트별 보기"><option value="">아파트 전체</option>${apts.map(a=>`<option ${S.reqApt===a?'selected':''}>${esc(a)}</option>`).join('')}</select>
    <select class="inp" id="reqType" aria-label="요청 종류"><option value="all">종류 전체</option>${Object.entries(RT).map(([k,l])=>`<option value="${k}" ${S.reqType===k?'selected':''}>${l}</option>`).join('')}</select>
    <input class="inp grow" id="reqQ" type="search" value="${esc(S.reqQ)}" placeholder="차량번호 · 이름 · 동호수 · 내용 · 메모 검색" aria-label="검색">
    <button class="btn2" type="submit">${ic('check',14)}검색</button>${S.reqQ||S.reqApt?`<button class="link" type="button" data-act="reqClear">초기화</button>`:''}
  </form>
  <p class="note">${S.reqF==='open'?'완료 체크 전인 요청이에요. 긴급 건이 맨 위에 와요.':S.reqF==='urgent'?'완료 전 긴급 건이에요.':S.reqF==='done'?'완료한 요청이에요. 검색으로 지난 내역을 찾을 수 있어요.':'모든 요청이에요.'} · ${list.length}건${nUrgent&&S.reqF!=='urgent'?` · <b style="color:var(--red)">긴급 ${nUrgent}건</b>`:''}</p>
  ${list.length?selBar(list.map(r=>r.id),false)+`<div class="grid">${list.map(reqCard).join('')}</div>`
  :`<div class="empty">${S.reqQ||S.reqApt?'조건에 맞는 요청이 없어요.':'표시할 요청이 없어요.'}</div>`}`;
}
function reqCard(r){
  let act='';
  if(r.status==='접수'||r.status==='보류'){
    if(r.req_type==='interior') act=`<button class="link" data-act="req" data-id="${r.id}" data-a="hold">보류</button><button class="btn" data-act="req" data-id="${r.id}" data-a="approve">${ic('check')}승인</button>`;
    if(r.req_type==='schedule') act=`<button class="link" data-act="req" data-id="${r.id}" data-a="hold">보류</button><button class="btn" data-act="req" data-id="${r.id}" data-a="approve">${ic('check')}일정 적용</button>`;
  }
  const where=[r.complex,r.unit].filter(Boolean).join(' ')||'아파트 미입력';
  const editing=S.memoEdit===r.id;
  const memo=editing
    ?`<div class="memo-edit"><textarea class="inp" id="memo-${r.id}" maxlength="1000" placeholder="조치 내용, 통화 내용 등 내부 메모 (고객에게 안 보여요)">${esc(r.staff_memo||'')}</textarea><div class="row"><span class="grow"></span><button class="link" data-act="memoCancel">취소</button><button class="btn" data-act="memoSave" data-id="${r.id}">메모 저장</button></div></div>`
    :r.staff_memo?`<div class="memo"><p>${esc(r.staff_memo)}</p><div class="row">${byName(r.memo_name,r.memo_at)}<span class="grow"></span><button class="link" data-act="memoEdit" data-id="${r.id}">메모 수정</button></div></div>`
    :`<button class="link memo-add" data-act="memoEdit" data-id="${r.id}">+ 메모 쓰기</button>`;
  return `<article class="card req${r.urgent?' is-urgent':''}${r.done_at?' is-done':''}${S.sel.includes(r.id)?' is-sel':''}">
    <div class="row"><label class="sel"><input type="checkbox" data-rsel="${r.id}" ${S.sel.includes(r.id)?'checked':''} aria-label="선택 (휴지통으로 보낼 요청)"></label><span class="pill t-${r.req_type}">${RT[r.req_type]||r.req_type}</span>${r.urgent?'<span class="pill p-urgent">긴급</span>':''}${r.done_at?'<span class="pill p-ok">완료</span>':''}<span class="grow"></span><span class="sub" title="고객 앱에 보이는 상태">고객 화면: ${statusPill(r.status,r.req_type)}</span></div>
    <div class="who"><span class="apt">${esc(where)}</span><span class="car">${esc(r.car_number||'-')}</span></div>
    <p class="sub" style="margin-top:-6px">${esc(r.customer_name||'')}${r.car_model?' · '+esc(r.car_model):''}${r.wash_plan?' · 월 '+r.wash_plan+'회':''}</p>
    ${phoneLine(r.phone,'r'+r.id)}
    <p class="text msg">${esc(r.message)}</p>
    ${act?`<div class="row"><span class="grow sub">신청 처리</span>${act}</div>`:''}
    <div class="flags">
      <label class="flag f-urgent"><input type="checkbox" data-rflag="urgent" data-id="${r.id}" ${r.urgent?'checked':''} ${r.done_at?'disabled':''}><span>긴급</span></label>
      <label class="flag"><input type="checkbox" data-rflag="check" data-id="${r.id}" ${r.checked_at?'checked':''} ${r.done_at?'disabled':''}><span>확인</span>${r.checked_at?byName(r.checked_name,r.checked_at):''}</label>
      <label class="flag"><input type="checkbox" data-rflag="done" data-id="${r.id}" ${r.done_at?'checked':''}><span>완료</span>${r.done_at?byName(r.done_name,r.done_at):''}</label>
    </div>
    ${memo}
    <div class="row"><span class="sub grow">접수 ${when(r.created_at)}</span></div></article>`;
}

/* ---------- 탭: 가입 승인 ---------- */
function accView(){
  return `<div class="row"><div class="grow"><h1 class="h">고객 가입 승인</h1><p class="sub">고객 앱에 가입한 고객을 계약 정보와 연결해요. 승인하면 고객에게 '가입이 승인되었어요' 알림이 가요.</p></div>
    <button class="chip" aria-pressed="${!S.accAll}" data-act="accAll" data-v="0">승인 대기</button><button class="chip" aria-pressed="${S.accAll}" data-act="accAll" data-v="1">전체</button></div>
  ${S.accs.length?`<div class="grid">${S.accs.map(a=>{
    const cand=a.candidate_customer_id;
    return `<article class="card"><div class="row"><b class="grow">${esc(a.name)} <span class="sub">(${esc(a.login_id)})</span></b><span class="pill ${a.account_status==='대기'?'p-new':a.account_status==='거절'?'p-hold':'p-ok'}">${esc(a.account_status)}</span></div>
      <p class="sub">가입 정보 · 차량 ${esc(a.car_number)} · ${when(a.created_at)}</p>
      ${phoneLine(a.phone,'a'+a.user_id)}
      ${cand?`<div class="text"><b>${a.customer_id?'연결된':'찾은'} 계약 고객</b><br>${esc(a.candidate_name)} · ${esc([a.candidate_complex,a.candidate_unit].filter(Boolean).join(' '))} · ${esc(a.candidate_car)}</div>`
        :`<div class="text" style="background:#F8E3DD;color:#7A2E1C">휴대폰·차량번호가 같은 계약 고객을 찾지 못했어요. 아래에서 직접 골라 승인할 수 있어요.</div>`}
      ${a.account_status!=='승인'?`${!cand?`<select class="inp" id="pick-${a.user_id}" aria-label="연결할 계약 고객"><option value="">계약 고객 고르기</option>${S.customers.map(c=>`<option value="${c.id}">${esc(c.name)} · ${esc(c.complex)} ${esc(c.unit||'')} · ${esc(c.car_number||'')}</option>`).join('')}</select>`:''}
      <div class="row" style="justify-content:flex-end"><button class="btn2 danger" data-act="acc-reject" data-u="${a.user_id}">거절</button><button class="btn" data-act="acc-approve" data-u="${a.user_id}" data-c="${cand||''}">${ic('check')}승인</button></div>`:''}
    </article>`;}).join('')}</div>`:`<div class="empty">${S.accAll?'가입한 고객이 없어요.':'승인을 기다리는 가입이 없어요.'}</div>`}`;
}

/* ---------- 탭: 세차 일정 ---------- */
function jobsView(){
  const done=S.jobs.filter(j=>j.status==='완료').length, wait=S.jobs.filter(j=>j.status==='대기').length, skip=S.jobs.filter(j=>j.status==='미작업').length;
  const fs=fieldStaff();
  return `<div class="row"><div class="grow"><h1 class="h">세차 일정</h1><p class="sub">날짜를 고르면 지정 요일 고객이 자동으로 들어가요. 직원 앱에서도 그 날짜를 열면 자동으로 채워져요.</p></div></div>
  <div class="row"><button class="btn2" data-act="jday" data-d="-1">이전</button><input type="date" class="inp" id="jday" value="${S.jobDay}" aria-label="날짜"><button class="btn2" data-act="jday" data-d="1">다음</button>
    <span class="grow"></span><button class="btn gold" data-act="gen">${kdate(S.jobDay)} 일정 만들기</button></div>
  <div class="summary"><div style="background:var(--gold-soft)"><b>${wait}</b><span>세차대기</span></div><div style="background:var(--ok)"><b>${done}</b><span>세차완료</span></div><div style="background:var(--skip)"><b>${skip}</b><span>미작업</span></div><div style="background:var(--card);border:1px solid var(--line)"><b>${S.jobs.length}</b><span>전체</span></div></div>
  <div class="card"><div class="row"><b class="grow">차량 추가</b><select class="inp" id="add-cust" style="min-width:260px" aria-label="추가할 고객"><option value="">고객 고르기</option>${S.customers.map(c=>`<option value="${c.id}">${esc(c.complex)} ${esc(c.unit||'')} · ${esc(c.car_number||c.name)}</option>`).join('')}</select><button class="btn2" data-act="add-job">${kdate(S.jobDay)}에 추가</button></div></div>
  ${S.jobs.length?`<div class="tbl"><table><thead><tr><th>차량번호</th><th>차종·색상</th><th>아파트</th><th>담당 직원</th><th>실내세차</th><th>상태</th><th></th></tr></thead><tbody>
    ${S.jobs.map(j=>{const c=j.customers||{};return `<tr><td><b class="car" style="font-size:14px">${esc(c.car_number||'-')}</b>${j.moved_from?`<br><span class="sub">원래 ${kdate(j.moved_from)}</span>`:''}</td>
      <td>${esc([c.car_model,c.car_color].filter(Boolean).join(' · ')||'-')}</td><td>${esc([c.complex,c.unit].filter(Boolean).join(' '))}</td>
      <td><select data-jstaff="${j.id}" aria-label="담당 직원"><option value="">미배정</option>${fs.map(s=>`<option value="${s.id}" ${s.id===j.staff_id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></td>
      <td><label class="row" style="gap:6px"><input type="checkbox" data-jint="${j.id}" ${j.interior?'checked':''} ${j.status!=='대기'?'disabled':''}>${j.interior?(j.interior_done?'완료':'포함'):'없음'}</label></td>
      <td><span class="pill ${j.status==='완료'?'p-ok':j.status==='미작업'?'p-hold':'p-new'}">${j.status}</span></td>

function prRange(){
  const pr=S.pr, P=Number(S.cset.payday)||20, now=new Date();
  if(pr.mode==='custom') return {from:pr.from||keyOf(new Date(now.getFullYear(),now.getMonth(),1)),to:pr.to||keyOf(now)};
  if(pr.mode==='month'){ const a=new Date(now.getFullYear(),now.getMonth()+pr.off,1); return {from:keyOf(a),to:keyOf(new Date(a.getFullYear(),a.getMonth()+1,0))}; }
  // 월급 기간: (지난달 기준일+1) ~ (이번 달 기준일). 오늘이 기준일 지났으면 다음 기간
  const endM=now.getDate()<=P?now.getMonth():now.getMonth()+1;
  const end=new Date(now.getFullYear(),endM+pr.off,P), start=new Date(now.getFullYear(),endM+pr.off-1,P+1);
  return {from:keyOf(start),to:keyOf(end)};
}

const HMAP={아파트:'complex',아파트명:'complex',단지:'complex',단지명:'complex',동호수:'unit',동호:'unit',호수:'unit',차량번호:'car_number',차번호:'car_number',차량:'car_number',상태:'wash_status',세차상태:'wash_status',

function toISO(v){ if(v instanceof Date&&!isNaN(v)){ const d=new Date(v.getTime()+12*3600e3); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

  let y=Number(m[1]); if(y<100) y+=2000; return `${y}-${pad(Number(m[2]))}-${pad(Number(m[3]))}`; }
function parseRows(rows){

    for(const [h,v] of Object.entries(row)){ const k=HMAP[String(h).replace(/[\s()·.\-_/]/g,'')]; if(!k) continue;

/* 넓은 표 도우미: 앞쪽 칸 고정 · ◀ ▶ 버튼 · 다시 그려도 보던 위치 유지 */
const HS={pos:{}};
function hsKey(el){ return el.classList.contains('coll-tbl')?'coll':'cm:'+(S.tab||''); }
function hsSave(){ document.querySelectorAll('.tbl.cm-tbl').forEach(el=>{ if(el._hs) HS.pos[hsKey(el)]={l:el.scrollLeft,t:el.scrollTop}; }); }
function hsEnhance(){
  document.querySelectorAll('.tbl.cm-tbl').forEach(el=>{
    const tb=el.querySelector('table'); if(!tb) return;
    // 앞쪽 칸 고정: 넓은 화면은 체크 · 아파트 · 동호수 · 차량번호, 좁은 화면은 체크 · 차량번호만
    const heads=[...tb.querySelectorAll('thead th')], names=heads.map(h=>h.textContent.trim());
    const want=window.innerWidth<700?['','차량번호']:['','아파트','동·호수','차량번호'];
    const idx=want.map(w=>names.indexOf(w)).filter(i=>i>=0);
    let left=0; const lefts=[];
    idx.forEach(i=>{ lefts.push([i,left]); left+=heads[i].getBoundingClientRect().width; });
    if(left>el.clientWidth*0.6) lefts.length=Math.max(1,lefts.length-2);
    tb.querySelectorAll('tr').forEach(tr=>{ const cells=tr.children; if(cells.length<heads.length) return;
      lefts.forEach(([i,l],k)=>{ const c=cells[i]; if(!c) return; c.classList.add('stk'); c.style.left=l+'px'; c.classList.toggle('stk-last',k===lefts.length-1); }); });
    // ◀ ▶ 버튼 (표 바로 위)
    if(!(el.previousElementSibling&&el.previousElementSibling.classList.contains('hs-bar'))){
      const bar=document.createElement('div'); bar.className='hs-bar';
      bar.innerHTML='<span class="sub">표가 넓어요 · ◀ ▶ 버튼이나 Shift+마우스 휠로 좌우 이동</span><button type="button" data-hs="-1" aria-label="왼쪽으로">◀</button><button type="button" data-hs="1" aria-label="오른쪽으로">▶</button>';
      el.parentNode.insertBefore(bar,el);
    }
    const p=HS.pos[hsKey(el)]; if(p){ el.scrollLeft=p.l; el.scrollTop=p.t; }
    const upd=()=>{ const bar=el.previousElementSibling; if(!bar||!bar.classList.contains('hs-bar')) return; const max=el.scrollWidth-el.clientWidth;
      bar.style.display=max>4?'':'none'; const [a,b]=bar.querySelectorAll('button'); a.disabled=el.scrollLeft<=2; b.disabled=el.scrollLeft>=max-2; };
    if(!el._hs){ el._hs=1; el.addEventListener('scroll',()=>{ HS.pos[hsKey(el)]={l:el.scrollLeft,t:el.scrollTop}; upd(); },{passive:true}); }
    upd();
  });
}

document.addEventListener('toggle',e=>{ if(e.target&&e.target.id==='mgrBox') S.mgrOpen=e.target.open; },true);
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='mineOnly'){ S.mineOnly=t.checked; S.collApt=''; S.collSel=[]; render(); return; }
  if(t.dataset.cx!==undefined){ const a=t.dataset.cx; S.cxDraft=S.cxDraft||[]; S.cxDraft=t.checked?[...new Set([...S.cxDraft,a])]:S.cxDraft.filter(x=>x!==a); S.setOpen=true; render(); return; }
  if(t.dataset.rflag){
    const id=Number(t.dataset.id), f=t.dataset.rflag, on=t.checked;
    t.disabled=true;
    try{
      await q(db.rpc('set_request_flag',{p_id:id,p_flag:f,p_on:on})); kickPush();
      toast(f==='urgent'?(on?'긴급으로 표시했어요.':'긴급 표시를 뺐어요.'):f==='check'?(on?'확인으로 표시했어요.':'확인을 취소했어요.'):(on?'완료 처리했어요.':'완료를 취소했어요.'));
    }catch(err){ toast(friendly(err),true); }
    await refreshCounts(); await loadTab(); return;
  }
  if(t.dataset.rsel){ const id=Number(t.dataset.rsel); S.sel=t.checked?[...new Set([...S.sel,id])]:S.sel.filter(x=>x!==id); render(); return; }
  if(t.id==='reqApt'){ S.reqApt=t.value; await loadTab(); return; }
  if(t.id==='cmApt'){ S.cmApt=t.value; render(); return; }
  if(t.dataset.nstar){ S.noteStar[Number(t.dataset.nstar)]=t.checked; return; }
  if(t.dataset.cmsel){ const id=Number(t.dataset.cmsel); S.cmSel=t.checked?[...new Set([...S.cmSel,id])]:S.cmSel.filter(x=>x!==id); render(); return; }
  if(t.id==='nm-star'){ S.nmStar=t.checked; return; }
  if(t.id==='pauseDate'){ S.pauseDate=t.value; return; }
  if(t.dataset.collsel){ const id=Number(t.dataset.collsel); S.collSel=t.checked?[...new Set([...S.collSel,id])]:S.collSel.filter(x=>x!==id); render(); return; }
  if(t.dataset.cnstar){ S.cnStar[Number(t.dataset.cnstar)]=t.checked; return; }
  if(t.id==='payUseDef'){ S.payUseDef=t.checked; if(S.dialog&&S.dialog.rebuild){ S.dialog.extra=S.dialog.rebuild(); render(); } return; }
  if(t.id==='payMethod'||t.id==='payProof'||t.id==='payAcct'){ if(t.id==='payMethod') S.payMethod=t.value; if(t.id==='payProof') S.payProof=t.value; if(t.id==='payAcct') S.payAcct=t.value;
    if(S.dialog&&S.dialog.rebuild){ S.dialog.extra=S.dialog.rebuild(); if(t.id==='payMethod') render(); } return; }
  if(t.id==='prMethod'){ S.pr.method=t.value; render(); return; }
  if(t.id==='prProof'){ S.pr.proof=t.value; render(); return; }
  if(t.id==='prAcct'){ S.pr.acct=t.value; render(); return; }
  if(t.id==='prWho'){ S.pr.who=t.value; render(); return; }
  if(t.dataset.pvk!==undefined||t.dataset.pvs!==undefined||t.dataset.pvc!==undefined||t.dataset.pvl!==undefined){ const d=S.pvDraft; if(!d) return;
    if(t.dataset.pvk!==undefined){ const k=t.dataset.pvk; d.kinds=t.checked?PAY_METHODS.filter(m=>d.kinds.includes(m)||m===k):d.kinds.filter(m=>m!==k); }
    if(t.dataset.pvs!==undefined) d.sec[t.dataset.pvs]=t.checked?1:0;
    if(t.dataset.pvc!==undefined){ const k=t.dataset.pvc; d.cards=t.checked?PV_CARDS.map(([x])=>x).filter(x=>d.cards.includes(x)||x===k):d.cards.filter(x=>x!==k); }
    if(t.dataset.pvl!==undefined) d.cols[t.dataset.pvl]=t.checked?1:0;
    if(S.dialog&&S.dialog.rebuild){ S.dialog.extra=S.dialog.rebuild(); render(); } return; }
  if(t.dataset.paypick){ S.payPick[t.dataset.paypick]=t.checked; if(t.dataset.m&&S.dialog){ S.payAmtTouched=false; S.dialog.extra=payExtra(Number(t.dataset.m)); render(); } return; }
  if(t.id==='payDate'){ S.payDate=t.value; return; }
  if(t.dataset.cf&&S.cform){ S.cform[t.dataset.cf]=t.value; if((t.dataset.cf==='pay_method'||t.dataset.cf==='interior_plan')&&S.dialog&&S.dialog.rebuild){ S.dialog.extra=S.dialog.rebuild(); render(); } return; }
  if(t.dataset.intsel){ const id=Number(t.dataset.intsel); S.intSel=t.checked?[...new Set([...S.intSel,id])]:S.intSel.filter(x=>x!==id); render(); return; }
  if(t.dataset.respick){ const id=Number(t.dataset.respick); S.resPick=t.checked?[...new Set([...S.resPick,id])]:S.resPick.filter(x=>x!==id); if(S.dialog) S.dialog.extra=resAddHtml(); render(); return; }
  if(t.id==='resStaff'){ S.resStaff=t.value; if(S.dialog) S.dialog.extra=resAddHtml(); return; }
  if(t.id==='resNotify'){ S.resNotify=t.checked; if(S.dialog) S.dialog.extra=resAddHtml(); return; }
  if(t.id==='cancelNotify'){ S.cancelNotify=t.checked; if(S.dialog&&S.dialog.extra) S.dialog.extra=S.dialog.extra.replace(t.checked?'id="cancelNotify">':'id="cancelNotify" checked>', t.checked?'id="cancelNotify" checked>':'id="cancelNotify">'); return; }
  if(t.id==='wdAll'){ S.wdAll=t.checked; if(!S.wdDraft) S.wdDraft=[...S.closedWd]; render(); return; }
  if(t.id==='intDate'){ S.intDate=t.value; render(); return; }
  if(t.id==='intStaff'){ S.intStaff=t.value; return; }
  if(t.id==='capVal'){ S.capVal=t.value; return; }
  if(t.id==='collApt'){ S.collApt=t.value; render(); return; }
  if(t.id==='custFile'&&t.files&&t.files[0]){ const f=t.files[0]; t.value=''; await custImportFile(f); return; }
  if(t.dataset&&t.dataset.cu&&S.cuform){ S.cuform[t.dataset.cu]=t.value; if((t.dataset.cu==='wash_status'||t.dataset.cu==='interior_plan')&&S.dialog&&S.dialog.rebuild){ S.dialog.extra=S.dialog.rebuild(); render(); } return; }
  if(t.id==='collFile'&&t.files&&t.files[0]){ const f=t.files[0]; t.value=''; await collImportFile(f); return; }
  if(t.id==='reqType'){ S.reqType=t.value; render(); return; }
  if(t.dataset.tddone){ const id=Number(t.dataset.tddone), on=t.checked; t.disabled=true; try{ await q(db.rpc('set_admin_todo_done',{p_ids:[id],p_done:on})); toast(on?'완료했어요.':'완료를 취소했어요.'); }catch(err){ toast(friendly(err),true); } await refreshCounts(); await loadTab(); return; }
  if(/^td(Pri|Who|Due)$/.test(t.id)){ tdRead(); return; }
  if(/^nt(Target|Imp|Start|End)$/.test(t.id)){ ntRead(); if(t.id==='ntStart') render(); return; }
  if(t.id==='rdApt'){ S.rdApt=t.value; render(); return; }
  if(t.id==='rdCancel'){ S.rdCancel=t.checked; render(); return; }
  if(t.dataset.rdsel){ const id=Number(t.dataset.rdsel); S.rdSel=t.checked?[...new Set([...S.rdSel,id])]:S.rdSel.filter(x=>x!==id); render(); return; }
  if(t.id==='lday'&&t.value){ S.liveDay=t.value; S.live=null; render(); await loadTab(); return; }
  if(t.id==='frMine'){ S.frMine=t.checked; S.frows=null; render(); await loadTab(); return; }
  if(t.dataset.frsel){ const id=Number(t.dataset.frsel); S.frSel=t.checked?[...new Set([...S.frSel,id])]:S.frSel.filter(x=>x!==id); render(); return; }
  if(t.dataset.fmgr){ const sid=t.dataset.fmgr, mid=t.value||null; t.disabled=true; try{ await q(db.rpc('set_field_manager',{p_staff:sid,p_manager:mid})); toast(mid?`담당 관리자를 ${staffName(mid)}(으)로 정했어요.`:'관리자 전체로 바꿨어요.'); }catch(err){ toast(friendly(err),true); } await loadTab(); return; }
  if(t.id==='jday'&&t.value){ S.jobDay=t.value; await loadTab(); return; }
  if(t.dataset.jstaff){ await act(()=>q(db.from('wash_jobs').update({staff_id:t.value||null}).eq('id',Number(t.dataset.jstaff))),'담당 직원을 바꿨어요.'); return; }
  if(t.dataset.jint){ await act(()=>q(db.from('wash_jobs').update({interior:t.checked}).eq('id',Number(t.dataset.jint))),null); return; }
  if(t.dataset.nsel){ const id=Number(t.dataset.nsel); S.noticeSel=t.checked?[...new Set([...S.noticeSel,id])]:S.noticeSel.filter(x=>x!==id); render(); }
});
document.addEventListener('input',e=>{
  if(/^nt(Title|Body)$/.test(e.target.id)){ ntRead(); return; }
  if(/^td(Title|Memo)$/.test(e.target.id)){ tdRead(); return; }
  if(e.target.id==='rdQ'){ S.rdQ=e.target.value; const pos=e.target.selectionStart; render(); const el=$('#rdQ'); if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(_){} } return; }
  if(e.target.id==='rdTplIn'){ S.rdTplDraft=e.target.value; const pv=$('#rdPrev'); const r=(S.rounds||[]).find(x=>x.customer_id===S.rdSel[0]); if(pv&&r) pv.textContent=rdFill(S.rdTplDraft,r); if(S.dialog&&S.rdRows) S.dialog.extra=rdNoticeExtra(S.rdRows); return; }
  if(e.target.id==='rdTitle'){ S.rdTitle=e.target.value; return; }
  if(e.target.id&&e.target.id.startsWith('frr-')){ S.frReply[Number(e.target.id.slice(4))]=e.target.value; return; }
  if(e.target.id==='custQ'){ S.custQ=e.target.value; render(); }
  if(e.target.id==='reqQ'){ S.reqQ=e.target.value; }
  if(e.target.id==='cmQ'){ S.cmQin=e.target.value; }
  if(e.target.id==='nm-body'){ S.nmBody=e.target.value; }
  if(e.target.id==='resQ'){ S.resQ=e.target.value; if(S.dialog){ S.dialog.extra=resAddHtml(); render(); const el=$('#resQ'); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } } }
  if(e.target.id==='collQ'){ S.collQin=e.target.value; }
  if(e.target.dataset&&e.target.dataset.cf&&S.cform){ S.cform[e.target.dataset.cf]=e.target.value; }
  if(e.target.dataset&&e.target.dataset.cu&&S.cuform){ S.cuform[e.target.dataset.cu]=e.target.value; }
  if(e.target.id==='payDate'){ S.payDate=e.target.value; }
  if(e.target.id==='payAmt'){ S.payAmt=e.target.value; S.payAmtTouched=true; const picks=payPicked(S.payMid), need=picks.reduce((a,b)=>a+b.remaining,0), h=$('#payHint'); if(h) h.innerHTML=payHint(need,Number(String(S.payAmt).replace(/[^0-9]/g,''))||0); if(S.dialog) S.dialog.extra=payExtra(S.payMid); return; }
  if(e.target.id==='payNote'){ S.payNote=e.target.value; if(S.dialog) S.dialog.extra=payExtra(S.payMid); return; }
  if(e.target.id==='payNote2'){ S.payNote=e.target.value; return; }
  if(e.target.id==='adjVal'){ S.adjVal=e.target.value; return; }
  if(e.target.id==='adjNote'){ S.adjNote=e.target.value; return; }
  if(e.target.id&&e.target.id.startsWith('cnote-')){ S.cnDraft[Number(e.target.id.slice(6))]=e.target.value; }
  if(e.target.id==='pauseDate'){ S.pauseDate=e.target.value; }
  if(e.target.id&&e.target.id.startsWith('note-')){ S.noteDraft[Number(e.target.id.slice(5))]=e.target.value; }
  if(e.target.id==='notice'){ S.notice=e.target.value; const b=$('#nsend'); if(b) b.disabled=!(S.noticeSel.length&&S.notice.trim()); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.target.id==='tdTitle'||e.target.id==='tdMemo')&&!e.isComposing){ e.preventDefault(); tdSave(); return; } if(e.key==='Escape'&&S.dialog&&!S.busy){S.dialog=null;render();} else if(e.key==='Escape'&&S.noteModal&&!S.busy){S.noteModal=null;render();} });
document.addEventListener('submit',async e=>{
  if(e.target.id==='rdsearch'){ e.preventDefault(); return; }
  if(e.target.id==='collsearch'){ e.preventDefault(); S.collQin=($('#collQ')||{}).value||''; S.collQ=S.collQin.trim(); render(); return; }
  if(e.target.id==='cmsearch'){ e.preventDefault(); S.cmQin=($('#cmQ')||{}).value||''; S.cmQ=S.cmQin.trim(); render(); return; }
  if(e.target.id==='reqsearch'){ e.preventDefault(); S.reqQ=($('#reqQ')||{}).value||''; await loadTab(); return; }
  if(e.target.id!=='login') return; e.preventDefault();
  const em=$('#em').value.trim(), pw=$('#pw').value;
  if(!em||!pw){ S.err='이메일과 비밀번호를 입력해 주세요.'; render(); return; }
  const autoOn=!!($('#auto')||{}).checked; staffSetAuto(autoOn);
  S.busy=true; S.err=''; render(); $('#em').value=em; if($('#auto')) $('#auto').checked=autoOn;
  const {error}=await db.auth.signInWithPassword({email:em,password:pw});
  S.busy=false; if(error){ S.err=friendly(error); render(); $('#em').value=em; }
});
async function start(){
  try{ const ok=await loadBase(); if(ok){ if(window.StaffNotice) StaffNotice.reload(); await refreshCounts(); await loadTab(); return; } }catch(e){ S.err=friendly(e); }
  render();
}
(async function boot(){
  if(!db){ S.ready=true; render(); return; }
  let {data}=await db.auth.getSession();
  // 자동 로그인을 끈 경우: 앱(브라우저)을 완전히 닫았다 열면 로그아웃
  const alive=staffAlive();
  if(data.session && !staffGetAuto() && !alive){ await db.auth.signOut({scope:'local'}); data={session:null}; }
  try{ sessionStorage.setItem(STAFF_ALIVE_KEY,'1'); }catch(_){}
  staffStartBeat();
  S.session=data.session; S.ready=true;
  { const h=(location.hash||'').slice(1); if(TABS.some(([k])=>k===h)) S.tab=h; }
  if(S.session) await start(); else render();
  // 실시간 세차 현황 · 현장전달: 30초마다 자동 새로고침 (입력 중이거나 창이 숨겨져 있으면 건너뜀)
  let tick=0;
  setInterval(async()=>{
    if(!S.session||!S.me||S.dialog||S.pview||S.busy||document.visibilityState!=='visible') return;
    const ae=document.activeElement; if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&ae.type!=='checkbox') return;
    tick++;
    if(S.tab==='live'||S.tab==='field') await loadTab();
    else if(tick%2===0){ const a=S.cntReq,b=S.cntAcc,c=S.cntFieldAll; await refreshCounts(); if(a!==S.cntReq||b!==S.cntAcc||c!==S.cntFieldAll) render(); }
  },30000);
  db.auth.onAuthStateChange(async (ev,session)=>{ const was=!!S.session; S.session=session; if(!session){ S.me=null; render(); return; } if(!was){ S.err=''; await start(); } });
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}</script>
